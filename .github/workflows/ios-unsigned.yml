name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'build.js'
      - 'assets/app-icon.png'
      - 'src/core/05-haptics.js'
      - 'src/modules/150-speed-preserved.js'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: write

jobs:
  build-ios-unsigned:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Create iOS project when it is not committed
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Apply app icon
        run: |
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_SET"
          sips -z 1024 1024 assets/app-icon.png --out "$ICON_SET/AppIcon-512@2x.png"

      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26 was not found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Archive unsigned App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/App.xcarchive \
            archive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          VERSION=$(node -e "const fs=require('fs'); const s=fs.readFileSync('src/core/00-constants.js','utf8'); const m=s.match(/App\\.VERSION\\s*=\\s*['\"]([^'\"]+)['\"]/); process.stdout.write(m ? m[1] : 'dev')")
          mkdir -p build/ipa/Payload
          cp -R build/ios/App.xcarchive/Products/Applications/App.app build/ipa/Payload/App.app
          cd build/ipa
          zip -qry "kaogong-review-${VERSION}-unsigned.ipa" Payload
          echo "IPA_NAME=kaogong-review-${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Publish IPA into workspace
        shell: bash
        env:
          IPA_NAME: ${{ env.IPA_NAME }}
        run: |
          VERSION="${IPA_NAME#kaogong-review-}"
          VERSION="${VERSION%-unsigned.ipa}"
          mkdir -p "downloads/${VERSION}"
          cp "build/ipa/${IPA_NAME}" "downloads/${VERSION}/${IPA_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/${VERSION}/${IPA_NAME}"
          if git diff --cached --quiet; then
            echo "IPA already exists in the workspace"
          else
            git commit -m "chore: publish ${IPA_NAME} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: build/ipa/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14
