name: Build native unsigned iOS IPA (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-ios:
    if: ${{ false }}
    runs-on: macos-15

    steps:
      - name: Checkout native branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate native version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          VERSION=$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' native-ios/project.yml)
          if [[ ! "$VERSION" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[1-9][0-9]*$ ]]; then
            echo "Native version must use month.day.iteration, got: $VERSION"
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            DATE_PREFIX=$(TZ=Asia/Shanghai date '+%-m.%-d.')
            if [[ "$VERSION" != "$DATE_PREFIX"* ]]; then
              echo "Native version must start with today's Asia/Shanghai date: $DATE_PREFIX"
              exit 1
            fi

            if [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              PREVIOUS_VERSION=$(git show "$BEFORE_SHA:native-ios/project.yml" 2>/dev/null | awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' || true)
              if [ "$VERSION" = "$PREVIOUS_VERSION" ] && [ -f "downloads/native/${VERSION}/kaogong-review-native-${VERSION}-unsigned.ipa" ]; then
                echo "Native source changed after $VERSION was already published; increment the iteration number"
                exit 1
              fi
            fi
          fi

          echo "Validated native version: $VERSION"

      - name: Select Xcode 26
        shell: bash
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -n 1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26 was not found on this runner"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare native app icon
        run: |
          ICON_SET="native-ios/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_SET"
          sips -z 1024 1024 native-ios/Resources/NativeAppIcon.png --out "$ICON_SET/AppIcon-1024.png"

      - name: Generate Xcode project
        working-directory: native-ios
        run: xcodegen generate

      - name: Archive native App
        run: |
          xcodebuild \
            -project native-ios/KaogongReviewNative.xcodeproj \
            -scheme KaogongReviewNative \
            -destination 'generic/platform=iOS' \
            -archivePath build/native-ios/KaogongReviewNative.xcarchive \
            archive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify native App resources
        shell: bash
        run: |
          APP_PATH="build/native-ios/KaogongReviewNative.xcarchive/Products/Applications/KaogongReviewNative.app"
          EXPECTED_VERSION=$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' native-ios/project.yml)
          EXPECTED_BUILD=$(awk '/CURRENT_PROJECT_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' native-ios/project.yml)
          test -x "$APP_PATH/KaogongReviewNative"
          test -f "$APP_PATH/Info.plist"
          test -f "$APP_PATH/Assets.car"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          if [ "$APP_VERSION" != "$EXPECTED_VERSION" ] || [ "$APP_BUILD" != "$EXPECTED_BUILD" ]; then
            echo "IPA version mismatch: expected ${EXPECTED_VERSION} (${EXPECTED_BUILD}), got ${APP_VERSION} (${APP_BUILD})"
            exit 1
          fi
          DEVICE_FAMILY=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP_PATH/Info.plist")
          if [ "$DEVICE_FAMILY" != "2" ] || /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:1' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "Expected an iPad-only IPA, got UIDeviceFamily:"
            /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$APP_PATH/Info.plist"
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "Deprecated UIRequiresFullScreen must not be present"
            exit 1
          fi
          SCENE_SUPPORT=$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes' "$APP_PATH/Info.plist")
          if [ "$SCENE_SUPPORT" != "true" ]; then
            echo "UIApplicationSceneManifest must explicitly enable scene-based multi-window support"
            exit 1
          fi
          APP_ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons~ipad:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")
          if [ "$APP_ICON_NAME" != "AppIcon" ]; then
            echo "Unexpected iPad app icon name: $APP_ICON_NAME"
            exit 1
          fi
          echo "Verified version ${APP_VERSION} (${APP_BUILD}), scene lifecycle, iPad-only window configuration, executable, Info.plist, Assets.car, and AppIcon metadata"

      - name: Package native unsigned IPA
        shell: bash
        run: |
          VERSION=$(awk '/MARKETING_VERSION:/ { gsub(/"/, "", $2); print $2; exit }' native-ios/project.yml)
          IPA_NAME="kaogong-review-native-${VERSION}-unsigned.ipa"
          mkdir -p build/native-ipa/Payload
          cp -R build/native-ios/KaogongReviewNative.xcarchive/Products/Applications/KaogongReviewNative.app build/native-ipa/Payload/
          cd build/native-ipa
          zip -qry "$IPA_NAME" Payload
          echo "NATIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"

      - name: Publish native IPA into workspace
        shell: bash
        env:
          IPA_NAME: ${{ env.IPA_NAME }}
          NATIVE_VERSION: ${{ env.NATIVE_VERSION }}
        run: |
          mkdir -p "downloads/native/${NATIVE_VERSION}"
          cp "build/native-ipa/${IPA_NAME}" "downloads/native/${NATIVE_VERSION}/${IPA_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "downloads/native/${NATIVE_VERSION}/${IPA_NAME}"
          if git diff --cached --quiet; then
            echo "Native IPA already exists in the workspace"
          else
            git commit -m "chore: publish ${IPA_NAME} [skip ci]"
            git push origin HEAD:codex/ios-native-rewrite
          fi

      - name: Upload native unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: build/native-ipa/${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14

  check-native-ios:
    uses: ./.github/workflows/ios-native-build-check.yml
