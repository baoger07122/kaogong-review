name: KaogongWindowTest
options:
  bundleIdPrefix: com.baoger07122
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "8.28.8"
    CURRENT_PROJECT_VERSION: "12"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  KaogongWindowTest:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baoger07122.kaogongreview.windowtesttoolbar
        PRODUCT_NAME: KaogongWindowTest
        TARGETED_DEVICE_FAMILY: "2"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 窗口工具栏测试
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Window Test
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).WindowTestSceneDelegate"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
