        <span class="sidebar__item-name">${s.name}</span>
        ${count > 0 ? `<span class="sidebar__item-count">${count}</span>` : ''}
      `;
      row.querySelector('.sidebar__arrow').addEventListener('click', (e) => {
        e.stopPropagation();
        this._expanded[s.name] = !this._expanded[s.name];
        this.renderSubjectGrid(container);
      });
      row.addEventListener('click', () => {
        this.state.subject = (this.state.subject === s.name) ? null : s.name;
        this.state.module = null;
        this.state.knowledgePoint = null;
        this.refreshAll();
      });
      container.appendChild(row);

      if (expanded) {
        modules.forEach(mod => {
          const mCount = this.state.allNotes.filter(n => n.subject === s.name && n.module === mod).length;
          const sub = document.createElement('div');
          sub.className = 'sidebar__sub' + (isActive && this.state.module === mod ? ' active' : '');
          sub.innerHTML = `
            <span class="sidebar__sub-name">${mod}</span>
            ${mCount > 0 ? `<span class="sidebar__sub-count">${mCount}</span>` : ''}
          `;
          sub.addEventListener('click', (e) => {
            e.stopPropagation();
            this.state.subject = s.name;
            this.state.module = (this.state.module === mod) ? null : mod;
            this.state.knowledgePoint = null;
            this.refreshAll();
          });
          container.appendChild(sub);
        });
      }
    });
  },

  // 考点筛选条（科目-模块由侧边栏管理；仅选中科目后显示）
  renderFilters(container) {
    container.innerHTML = '';
    if (!this.state.subject) return;

    let scope = this.state.allNotes.slice();
    scope = scope.filter(n => n.subject === this.state.subject);
    if (this.state.module) scope = scope.filter(n => n.module === this.state.module);

    const usedKps = new Set();
    scope.forEach(n => { if (n.knowledgePoint) usedKps.add(n.knowledgePoint); });
    if (!usedKps.size) return;

    // 考点顺序跟随标签库（排序后立即生效）
    const libOrder = App.Tags.getKnowledgePoints(this.state.module);
    const kpItems = libOrder.filter(k => usedKps.has(k)).map(k => ({ name: k })).concat(
      Array.from(usedKps).filter(k => !libOrder.includes(k)).map(k => ({ name: k }))
    );
    const row = document.createElement('div');
    row.className = 'tag-select-row';
    row.appendChild(App.Components.tagSelect(
      kpItems,
      this.state.knowledgePoint,
      (kp) => {
        this.state.knowledgePoint = (this.state.knowledgePoint === kp) ? null : kp;
        this.refreshFiltersAndList();
      },
      { kind: 'kp', module: this.state.module, onDone: () => this.refreshFiltersAndList(), placeholder: '考点' }
    ));
    container.appendChild(row);
  },

  // 扁平笔记卡片列表（按标签展示）
  renderList(container) {
    container.innerHTML = '';

    let notes = this.state.allNotes.slice();
    if (this.state.subject) notes = notes.filter(n => n.subject === this.state.subject);
    if (this.state.module) notes = notes.filter(n => n.module === this.state.module);
    if (this.state.knowledgePoint) notes = notes.filter(n => n.knowledgePoint === this.state.knowledgePoint);
    if (this.state.search) {
      const kw = this.state.search.toLowerCase();
      notes = notes.filter(n =>
        n.title.toLowerCase().includes(kw) ||
        (n.content && n.content.toLowerCase().includes(kw))
      );
    }

    const countEl = document.getElementById('note-count');
    if (countEl) countEl.textContent = '共 ' + notes.length + ' 篇';

    // 词语库入口：言语理解（逻辑填空）专属
    if (this.state.subject === '言语理解') {
      const wordDbEntry = document.createElement('div');
      wordDbEntry.className = 'notes-worddb-entry';
      wordDbEntry.innerHTML = `
        <span class="notes-worddb-entry__icon">📚</span>
        <span class="notes-worddb-entry__text">
          <span class="notes-worddb-entry__title">词语库</span>
          <span class="notes-worddb-entry__desc">成语 / 实词 释义与辨析 · 逻辑填空</span>
        </span>
        <span class="notes-worddb-entry__arrow">›</span>
      `;
      wordDbEntry.addEventListener('click', () => {
        App.Router.navigate('worddb?subject=' + encodeURIComponent(this.state.subject) + '&module=' + encodeURIComponent('逻辑填空'));
      });
      container.appendChild(wordDbEntry);
    }

    if (notes.length === 0) {
      container.appendChild(App.Components.emptyState(
        '📝',
        '暂无笔记',
        '点击右下角 + 号开始记录',
        '新建笔记',
        () => {
          App.Draft.clearForm('note');
          // 跟随当前选中的科目-模块
          let q = '';
          if (this.state.subject) {
            q = '?subject=' + encodeURIComponent(this.state.subject);
            if (this.state.module) q += '&module=' + encodeURIComponent(this.state.module);
          }
          App.Router.navigate('note-form' + q);
        }
      ));
      return;
    }

    notes.forEach((note, idx) => container.appendChild(this.buildNoteCard(note, idx)));
  },

  // 单条笔记卡片（去掉科目-模块与考点标签，仅标题 + 元信息）
  buildNoteCard(note, index) {
    const card = document.createElement('div');
    card.className = 'note-item note-item--flat';
    const idxHtml = typeof index === 'number' ? `<span style="display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9999px;background:var(--bg-tertiary);color:var(--text-tertiary);font-size:10px;font-weight:600;margin-right:6px;">${index + 1}</span>` : '';
    card.innerHTML = `
      <div class="note-item__title">${idxHtml}${App.Utils.truncate(note.title, 30)}</div>
      <div class="note-item__meta">
        <span>${App.Utils.formatDate(note.updatedAt, 'MM-DD HH:mm')}</span>
        ${note.linkedErrors && note.linkedErrors.length > 0 ? `<span>关联错题：${note.linkedErrors.length}</span>` : ''}
      </div>
    `;
    card.addEventListener('click', () => App.Router.navigate('note-detail?id=' + note.id));
    return card;
  },

  // 局部刷新：筛选条即时切换不动画，列表仅做进入动画
  refreshFiltersAndList() {
    const filterArea = document.getElementById('note-filter-area');
    const listArea = document.getElementById('note-tree-area');
    if (filterArea) this.renderFilters(filterArea);
    if (listArea) App.Utils.transitionSwap(listArea, (c) => this.renderList(c));
  },

  refreshAll() {
    const sidebar = document.getElementById('note-sidebar');
    const searchArea = document.getElementById('note-search-area');
    const filterArea = document.getElementById('note-filter-area');
    const listArea = document.getElementById('note-tree-area');
    if (sidebar) this.renderSubjectGrid(sidebar);
    if (searchArea) this.renderSearchBar(searchArea);
    if (filterArea) this.renderFilters(filterArea);
    if (listArea) App.Utils.transitionSwap(listArea, (c) => this.renderList(c));
  },

  // 右上角三点菜单
  async _showPageMenu() {
    const action = await App.Components.actionSheet([
      { label: '🔍 ' + (this.state.searchVisible ? '隐藏搜索' : '搜索笔记'), value: 'search' }
    ], '笔记');
    if (action === 'search') {
      this.state.searchVisible = !this.state.searchVisible;
      const searchArea = document.getElementById('note-search-area');
      if (searchArea) this.renderSearchBar(searchArea);
    }
  },

  renderSearchBar(container) {
    container.innerHTML = '';
    if (!this.state.searchVisible) return;
    const searchBar = document.createElement('div');
    searchBar.className = 'search-bar';
    searchBar.style.marginBottom = 'var(--spacing-md)';
    const val = (this.state.search || '').replace(/"/g, '&quot;');
    searchBar.innerHTML = `
      <span class="search-bar__icon">🔍</span>
      <input type="text" placeholder="搜索笔记 / 知识点" id="note-search" value="${val}">
    `;
    container.appendChild(searchBar);
    const input = searchBar.querySelector('input');
    input.addEventListener('input', App.Utils.debounce((e) => {
      this.state.search = e.target.value;
      this.renderList(document.getElementById('note-tree-area'));
    }, 300));
  },

  // ===== 笔记详情页 =====
  async renderDetail(params) {
    const container = document.getElementById('page-note-detail');
    container.innerHTML = '';

    const noteId = params.id;
    if (!noteId) { App.Router.navigate('notes'); return; }

    const note = await App.DB.get('notes', noteId);
    if (!note) {
      App.Components.toast('笔记不存在', 'error');
      App.Router.navigate('notes');
      return;
    }

    // 返回栏 + 右上角：涂鸦铅笔 + 三点菜单
    const header = App.Components.pageHeader('笔记详情', '⋮', () => this._showDetailMenu(note));
    const moreBtn = header.querySelector('.page-header__right');
    if (moreBtn) {
      moreBtn.classList.add('note-detail-more');
      const doodleBtn = document.createElement('button');
      doodleBtn.className = 'detail-header-action';
      doodleBtn.textContent = '✏️';
      doodleBtn.title = '手写笔记';
      doodleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this._openDoodle(note, params);
      });
      moreBtn.parentNode.insertBefore(doodleBtn, moreBtn);
    }
    container.appendChild(header);

    const content = document.createElement('div');
    content.style.cssText = 'padding:var(--spacing-md) var(--page-padding);padding-bottom:var(--spacing-3xl);';

    // 面包屑
    const breadcrumb = document.createElement('div');
    breadcrumb.className = 'breadcrumb';
    breadcrumb.style.marginBottom = 'var(--spacing-md)';
    breadcrumb.innerHTML = `
      <span class="breadcrumb__item">${note.subject}</span>
      <span class="breadcrumb__sep">›</span>
      <span class="breadcrumb__item">${note.module}</span>
      <span class="breadcrumb__sep">›</span>
      <span class="breadcrumb__item">${note.knowledgePoint}</span>
    `;
    content.appendChild(breadcrumb);

    // 标题（点击进入编辑）
    const titleEl = document.createElement('div');
    titleEl.style.cssText = 'font-size:var(--font-xl);font-weight:700;margin-bottom:var(--spacing-md);cursor:pointer;';
    titleEl.textContent = note.title;
    titleEl.addEventListener('click', () => App.Router.navigate('note-form?id=' + note.id));
    content.appendChild(titleEl);

    // 正文（点击进入编辑）
    const bodyEl = document.createElement('div');
    bodyEl.className = 'card';
    bodyEl.setAttribute('data-tap-edit', '');
    bodyEl.style.cssText = 'margin:0 0 var(--spacing-md) 0;line-height:1.8;min-height:80px;';
    bodyEl.innerHTML = note.content
      ? App.Utils.simpleMarkdown(note.content)
      : '<span style="color:var(--text-tertiary);">暂无内容</span>';
    bodyEl.addEventListener('click', () => App.Router.navigate('note-form?id=' + note.id));
    content.appendChild(bodyEl);

    // 编辑时间
    const metaEl = document.createElement('div');
    metaEl.style.cssText = 'font-size:var(--font-xs);color:var(--text-tertiary);margin-bottom:var(--spacing-md);';
    metaEl.textContent = '最后编辑于 ' + App.Utils.formatDateTime(note.updatedAt);
    content.appendChild(metaEl);

    // 关联错题
    if (note.linkedErrors && note.linkedErrors.length > 0) {
      const linkedSection = document.createElement('div');
      linkedSection.className = 'linked-section';
      linkedSection.innerHTML = `<div class="linked-section__title">关联错题（${note.linkedErrors.length}）</div>`;
      for (const errId of note.linkedErrors) {
        try {
          const err = await App.DB.get('errors', errId);
          if (err) {
            const errItem = document.createElement('div');
            errItem.style.cssText = 'padding:8px;margin-bottom:4px;background:var(--bg-tertiary);border-radius:var(--radius-sm);font-size:var(--font-sm);cursor:pointer;';
            errItem.textContent = App.Utils.truncate(err.question, 50);
            errItem.addEventListener('click', () => App.Router.navigate('error-detail?id=' + err.id));
            linkedSection.appendChild(errItem);
          }
        } catch (e) {}
      }
      content.appendChild(linkedSection);
    }

    // 手写笔记区域（点击可重新编辑，可隐藏但保留数据）
    const doodlePreview = document.createElement('div');
    doodlePreview.className = 'doodle-preview' + (note.doodleHidden ? ' doodle-preview--collapsed' : '');
    if (note.doodle && !note.doodleHidden) {
      doodlePreview.innerHTML =
        '<div class="doodle-preview__header">' +
          '<div class="doodle-preview__title">✍️ 手写笔记区域</div>' +
          '<button class="doodle-preview__hide" type="button" title="隐藏（数据仍保留）">✕</button>' +
        '</div>' +
        '<img class="doodle-preview__img" src="' + note.doodle + '" alt="手写笔记">';
      const hideBtn = doodlePreview.querySelector('.doodle-preview__hide');
      hideBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        note.doodleHidden = true;
        try { await App.DB.updateNote(note); } catch (err) {}
        this.renderDetail(params);
      });
    } else if (!note.doodle) {
      doodlePreview.innerHTML = '<div class="doodle-preview__empty">✍️ 暂无手写笔记，点击右上角铅笔图标添加</div>';
    }
    doodlePreview.addEventListener('click', () => this._openDoodle(note, params));
    content.appendChild(doodlePreview);

    container.appendChild(content);
  },

  // ===== 打开手写笔记覆盖层（铅笔图标触发） =====
  _openDoodle(note, params) {
    if (note.doodleHidden) {
      note.doodleHidden = false;
      App.DB.updateNote(note).catch(() => {});
    }
    App.Components.doodleOverlay({
      initial: note.doodle || null,
      onChange: async (dataURL) => {
        note.doodle = dataURL || null;
        try { await App.DB.updateNote(note); } catch (e) {}
      }
    }).then(async (dataURL) => {
      note.doodle = dataURL || null;
      try { await App.DB.updateNote(note); } catch (e) {}
      this.renderDetail(params);
    });
  },

  // ===== 详情页右上角三点菜单 =====
  async _showDetailMenu(note) {
    const action = await App.Components.actionSheet([
      { label: '📋 复制副本', value: 'duplicate' },
      { label: '📂 移动位置', value: 'move' },
      { label: '🗑️ 删除', value: 'delete' }
    ], note.title);
    if (!action) return;

    switch (action) {
      case 'delete': {
        const confirmed = await App.Components.confirm(
          '删除笔记',
          '确定删除「' + note.title + '」？此操作不可撤销。',
          '删除', '取消', true
        );
        if (confirmed) {
          await App.DB.remove('notes', note.id);
          App.Components.toast('已删除', 'success');
          App.Router.navigate('notes');
        }
        break;
      }
      case 'move': {
        // 级联选择：科目 → 模块 → 考点
        const sOpt = App.Constants.SUBJECTS.map(s => ({
          icon: '<span style="font-size:22px">' + s.icon + '</span>',
          label: s.name,
          desc: '选择「' + s.name + '」模块',
          value: s.name
        }));
        const newSubject = await App.Components.centeredPicker(sOpt, '移动到', '选择目标科目');
        if (!newSubject) return;

        const mods = App.Constants.getModules(newSubject);
        const mOpt = mods.map(m => ({ icon: '📂', label: m, desc: newSubject + ' — ' + m, value: m }));
        const newModule = await App.Components.centeredPicker(mOpt, '选择模块', '选择「' + newSubject + '」下的模块');
        if (!newModule) return;

        const kps = App.Tags.getKnowledgePointSuggestions(newModule);
        const kOpt = kps.map(k => ({ icon: '🏷️', label: k, desc: newModule + ' — ' + k, value: k }));
        kOpt.push({ icon: '✏️', label: '+ 自定义考点', desc: '手动输入新考点名称', value: '__custom__' });
        let newKp = await App.Components.centeredPicker(kOpt, '选择考点', '选择或自定义「' + newModule + '」的考点', { kind: 'kp', module: newModule });
        if (newKp === '__custom__') {
          const name = prompt('输入自定义考点名称：');
          if (name && name.trim()) { newKp = name.trim(); App.Tags.addKnowledgePoint(newModule, name.trim()); }
        }
        if (!newKp) return;

        // 更新笔记分类
        note.subject = newSubject;
        note.module = newModule;
        note.knowledgePoint = newKp;
        note.updatedAt = Date.now();
        await App.DB.updateNote(note);
        App.Components.toast('已移动到 ' + newSubject + ' › ' + newModule + ' › ' + newKp, 'success');
        // 刷新当前页面以显示新分类
        this.renderDetail({ id: note.id });
        break;
      }
      case 'duplicate': {
        const copy = JSON.parse(JSON.stringify(note));
        delete copy.id;
        copy.title = (copy.title || '未命名笔记') + ' 副本';
        copy.createdAt = Date.now();
        copy.updatedAt = Date.now();
        const newId = await App.DB.addNote(copy);
        App.Components.toast('已创建副本', 'success');
        // 跳转到新副本的详情页
        App.Router.navigate('note-detail?id=' + newId);
        break;
      }
    }
  },

  // ===== 新建/编辑笔记表单 =====
  renderForm(params) {
    const container = document.getElementById('page-note-form');
    container.innerHTML = '';

    let isEdit = !!params.id;

    let formData = {
      subject: params.subject || '',
      module: '',
      knowledgePoint: '',
      title: '',
      content: '',
      linkedErrors: []
    };

    const loadAndRender = async () => {
      if (isEdit) {
        const note = await App.DB.get('notes', params.id);
        if (note) {
          formData = {
            subject: note.subject || '',
            module: note.module || '',
            knowledgePoint: note.knowledgePoint || '',
            title: note.title || '',
            content: note.content || '',
            linkedErrors: note.linkedErrors || [],
            id: note.id
          };
        }
        formData._formId = params.id;
      } else {
        // 新建/续编：仅当 sessionStorage 记录着「同一篇正在录入」的 id 时才续编；否则一律空白。
        const fid = App.Draft.getFormId('note');
        if (fid) {
          if (App.Draft.formIdIsTemp(fid)) {
            // 尚未建成 DB 记录：从 localStorage 草稿续编
            const d = App.Draft.loadForm('note', fid);
            if (d) Object.assign(formData, d);
            formData._formId = fid;
          } else {
            // 已是真实记录 id：从 DB 续编（权威，不会重复建记录）
            const note = await App.DB.get('notes', fid);
            if (note) {
              isEdit = true;
              formData = {
                subject: note.subject || '', module: note.module || '',
                knowledgePoint: note.knowledgePoint || '', title: note.title || '',
                content: note.content || '', linkedErrors: note.linkedErrors || [],
                id: note.id
              };
              formData._formId = fid;
            }
          }
        }
        if (!formData._formId) {
          formData._formId = App.Draft.newTempId();
          App.Draft.setFormId('note', formData._formId);
        }
        // URL 参数 subject/module 优先级高于草稿（用户从某科目点新建）
        if (params.subject) {
          formData.subject = params.subject;
          if (params.module && App.Constants.getModules(params.subject).indexOf(params.module) !== -1) {
            formData.module = params.module;
          }
        }
        // 仍未指定科目时，默认带入上次选择的科目-模块
        if (!formData.subject) {
          const last = App.Utils.rememberSelect.get('note');
          if (last && last.subject) {
            formData.subject = last.subject;
            formData.module = (last.module && App.Constants.getModules(last.subject).indexOf(last.module) !== -1) ? last.module : '';
          }
        }
      }
      buildForm();
    };

    const buildForm = () => {
      // 重建前先把编辑器内容同步回 formData，避免重渲染丢失草稿
      if (formData._getContent) {
        try { formData.content = formData._getContent(); } catch (e) {}
      }
      container.innerHTML = '';

      container.appendChild(App.Components.pageHeader(
        isEdit ? '编辑笔记' : '新建笔记',
        '保存',
        async () => {
          if (!formData.title.trim()) {
            App.Components.toast('请输入笔记标题', 'error');
            return;
          }
          await submitForm();
        }
      ));

      const form = document.createElement('div');
      form.className = 'form-page';

      // ===== 标题（普通输入框，无灰色占位） =====
      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.className = 'note-title-input';
      titleInput.placeholder = '请输入笔记标题…';
      titleInput.value = formData.title || '';
      titleInput.addEventListener('input', () => { formData.title = titleInput.value; });
      form.appendChild(titleInput);

      // ===== 单一分类选择框（科目 › 模块 › 考点 级联） =====
      const catSelector = document.createElement('button');
      catSelector.type = 'button';
      catSelector.className = 'note-cat-selector';
      const updateCatLabel = () => {
        const parts = [formData.subject, formData.module, formData.knowledgePoint].filter(Boolean);
        catSelector.innerHTML = parts.length
          ? `<span class="note-cat-icon">🏷️</span><span class="note-cat-text">${parts.join(' › ')}</span><span class="note-cat-clear" title="清除分类">✕</span>`
          : `<span class="note-cat-icon">🏷️</span><span class="note-cat-text note-cat-placeholder">+ 选择科目 / 模块 / 考点</span>`;
      };
      catSelector.addEventListener('click', async (e) => {
        if (e.target.classList.contains('note-cat-clear')) {
          formData.subject = ''; formData.module = ''; formData.knowledgePoint = '';
          updateCatLabel();
          return;
        }
        // 科目选择（居中弹窗）
        const sOpt = App.Constants.SUBJECTS.map(s => ({
          icon: '<span style="font-size:22px">' + s.icon + '</span>',
          label: s.name,
          desc: '选择「' + s.name + '」模块',
          value: s.name
        }));
        const s = await App.Components.centeredPicker(sOpt, '选择科目', '请先选择考试科目，再选择具体模块和考点');
        if (!s) return;
        formData.subject = s; formData.module = ''; formData.knowledgePoint = '';

        // 模块选择
        const mods = App.Constants.getModules(s);
        const mOpt = mods.map(m => ({
          icon: '📂',
          label: m,
          desc: s.name + ' — ' + m,
          value: m
        }));
        const m = await App.Components.centeredPicker(mOpt, '选择模块', '选择「' + s + '」下的知识模块');
        if (!m) { updateCatLabel(); return; }
        formData.module = m; formData.knowledgePoint = '';

        // 考点选择
        const kps = App.Tags.getKnowledgePointSuggestions(m);
        const kOpt = kps.map(k => ({
          icon: '🏷️',
          label: k,
          desc: m + ' — ' + k,
          value: k
        }));
        kOpt.push({ icon: '✏️', label: '+ 自定义考点', desc: '手动输入新考点名称', value: '__custom__' });
        const k = await App.Components.centeredPicker(kOpt, '选择考点', '选择或自定义「' + m + '」的考点', { kind: 'kp', module: m });
        if (k === '__custom__') {
          const name = prompt('输入自定义考点名称：');
          if (name && name.trim()) { formData.knowledgePoint = name.trim(); App.Tags.addKnowledgePoint(m, name.trim()); }
        } else if (k) { formData.knowledgePoint = k; }
        updateCatLabel();
      });
      updateCatLabel();
      form.appendChild(catSelector);

      // ===== 正文块编辑器（带 onChange 自动保存到 DB）=====
      const editor = App.Components.notionEditor(formData.content, false, function (content) {
        formData.content = content;
        debouncedSaveToDB();
      });
      form.appendChild(editor.element);
      formData._getContent = editor.getContent;

      // 关联错题
      const linkGroup = document.createElement('div');
      linkGroup.className = 'form-group';
      const linkLabel = document.createElement('label');
      linkLabel.className = 'form-label';
      linkLabel.textContent = '关联错题（可选）';
      linkGroup.appendChild(linkLabel);

      const linkBtn = document.createElement('button');
      linkBtn.className = 'btn btn--outline btn--sm';
      linkBtn.textContent = '选择错题';
      linkBtn.addEventListener('click', async () => {
        const errors = await App.DB.getErrors({ subject: formData.subject });
        if (errors.length === 0) {
          App.Components.toast('该科目暂无错题', 'error');
          return;
        }

        const options = errors.map(e => ({
          label: App.Utils.truncate(e.question, 30),
          value: e.id
        }));
        const selected = await App.Components.actionSheet(options, '选择关联错题');
        if (selected && !formData.linkedErrors.includes(selected)) {
          formData.linkedErrors.push(selected);
          buildForm();
        }
      });
      linkGroup.appendChild(linkBtn);

      // 显示已关联的错题
      if (formData.linkedErrors.length > 0) {
        const linkedList = document.createElement('div');
        linkedList.style.cssText = 'margin-top:8px;';
        for (const errId of formData.linkedErrors) {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:var(--font-sm);';
          row.innerHTML = `<span style="color:var(--text-secondary);">关联错题 ${errId.slice(-6)}</span>`;
          const removeBtn = document.createElement('button');
          removeBtn.className = 'btn--text';
          removeBtn.textContent = '移除';
          removeBtn.addEventListener('click', () => {
            formData.linkedErrors = formData.linkedErrors.filter(id => id !== errId);
            buildForm();
          });
          row.appendChild(removeBtn);
          linkedList.appendChild(row);
        }
        linkGroup.appendChild(linkedList);
      }

      form.appendChild(linkGroup);

      container.appendChild(form);

      // 草稿自动暂存（localStorage 兜底，按表单 id 隔离，避免旧草稿串入新笔记）
      App.Draft.autoSaveForm('note', formData._formId, container, function () {
        if (formData._getContent) { try { formData.content = formData._getContent(); } catch (e) {} }
        return JSON.parse(JSON.stringify(formData));
      });
    };

    // 防抖自动保存到 DB（2 秒无操作后执行）
    let _saveTimer = null;
    let _saving = false;
    function debouncedSaveToDB() {
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(async () => {
        if (_saving) return;
        if (!formData.title.trim()) return;
        _saving = true;
        try { await submitFormInternal(); } catch (e) {}
        _saving = false;
      }, 2000);
    }

    // 核心保存逻辑
    const submitFormInternal = async () => {
      if (formData._getContent) formData.content = formData._getContent();
      App.Utils.rememberSelect.set('note', formData.subject, formData.module);
      if (!formData.subject || !formData.title.trim()) return;

      if (isEdit && formData.id) {
        const existing = await App.DB.get('notes', formData.id);
        await App.DB.updateNote({
          id: formData.id, subject: formData.subject, module: formData.module,
          knowledgePoint: formData.knowledgePoint, title: formData.title,
          content: formData.content, linkedErrors: formData.linkedErrors,
          linkedReviews: existing ? existing.linkedReviews || [] : [],
          updatedAt: new Date().toISOString()
        });
      } else {
        if (!formData.id) {
          formData.id = await App.DB.addNote({
            subject: formData.subject, module: formData.module,
            knowledgePoint: formData.knowledgePoint,
            title: formData.title || '未命名笔记', content: formData.content,
            linkedErrors: formData.linkedErrors, linkedReviews: [],
            updatedAt: new Date().toISOString()
          });
          isEdit = true;
        } else {
          await App.DB.updateNote({
            id: formData.id, subject: formData.subject, module: formData.module,
            knowledgePoint: formData.knowledgePoint, title: formData.title,
            content: formData.content, linkedErrors: formData.linkedErrors,
            linkedReviews: [], updatedAt: new Date().toISOString()
          });
        }
      }
    };

    // 手动/离开时强制保存
    const submitForm = async () => {
      clearTimeout(_saveTimer);
      if (formData._getContent) formData.content = formData._getContent();
      if (!formData.subject) { App.Components.toast('请选择科目', 'error'); return; }
      if (!formData.title.trim()) { App.Components.toast('请输入标题', 'error'); return; }
      try {
        await submitFormInternal();
        App.Components.toast('已保存 ✓', 'success');
        App.Draft.clearForm('note');
        App.Router.navigate('notes');
      } catch (e) { App.Components.toast('保存失败', 'error'); }
    };

    loadAndRender();
  }
};

window.App = window.App || {};

App.Pages.StudyStats = {
  _view: null,   // 当前查看的月份（Date，1号）

  async render(params) {
    const container = document.getElementById('page-study-stats');
    container.innerHTML = '';
    if (!this._view) { this._view = new Date(); this._view.setDate(1); }
    const view = this._view;
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const key = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const todayKey = key(now);

    // 聚合每日待办（含具体事项，用于日历格子展示）
    let todos = [];
    try { todos = await App.DB.getTodos(); } catch (e) { todos = []; }
    const byDay = {};
    todos.forEach(t => {
      const k = key(new Date(t.createdAt));
      if (!byDay[k]) byDay[k] = { total: 0, done: 0, items: [] };
      byDay[k].total++;
      if (t.completed) byDay[k].done++;
      byDay[k].items.push(t);
    });

    // 待办类型配色（与首页一致）
    const TODO_TYPE_COLORS = {
      study: '#4A90E2',
      review: '#9B7BFF',
      practice: '#FF9F43',
      other: '#6B8EAD'
    };
    const escapeHtml = (str) => String(str || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // 头部
    const header = document.createElement('div');
    header.style.cssText = 'padding:var(--spacing-lg) var(--page-padding);padding-bottom:var(--spacing-sm);';
    header.innerHTML = `
      <div style="font-size:var(--font-3xl);font-weight:700;color:var(--text-primary);margin-bottom:var(--spacing-sm);">学习统计</div>
      <div style="font-size:var(--font-sm);color:var(--text-tertiary);line-height:1.6;">按日历查看每日待办，彩色标签为具体事项，绿色 = 全部完成，黄色 = 有未完成。</div>
    `;
    container.appendChild(header);

    // 月份切换
    const nav = document.createElement('div');
    nav.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:0 var(--page-padding) var(--spacing-sm);';
    const prevBtn = document.createElement('button');
    prevBtn.className = 'btn btn--outline btn--sm'; prevBtn.textContent = '◀ 上月';
    const monthLabel = document.createElement('div');
    monthLabel.style.cssText = 'font-size:var(--font-lg);font-weight:600;';
    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn btn--outline btn--sm'; nextBtn.textContent = '下月 ▶';
    const refresh = () => {
      monthLabel.textContent = view.getFullYear() + '年' + (view.getMonth() + 1) + '月';
      this.render({});
    };
    prevBtn.addEventListener('click', () => { view.setMonth(view.getMonth() - 1); refresh(); });
    nextBtn.addEventListener('click', () => { view.setMonth(view.getMonth() + 1); refresh(); });
    nav.appendChild(prevBtn); nav.appendChild(monthLabel); nav.appendChild(nextBtn);
    container.appendChild(nav);

    // 日历网格
    const cal = document.createElement('div');
    cal.className = 'study-cal';
    const weeks = ['日', '一', '二', '三', '四', '五', '六'];
    weeks.forEach(w => {
      const h = document.createElement('div');
      h.className = 'study-cal__dow';
      h.textContent = w;
      cal.appendChild(h);
    });
    const firstDow = view.getDay();
    const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    for (let i = 0; i < firstDow; i++) {
      const blank = document.createElement('div');
      blank.className = 'study-cal__cell study-cal__cell--blank';
      cal.appendChild(blank);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      const k = view.getFullYear() + '-' + pad(view.getMonth() + 1) + '-' + pad(d);
      const info = byDay[k];
      cell.className = 'study-cal__cell';
      if (k === todayKey) cell.classList.add('is-today');
      let inner = '<div class="study-cal__day">' + d + '</div>';
      if (info && info.total > 0) {
        const cls = info.done === info.total ? 'is-done' : (info.done > 0 ? 'is-part' : 'is-undo');
        cell.classList.add('has-data', cls);
        inner += '<div class="study-cal__todos">';
        const maxVisible = 5;
        info.items.slice(0, maxVisible).forEach(t => {
          const color = TODO_TYPE_COLORS[t.type || 'study'] || TODO_TYPE_COLORS.study;
          const doneCls = t.completed ? ' study-cal__todo--done' : '';
          inner += '<div class="study-cal__todo' + doneCls + '" style="--todo-color:' + color + '">' + escapeHtml(t.text) + '</div>';
        });
        if (info.items.length > maxVisible) {
          inner += '<div class="study-cal__more">+' + (info.items.length - maxVisible) + '</div>';
        }
        inner += '</div>';
      } else {
        cell.classList.add('no-data');
      }
      cell.innerHTML = inner;
      cal.appendChild(cell);
    }
    container.appendChild(cal);

    // 底部留白
    const spacer = document.createElement('div');
    spacer.style.height = 'var(--spacing-xl)';
    container.appendChild(spacer);
  }
};

App.Pages = App.Pages || {};

App.Pages.Exams = {
  state: {
    filter: 'all',     // 'month' | '3month' | 'all'
    sort: 'date-desc', // 'date-desc' | 'accuracy-desc' | 'accuracy-asc'
    search: '',
    allExams: []
  },

  async render(params) {
    const container = document.getElementById('page-exams');
    container.innerHTML = '';

    // 页面标题
    const header = document.createElement('div');
    header.className = 'page-header';
    header.innerHTML = `
      <div class="page-header__title">套卷记录</div>
      <div class="page-header__right" id="exam-count">共 0 套</div>
    `;
    container.appendChild(header);

    // 搜索栏
    const searchBar = document.createElement('div');
    searchBar.className = 'search-bar';
    searchBar.innerHTML = `
      <span class="search-bar__icon">🔍</span>
      <input type="text" placeholder="搜索套卷名称..." id="exam-search">
    `;
    container.appendChild(searchBar);

    searchBar.querySelector('input').addEventListener('input', App.Utils.debounce((e) => {
      this.state.search = e.target.value;
      this.refreshList();
    }, 300));

    // 统计概览
    const statsRow = document.createElement('div');
    statsRow.className = 'stats-row';
    statsRow.id = 'exam-stats';
    container.appendChild(statsRow);

    // 筛选与排序
    const filterBar = document.createElement('div');
    filterBar.id = 'exam-filter-bar';
    container.appendChild(filterBar);

    // 列表
    const listArea = document.createElement('div');
    listArea.id = 'exam-list';
    container.appendChild(listArea);

    // 加载数据
    await this.loadData();
    this.renderStats(statsRow);
    this.renderFilters(filterBar);
    this.renderList(listArea);
  },

  async loadData() {
    this.state.allExams = await App.DB.getExams();
  },

  renderStats(container) {
    const exams = this.state.allExams;
    const total = exams.length;
    const avgAccuracy = total > 0
      ? Math.round(exams.reduce((sum, e) => sum + (e.totalAccuracy || 0), 0) / total)
      : 0;
    const thisWeek = exams.filter(e => {
      const d = new Date(e.examDate);
      const now = new Date();
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      return d >= weekAgo;
    }).length;
    const totalTime = exams.reduce((sum, e) => sum + (e.totalTime || 0), 0);

    container.innerHTML = `
      <div class="stat-item">
        <div class="stat-item__value">${total}</div>
        <div class="stat-item__label">总套卷</div>
      </div>
      <div class="stat-item">
        <div class="stat-item__value stat-item__value--danger">${avgAccuracy}%</div>
        <div class="stat-item__label">平均正确率</div>
      </div>
      <div class="stat-item">
        <div class="stat-item__value">${thisWeek}</div>
        <div class="stat-item__label">本周套卷</div>
      </div>
      <div class="stat-item">
        <div class="stat-item__value">${Math.round(totalTime / 60)}h</div>
        <div class="stat-item__label">累计用时</div>
      </div>
    `;
  },

  renderFilters(container) {
    container.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'tag-select-row';

    // 时间范围
    row.appendChild(App.Components.tagSelect(
      [{ name: '全部' }, { name: '本月' }, { name: '近三月' }],
      this.state.filter === 'all' ? '全部' : (this.state.filter === 'month' ? '本月' : '近三月'),
      (val) => {
        const map = { '全部': 'all', '本月': 'month', '近三月': '3month' };
        this.state.filter = map[val] || 'all';
        this.refreshList();
      },
      { placeholder: '时间', showMenu: false }
    ));

    // 排序
    row.appendChild(App.Components.tagSelect(
      [{ name: '最新' }, { name: '正确率↑' }, { name: '正确率↓' }],
      this.state.sort === 'date-desc' ? '最新' : (this.state.sort === 'accuracy-desc' ? '正确率↑' : '正确率↓'),
      (val) => {
        const map = { '最新': 'date-desc', '正确率↑': 'accuracy-desc', '正确率↓': 'accuracy-asc' };
        this.state.sort = map[val] || 'date-desc';
        this.refreshList();
      },
      { placeholder: '排序', showMenu: false }
    ));

    container.appendChild(row);
  },

  getFilteredExams() {
    let exams = [...this.state.allExams];

    // 搜索过滤
    if (this.state.search) {
      const kw = this.state.search.toLowerCase();
      exams = exams.filter(e => e.name.toLowerCase().includes(kw));
    }

    // 时间过滤
    const now = new Date();
    if (this.state.filter === 'month') {
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      exams = exams.filter(e => new Date(e.examDate) >= monthStart);
    } else if (this.state.filter === '3month') {
      const threeMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 3, 1);
      exams = exams.filter(e => new Date(e.examDate) >= threeMonthsAgo);
    }

    // 排序
    if (this.state.sort === 'accuracy-desc') {
      exams.sort((a, b) => (b.totalAccuracy || 0) - (a.totalAccuracy || 0));
    } else if (this.state.sort === 'accuracy-asc') {
      exams.sort((a, b) => (a.totalAccuracy || 0) - (b.totalAccuracy || 0));
    } else {
      exams.sort((a, b) => new Date(b.examDate) - new Date(a.examDate));
    }

    return exams;
  },

      // 左滑操作
      App.Utils.initSwipeable(card, {
        onSwipe: async () => {

            { label: '编辑', value: 'edit' },

          if (action === 'edit') {

          } else if (action === 'delete') {
            const confirmed = await App.Components.confirm(
              '删除套卷',
              '确定删除"' + exam.name + '"？\n关联的错题将保留在错题本中。',
              '删除', '取消', true
            );
            if (confirmed) {

              App.Components.toast('已删除', 'success');
              this.refreshAll();
            }
          }
          App.Utils.resetSwipe(card);
        }
      });

      timeline.appendChild(item);
    });

    container.appendChild(timeline);
  },

  refreshAll() {

        tableHtml += `<tr style="border-bottom:1px solid var(--divider-color);">
          <td style="padding:10px 8px;display:flex;align-items:center;gap:6px;">
            <span style="width:10px;height:10px;border-radius:50%;background:${color};display:inline-block;"></span>
            ${s.subject}
          </td>
          <td style="text-align:center;padding:10px 8px;">${s.score || 0}/${s.totalScore || 0}</td>
          <td style="text-align:center;padding:10px 8px;font-weight:600;color:${pct >= 70 ? 'var(--color-success)' : 'var(--color-danger)'};">${pct}%</td>
        </tr>`;
      });
      tableHtml += '</tbody></table>';
      scoresTable.innerHTML = tableHtml;
      content.appendChild(scoresTable);
    }

    // 关联错题
    if (exam.linkedErrorIds && exam.linkedErrorIds.length > 0) {
      const linkedTitle = document.createElement('div');
      linkedTitle.style.cssText = 'font-size:var(--font-md);font-weight:600;margin-bottom:var(--spacing-sm);';
      linkedTitle.textContent = '关联错题（' + exam.linkedErrorIds.length + '）';
      content.appendChild(linkedTitle);

      for (const errId of exam.linkedErrorIds) {
        try {
          const err = await App.DB.get('errors', errId);
          if (err) {
            const errItem = document.createElement('div');
            errItem.style.cssText = 'padding:10px;margin-bottom:4px;background:var(--bg-tertiary);border-radius:var(--radius-sm);font-size:var(--font-sm);cursor:pointer;display:flex;justify-content:space-between;align-items:center;';
            errItem.innerHTML = `
              <span>${App.Utils.truncate(err.question, 40)}</span>
              <span class="tag tag--${err.status === '已掌握' ? 'success' : 'danger'}">${err.status}</span>
            `;
            errItem.addEventListener('click', () => App.Router.navigate('error-detail?id=' + err.id));
            content.appendChild(errItem);
          }
        } catch (e) {}
      }
    }

    // 复盘笔记
    const reviewTitle = document.createElement('div');
    reviewTitle.style.cssText = 'font-size:var(--font-md);font-weight:600;margin-bottom:var(--spacing-sm);';
    reviewTitle.textContent = '复盘笔记';
    content.appendChild(reviewTitle);

    const reviewNote = document.createElement('div');
    reviewNote.className = 'card';
    reviewNote.style.cssText = 'margin:0;line-height:1.7;min-height:40px;';
    reviewNote.innerHTML = exam.reviewNote
      ? App.Utils.simpleMarkdown(exam.reviewNote)
      : '<span style="color:var(--text-tertiary);">暂无复盘笔记</span>';
    content.appendChild(reviewNote);

    container.appendChild(content);

    // 底部操作
    const bottomActions = document.createElement('div');
    bottomActions.className = 'bottom-actions';
    bottomActions.style.bottom = '0';

    const editBtn = document.createElement('button');
    editBtn.className = 'btn btn--outline';
    editBtn.textContent = '编辑';
    editBtn.addEventListener('click', () => App.Router.navigate('exam-form?id=' + exam.id));
    bottomActions.appendChild(editBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'btn btn--danger';
    deleteBtn.textContent = '删除';
    deleteBtn.addEventListener('click', async () => {
      const confirmed = await App.Components.confirm(
        '删除套卷',
        '确定删除该套卷记录？关联的错题将保留在错题本中。',
        '删除', '取消', true
      );
      if (confirmed) {
        await App.DB.remove('exams', exam.id);
        App.Components.toast('已删除', 'success');
        App.Router.navigate('exams');
      }
    });
    bottomActions.appendChild(deleteBtn);

    container.appendChild(bottomActions);
  },

  // ===== 新建/编辑套卷表单 =====
  renderForm(params) {
    const container = document.getElementById('page-exam-form');
    container.innerHTML = '';

    let isEdit = !!params.id;

    let formData = {
      name: '',
      examDate: new Date().toISOString().slice(0, 10),
      subjectScores: [],
      totalAccuracy: '',
      totalTime: '',
      targetScore: '',
      reviewNote: '',
      linkedErrorIds: []
    };

    const loadAndRender = async () => {
      if (isEdit) {
        const exam = await App.DB.get('exams', params.id);
        if (exam) {
          formData = {
            name: exam.name || '',
            examDate: exam.examDate || '',
            subjectScores: exam.subjectScores || [],
            totalAccuracy: exam.totalAccuracy !== undefined ? String(exam.totalAccuracy) : '',
            totalTime: exam.totalTime !== undefined ? String(exam.totalTime) : '',
            targetScore: exam.targetScore !== undefined ? String(exam.targetScore) : '',
            reviewNote: exam.reviewNote || '',
            linkedErrorIds: exam.linkedErrorIds || [],
            id: exam.id
          };
        }
        formData._formId = params.id;
      } else {
        // 新建/续编：仅当 sessionStorage 记录着「同一篇正在录入」的 id 时才续编；否则一律空白。
        const fid = App.Draft.getFormId('exam');
        if (fid) {
          if (App.Draft.formIdIsTemp(fid)) {
            const d = App.Draft.loadForm('exam', fid);
            if (d) Object.assign(formData, d);
            formData._formId = fid;
          } else {
            const exam = await App.DB.get('exams', fid);
            if (exam) {
              isEdit = true;
              formData = {
                name: exam.name || '',
                examDate: exam.examDate || '',
                subjectScores: exam.subjectScores || [],
                totalAccuracy: exam.totalAccuracy !== undefined ? String(exam.totalAccuracy) : '',
                totalTime: exam.totalTime !== undefined ? String(exam.totalTime) : '',
                targetScore: exam.targetScore !== undefined ? String(exam.targetScore) : '',
                reviewNote: exam.reviewNote || '',
                linkedErrorIds: exam.linkedErrorIds || [],
                id: exam.id
              };
              formData._formId = fid;
            }
          }
        }
        if (!formData._formId) {
          formData._formId = App.Draft.newTempId();
          App.Draft.setFormId('exam', formData._formId);
        }
      }
      buildForm();
    };

    const buildForm = () => {
      container.innerHTML = '';

      container.appendChild(App.Components.pageHeader(
        isEdit ? '编辑套卷' : '记录套卷',
        '保存',
        async () => {
          if (!formData.name.trim()) {
            App.Components.toast('请输入套卷名称', 'error');
            return;
          }
          await submitForm();
        }
      ));

      const form = document.createElement('div');
      form.className = 'form-page';

      // 套卷名称
      form.appendChild(App.Components.formInput(
        '套卷名称',
        formData.name,
        '例如：2025国考行测真题',
        (val) => { formData.name = val; },
        'text',
        true
      ));

      // 考试日期
      form.appendChild(App.Components.formInput(
        '考试日期',
        formData.examDate,
        'YYYY-MM-DD',
        (val) => { formData.examDate = val; },
        'date',
        true
      ));

      // 科目成绩
      const scoresGroup = document.createElement('div');
      scoresGroup.className = 'form-group';
      const scoresLabel = document.createElement('label');
      scoresLabel.className = 'form-label';
      scoresLabel.textContent = '科目成绩';
      scoresGroup.appendChild(scoresLabel);

      // 快速添加科目
      const addSubjectRow = document.createElement('div');
      addSubjectRow.style.cssText = 'display:flex;gap:6px;margin-bottom:8px;';

      const subjectSelect = document.createElement('select');
      subjectSelect.className = 'form-select';
      subjectSelect.style.flex = '1';
      subjectSelect.innerHTML = '<option value="">选择科目</option>';
      App.Constants.SUBJECTS.forEach(s => {
        subjectSelect.innerHTML += `<option value="${s.name}">${s.name}</option>`;
      });

      const scoreInput = document.createElement('input');
      scoreInput.className = 'form-input';
      scoreInput.style.width = '60px';
      scoreInput.placeholder = '正确数';
      scoreInput.type = 'number';

      const totalInput = document.createElement('input');
      totalInput.className = 'form-input';
      totalInput.style.width = '60px';
      totalInput.placeholder = '总题数';
      totalInput.type = 'number';

      const addScoreBtn = document.createElement('button');
      addScoreBtn.className = 'btn btn--primary btn--sm';
      addScoreBtn.textContent = '+';
      addScoreBtn.addEventListener('click', () => {
        const subj = subjectSelect.value;
        const score = parseInt(scoreInput.value) || 0;
        const total = parseInt(totalInput.value) || 0;
        if (!subj) { App.Components.toast('请选择科目', 'error'); return; }
        // 替换或添加
        const existingIdx = formData.subjectScores.findIndex(s => s.subject === subj);
        if (existingIdx >= 0) {
          formData.subjectScores[existingIdx] = { subject: subj, score, totalScore: total };
        } else {
          formData.subjectScores.push({ subject: subj, score, totalScore: total });
        }
        subjectSelect.value = '';
        scoreInput.value = '';
        totalInput.value = '';
        buildForm();
      });

      addSubjectRow.appendChild(subjectSelect);
      addSubjectRow.appendChild(scoreInput);
      addSubjectRow.appendChild(totalInput);
      addSubjectRow.appendChild(addScoreBtn);
      scoresGroup.appendChild(addSubjectRow);

      // 已添加的科目列表
      formData.subjectScores.forEach(s => {
        const subj = App.Constants.SUBJECTS.find(su => su.name === s.subject);
        const color = subj ? subj.color : '#6B8EAD';
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:var(--font-sm);';
        row.innerHTML = `
          <span style="display:flex;align-items:center;gap:6px;">
            <span style="width:8px;height:8px;border-radius:50%;background:${color};display:inline-block;"></span>
            ${s.subject}：${s.score}/${s.totalScore}
          </span>
        `;
        const removeBtn = document.createElement('button');
        removeBtn.className = 'btn--text';
        removeBtn.textContent = '移除';
        removeBtn.addEventListener('click', () => {
          formData.subjectScores = formData.subjectScores.filter(ss => ss.subject !== s.subject);
          buildForm();
        });
        row.appendChild(removeBtn);
        scoresGroup.appendChild(row);
      });

      form.appendChild(scoresGroup);

      // 快速录入模式
      const quickRow = document.createElement('div');
      quickRow.style.cssText = 'display:flex;gap:var(--spacing-md);margin-bottom:var(--spacing-md);';
      quickRow.appendChild(App.Components.formInput(
        '总正确率（%）',
        formData.totalAccuracy,
        '例如：72',
        (val) => { formData.totalAccuracy = val; },
        'number'
      ));
      quickRow.appendChild(App.Components.formInput(
        '总用时（分钟）',
        formData.totalTime,
        '例如：120',
        (val) => { formData.totalTime = val; },
        'number'
      ));
      form.appendChild(quickRow);

      form.appendChild(App.Components.formInput(
        '目标分数',
        formData.targetScore,
        '可选',
        (val) => { formData.targetScore = val; },
        'number'
      ));

      // 复盘笔记
      const noteGroup = document.createElement('div');
      noteGroup.className = 'form-group';
      const noteLabel = document.createElement('label');
      noteLabel.className = 'form-label';
      noteLabel.textContent = '复盘笔记';
      noteGroup.appendChild(noteLabel);

      const editor = App.Components.markdownEditor(formData.reviewNote, '记录本次考试的得失...');
      noteGroup.appendChild(editor.element);
      formData._getNote = editor.getContent;
      form.appendChild(noteGroup);

      container.appendChild(form);

      // 草稿自动暂存 + 触发 DB 自动保存
      App.Draft.autoSaveForm('exam', formData._formId, container, function () {
        if (formData._getNote) { try { formData.reviewNote = formData._getNote(); } catch (e) {} }
        debouncedSaveToDB();
        return JSON.parse(JSON.stringify(formData));
      });
    };

    let _examSaveTimer = null, _examSaving = false;
    function debouncedSaveToDB() {
      clearTimeout(_examSaveTimer);
      _examSaveTimer = setTimeout(async () => {
        if (_examSaving) return;
        if (!formData.name.trim()) return;
        _examSaving = true;
        try { await submitFormInternal(); } catch (e) {}
        _examSaving = false;
      }, 2000);
    }

    const submitFormInternal = async () => {
      if (formData._getNote) formData.reviewNote = formData._getNote();
      if (isEdit && formData.id) {
        await App.DB.updateExam({
          id: formData.id, name: formData.name, examDate: formData.examDate,
          subjectScores: formData.subjectScores,
          totalAccuracy: parseInt(formData.totalAccuracy) || 0,
          totalTime: parseInt(formData.totalTime) || 0,
          targetScore: parseInt(formData.targetScore) || 0,
          reviewNote: formData.reviewNote, linkedErrorIds: formData.linkedErrorIds
        });
      } else {
        if (!formData.id) {
          formData.id = await App.DB.addExam({
            name: formData.name || '未命名套卷', examDate: formData.examDate,
            subjectScores: formData.subjectScores,
            totalAccuracy: parseInt(formData.totalAccuracy) || 0,
            totalTime: parseInt(formData.totalTime) || 0,
            targetScore: parseInt(formData.targetScore) || 0,
            reviewNote: formData.reviewNote, linkedErrorIds: []
          });
          isEdit = true;
        } else {
          await App.DB.updateExam({
            id: formData.id, name: formData.name, examDate: formData.examDate,
            subjectScores: formData.subjectScores,
            totalAccuracy: parseInt(formData.totalAccuracy) || 0,
            totalTime: parseInt(formData.totalTime) || 0,
            targetScore: parseInt(formData.targetScore) || 0,
            reviewNote: formData.reviewNote, linkedErrorIds: formData.linkedErrorIds
          });
        }
      }
    };

    const submitForm = async () => {
      clearTimeout(_examSaveTimer);
      if (formData._getNote) formData.reviewNote = formData._getNote();
      if (!formData.name.trim()) { App.Components.toast('请输入套卷名称', 'error'); return; }
      try {
        await submitFormInternal();
        App.Components.toast('已保存 ✓', 'success');
        App.Draft.clearForm('exam');
        App.Router.navigate('exams');
      } catch (e) { App.Components.toast('保存失败', 'error'); }
    };

    loadAndRender();
  }
};
// ===== 考公笔试复盘系统 - 科目专属复盘工作台 =====
window.App = window.App || {};
App.Pages = App.Pages || {};

App.Pages.Workspace = {
  state: {
    subject: null,
    activeTab: 0,
    reviewTasks: [],
    notes: [],
    errors: []
  },

  async render(params) {
    const container = document.getElementById('page-workspace');
    container.innerHTML = '';

    // 从 URL 参数获取科目
    this.state.subject = params.subject || App.Constants.SUBJECTS[0].name;
    this.state.activeTab = parseInt(params.tab) || 0;

    // 返回栏（padding 由 .page-header 统一 CSS 控制：贴顶 + 安全区留白，勿用 inline 覆盖）
    const header = document.createElement('div');
    header.className = 'page-header';

    const backBtn = document.createElement('button');
    backBtn.className = 'page-header__back';
    backBtn.innerHTML = '‹ 返回';
    backBtn.addEventListener('click', () => App.Router.navigate('home'));
    header.appendChild(backBtn);

    // 科目切换器
    const subjectSelector = document.createElement('select');
    subjectSelector.className = 'form-select';
    subjectSelector.style.cssText = 'flex:1;margin:0 var(--spacing-sm);font-weight:600;';
    App.Constants.SUBJECTS.forEach(s => {
      subjectSelector.innerHTML += `<option value="${s.name}" ${this.state.subject === s.name ? 'selected' : ''}>${s.icon} ${s.name}</option>`;
    });
    subjectSelector.addEventListener('change', () => {
      this.state.subject = subjectSelector.value;
      this.loadAndRenderTabs();
    });
    header.appendChild(subjectSelector);

    container.appendChild(header);

    // Tab 栏
    const tabBar = App.Components.stickyTabs([
      { label: '复盘记录' },
      { label: '笔记框架' },
      { label: '知识点分类' },
      { label: '错题整理' }
    ], this.state.activeTab, (idx) => {
      this.state.activeTab = idx;
      this.renderTabContent();
    });
    tabBar.style.top = 'calc(var(--safe-top) + 44px)';
    container.appendChild(tabBar);

    // Tab 内容区
    const tabContent = document.createElement('div');
    tabContent.id = 'workspace-tab-content';
    container.appendChild(tabContent);

    // 加载数据
    await this.loadData();
    this.renderTabContent();
  },

  async loadData() {
    const subject = this.state.subject;
    [this.state.reviewTasks, this.state.notes, this.state.errors] = await Promise.all([
      App.DB.getReviewTasks(subject),
      App.DB.getNotes({ subject }),
      App.DB.getErrors({ subject })
    ]);
  },

  async loadAndRenderTabs() {
    await this.loadData();
    this.renderTabContent();
  },

  renderTabContent() {
    const container = document.getElementById('workspace-tab-content');
    if (!container) return;
    container.innerHTML = '';

    switch (this.state.activeTab) {
      case 0: this.renderReviewTab(container); break;
      case 1: this.renderNotesTab(container); break;
      case 2: this.renderKnowledgeTab(container); break;
      case 3: this.renderErrorsTab(container); break;
    }
  },

  // ===== Tab 1: 复盘记录 =====
  renderReviewTab(container) {
    const subject = this.state.subject;
    const tasks = this.state.reviewTasks;

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'padding:var(--spacing-md) var(--page-padding);';

    if (tasks.length === 0) {
      // 检查是否有默认任务需要初始化
      const defaults = App.Constants.DEFAULT_REVIEW_TASKS[subject] || [];
      const initMsg = document.createElement('div');
      initMsg.style.cssText = 'margin-bottom:var(--spacing-md);text-align:center;';
      initMsg.innerHTML = `
        <div style="font-size:var(--font-sm);color:var(--text-tertiary);margin-bottom:var(--spacing-sm);">
          还没有复盘任务
        </div>
        ${defaults.length > 0 ? `
          <button class="btn btn--outline btn--sm" id="init-default-tasks">加载默认任务</button>
        ` : ''}
        <button class="btn btn--primary btn--sm" style="margin-left:8px;" id="add-custom-task">自定义任务</button>
      `;
      wrapper.appendChild(initMsg);

      if (defaults.length > 0) {
        wrapper.querySelector('#init-default-tasks').addEventListener('click', async () => {
          for (const taskText of defaults) {
            await App.DB.addReviewTask({
              subject,
              taskText,
              reviewNote: '',
              createdAt: new Date().toISOString()
            });
          }
          App.Components.toast('已加载默认任务', 'success');
          this.loadAndRenderTabs();
        });
      }

      wrapper.querySelector('#add-custom-task').addEventListener('click', () => {
        this.showAddTaskDialog(wrapper, subject);
      });
    } else {
      tasks.forEach((task, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.margin = '0 0 var(--spacing-sm) 0';

        card.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:var(--font-xs);color:var(--text-tertiary);">${idx + 1}</span>
              <span style="font-weight:600;">${task.taskText}</span>
            </div>
            <button class="btn--text" style="font-size:var(--font-xs);" id="del-task-${task.id}">✕</button>
          </div>
          <textarea class="form-textarea" placeholder="复盘笔记..." style="min-height:60px;margin-top:6px;"
            id="note-${task.id}">${task.reviewNote || ''}</textarea>
        `;

        // 删除
        card.querySelector('#del-task-' + task.id).addEventListener('click', async (e) => {
          e.stopPropagation();
          const confirmed = await App.Components.confirm('删除任务', '确定删除该复盘任务？', '删除', '取消', true);
          if (confirmed) {
            await App.DB.remove('subject_reviews', task.id);
            App.Components.toast('已删除', 'success');
            this.loadAndRenderTabs();
          }
        });

        // 自动保存笔记
        const textarea = card.querySelector('#note-' + task.id);
        textarea.addEventListener('input', App.Utils.debounce(async () => {
          task.reviewNote = textarea.value;
          await App.DB.updateReviewTask(task);
        }, 3000));

        wrapper.appendChild(card);
      });

      // 添加任务按钮
      const addBtn = document.createElement('button');
      addBtn.className = 'btn btn--outline btn--full';
      addBtn.style.marginTop = 'var(--spacing-md)';
      addBtn.textContent = '+ 添加任务';
      addBtn.addEventListener('click', () => this.showAddTaskDialog(wrapper, subject));
      wrapper.appendChild(addBtn);
    }

    container.appendChild(wrapper);
  },

  showAddTaskDialog(wrapper, subject) {
    const inputRow = document.createElement('div');
    inputRow.style.cssText = 'display:flex;gap:var(--spacing-sm);margin-bottom:var(--spacing-md);padding:0 var(--page-padding);';
    const input = document.createElement('input');
    input.className = 'form-input';
    input.placeholder = '输入复盘任务...';
    input.style.flex = '1';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn--primary btn--sm';
    addBtn.textContent = '添加';
    addBtn.addEventListener('click', async () => {
      const text = input.value.trim();
      if (!text) { App.Components.toast('请输入任务内容', 'error'); return; }
      await App.DB.addReviewTask({
        subject,
        taskText: text,
        reviewNote: '',
        createdAt: new Date().toISOString()
      });
      input.value = '';
      App.Components.toast('已添加', 'success');
      this.loadAndRenderTabs();
    });
    inputRow.appendChild(input);
    inputRow.appendChild(addBtn);
    wrapper.insertBefore(inputRow, wrapper.firstChild);
  },

  // ===== Tab 2: 笔记框架 =====
  renderNotesTab(container) {
    const subject = this.state.subject;
    const notes = this.state.notes;

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'padding:var(--spacing-md) var(--page-padding);';

    if (notes.length === 0) {
      wrapper.appendChild(App.Components.emptyState(
        '📝',
        '暂无笔记',
        '点击下方按钮开始记录',
        '新建笔记',
        () => App.Router.navigate('note-form?subject=' + encodeURIComponent(subject))
      ));
    } else {
      // 按模块-考点组织
      const treeData = {};
      notes.forEach(note => {
        const mod = note.module || '未分类';
        const kp = note.knowledgePoint || '未分类';
        if (!treeData[mod]) treeData[mod] = {};
        if (!treeData[mod][kp]) treeData[mod][kp] = [];
        treeData[mod][kp].push(note);
      });

      const treeContainer = document.createElement('div');
      treeContainer.className = 'note-tree';

      Object.entries(treeData).forEach(([modName, kps]) => {
        const kpNodes = [];
        Object.entries(kps).forEach(([kpName, kpNotes]) => {
          const noteItems = kpNotes.map(note =>
            App.Components.noteItem(note, (n) => App.Router.navigate('note-detail?id=' + n.id))
          );
          kpNodes.push(App.Components.noteTreeNode(kpName, '📌', kpNotes.length, true, noteItems));
        });
        treeContainer.appendChild(App.Components.noteTreeNode(
          modName, '📁',
          Object.values(kps).reduce((sum, arr) => sum + arr.length, 0),
          true,
          kpNodes
        ));
      });

      wrapper.appendChild(treeContainer);
    }

    container.appendChild(wrapper);
  },

  // ===== Tab 3: 知识点分类 =====
  renderKnowledgeTab(container) {
    const subject = this.state.subject;
    const errors = this.state.errors;
    const notes = this.state.notes;
    const modules = App.Constants.getModules(subject);

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'padding:var(--spacing-md) var(--page-padding);';

    modules.forEach(modName => {
      const presetKps = App.Tags.getKnowledgePoints(modName);
      const usedCustom = new Set();
      errors.filter(e => e.module === modName).forEach(e => (e.knowledgePoints || []).forEach(kp => usedCustom.add(kp)));
      notes.filter(n => n.module === modName && n.knowledgePoint).forEach(n => usedCustom.add(n.knowledgePoint));
      const kps = Array.from(new Set([...presetKps, ...usedCustom]));

      const modCard = document.createElement('div');
      modCard.className = 'card';
      modCard.style.margin = '0 0 var(--spacing-md) 0';

      let kpListHtml = '';
      kps.forEach(kpName => {
        const kpErrors = errors.filter(e =>
          e.module === modName && (e.knowledgePoints || []).includes(kpName)
        );
        const kpNotes = notes.filter(n =>
          n.module === modName && n.knowledgePoint === kpName
        );
        const totalItems = kpErrors.length + kpNotes.length;
        const unmastered = kpErrors.filter(e => e.status === '未掌握').length;
        const masteryClass = totalItems === 0 ? 'mastery-dot--none' :
          (unmastered === 0 ? 'mastery-dot--mastered' : 'mastery-dot--familiar');

        kpListHtml += `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:var(--font-sm);border-bottom:1px solid var(--divider-color);">
            <span>
              <span class="mastery-dot ${masteryClass}"></span>
              ${kpName}
            </span>
            <span style="color:var(--text-tertiary);font-size:var(--font-xs);">
              错题${kpErrors.length} · 笔记${kpNotes.length}
            </span>
          </div>
        `;
      });

      modCard.innerHTML = `
        <div style="font-weight:600;font-size:var(--font-md);margin-bottom:8px;display:flex;align-items:center;gap:8px;">
          <span>📁</span> ${modName}
          <span style="font-weight:400;font-size:var(--font-xs);color:var(--text-tertiary);">${kps.length}个考点</span>
        </div>
        ${kpListHtml}
      `;

      wrapper.appendChild(modCard);
    });

    // 图例
    const legend = document.createElement('div');
    legend.style.cssText = 'display:flex;gap:var(--spacing-md);justify-content:center;font-size:var(--font-xs);color:var(--text-tertiary);margin-top:var(--spacing-sm);';
    legend.innerHTML = `
      <span><span class="mastery-dot mastery-dot--none"></span> 未学习</span>
      <span><span class="mastery-dot mastery-dot--familiar"></span> 有未掌握</span>
      <span><span class="mastery-dot mastery-dot--mastered"></span> 已掌握</span>
    `;
    wrapper.appendChild(legend);

    container.appendChild(wrapper);
  },

  // ===== Tab 4: 错题整理 =====
  renderErrorsTab(container) {
    const errors = this.state.errors;

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'padding:var(--spacing-md) var(--page-padding);';

    if (errors.length === 0) {
      wrapper.appendChild(App.Components.emptyState(
        '📋',
        '该科目暂无错题',
        '做完题后记得把错题记录到错题本',
        '添加错题',
        () => App.Router.navigate('error-form?subject=' + encodeURIComponent(this.state.subject))
      ));
    } else {
      // 统计
      const unmastered = errors.filter(e => e.status === '未掌握').length;
      const mastered = errors.filter(e => e.status === '已掌握').length;

      const statsBar = document.createElement('div');
      statsBar.className = 'stats-row';
      statsBar.style.padding = '0';
      statsBar.style.marginBottom = 'var(--spacing-md)';
      statsBar.innerHTML = `
        <div class="stat-item"><div class="stat-item__value">${errors.length}</div><div class="stat-item__label">总错题</div></div>
        <div class="stat-item"><div class="stat-item__value stat-item__value--danger">${unmastered}</div><div class="stat-item__label">待掌握</div></div>
        <div class="stat-item"><div class="stat-item__value">${mastered}</div><div class="stat-item__label">已掌握</div></div>
        <div class="stat-item"><div class="stat-item__value">${errors.length > 0 ? Math.round(mastered/errors.length*100) : 0}%</div><div class="stat-item__label">掌握率</div></div>
      `;
      wrapper.appendChild(statsBar);

      errors.forEach(error => {
        const card = App.Components.errorCard(
          error,
          async (err) => {
            err.status = '已掌握';
            err.lastReviewDate = new Date().toISOString();
            err.reviewCount = (err.reviewCount || 0) + 1;
            await App.DB.updateError(err);
            App.Components.toast('已标记为掌握', 'success');
            this.loadAndRenderTabs();
          },
          async (err) => {
            const confirmed = await App.Components.confirm('删除错题', '确定删除？', '删除', '取消', true);
            if (confirmed) {
              await App.DB.remove('errors', err.id);
              App.Components.toast('已删除', 'success');
              this.loadAndRenderTabs();
            }
          },
          () => App.Router.navigate('error-detail?id=' + error.id),
          () => this.loadAndRenderTabs()
        );
        wrapper.appendChild(card);
      });
    }

    container.appendChild(wrapper);
  }
};

  render(params) {

    const buildModuleCauseChip = (module, reason) => {

    const startModuleCauseEdit = (chip, module, oldName) => {
      chip.classList.add('kp-chip--editing');
      chip.innerHTML = '';
      const input = document.createElement('input');
      input.className = 'kp-edit-input';
