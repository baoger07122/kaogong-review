// ===== 考公笔试复盘系统 - 云端同步层 =====
// 与同源 /api 接口对接；登录后本地数据实时镜像到云端，可跨设备 / 跨版本访问。
// 同步集合：errors / notes / exams / todos / subject_reviews / words
// 说明：应用必须运行在提供 /api 的同源端口（沙箱内部署的 3000 端口）。
//       若页面跑在其它网关端口（如 8000），app.js 会在加载时自动重定向到 3000。
window.App = window.App || {};
App.Cloud = (function () {
  const COLLS = ['errors', 'notes', 'exams', 'todos', 'subject_reviews', 'words'];
  const KT = 'kaogong_cloud_token';
  const KE = 'kaogong_cloud_email';
  const KL = 'kaogong_cloud_last';

  let _token = '';
  let _email = '';
  let _last = 0;          // 上次成功同步时间戳
  let _suppress = false;  // 内部批量写入时抑制自动推送，避免回环
  let _queue = [];        // 待推送任务 {op, coll, item?, id?}
  let _flushing = false;

  // ---------- 基础 ----------
  function init() {
    _token = localStorage.getItem(KT) || '';
    _email = localStorage.getItem(KE) || '';
    _last = parseInt(localStorage.getItem(KL) || '0', 10) || 0;
  }

  function isLoggedIn() { return !!_token; }
  function getEmail() { return _email; }

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + _token, 'Content-Type': 'application/json' };
  }

  function _setSession(token, email) {
    _token = token; _email = email;
    localStorage.setItem(KT, token);
    localStorage.setItem(KE, email);
  }

  function _touch() {
    _last = Date.now();
    localStorage.setItem(KL, String(_last));
  }

  function getLastSyncText() {
    if (!_last) return '尚未同步';
    const d = new Date(_last);
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // ---------- 网络 ----------
  async function postJSON(path, body) {
    try {
      const res = await fetch('/api' + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      let data = null;
      try { data = await res.json(); } catch (e) { data = null; }
      if (!res.ok) return { error: (data && data.error) || ('请求失败 (' + res.status + ')') };
      return data || {};
    } catch (e) {
      return { error: '网络错误，请检查连接' };
    }
  }

  async function pushRecord(coll, item) {
    if (!isLoggedIn() || !COLLS.includes(coll) || !item || !item.id) return;
    const res = await fetch('/api/' + coll, {
      method: 'POST', headers: authHeaders(), body: JSON.stringify(item)
    });
    if (!res.ok) throw new Error('上传 ' + coll + ' 失败(' + res.status + ')');
  }

  async function deleteRecord(coll, id) {
    if (!isLoggedIn() || !COLLS.includes(coll) || !id) return;
    const res = await fetch('/api/' + coll + '/' + encodeURIComponent(id), {
      method: 'DELETE', headers: authHeaders()
    });
    if (!res.ok && res.status !== 404) throw new Error('删除 ' + coll + ' 失败(' + res.status + ')');
  }

  // ---------- 队列（防抖批量推送）----------
  function queuePush(coll, item) { _queue.push({ op: 'put', coll, item }); scheduleFlush(); }
  function queueDelete(coll, id) { _queue.push({ op: 'del', coll, id }); scheduleFlush(); }

  function scheduleFlush() {
    if (_flushing) return;
    setTimeout(flush, 500);
  }

  async function flush() {
    if (_flushing) return;
    _flushing = true;
    const batch = _queue; _queue = [];
    for (const job of batch) {
      try {
        if (job.op === 'put') await pushRecord(job.coll, job.item);
        else await deleteRecord(job.coll, job.id);
      } catch (e) {
        _queue.push(job); // 失败重试
      }
    }
    if (_queue.length) setTimeout(flush, 2000);
    _flushing = false;
  }

  // ---------- 整库同步 ----------
  // 上传：每次保存通过 wrapDB 钩子自动推送（见 _onMutate），无需手动。
  // 下载：手动触发（syncNow）→ 先确保本地改动已上传，再按记录安全合并。
  // 安全原则：拉取绝不 clearStore、绝不因“云端没有”删除本地记录；
  // 仅做「云端新增→插入 / 云端更新(updatedAt 更新)→覆盖」，本地更新或更早则保留。
  async function pushAll() {
    if (!isLoggedIn()) return;
    for (const coll of COLLS) {
      const local = await App.DB.getAll(coll);
      for (const item of local) await pushRecord(coll, item);
    }
    _touch();
  }

  // 手动下载：安全合并（last-write-wins by updatedAt），不删本地、不整库清空
  async function pullMerge() {
    if (!isLoggedIn()) return;
    for (const coll of COLLS) {
      const res = await fetch('/api/' + coll, { headers: authHeaders() });
      if (!res.ok) continue;
      const remote = await res.json();
      const local = await App.DB.getAll(coll);
      const localMap = new Map();
      local.forEach(x => localMap.set(x.id, x));
      const t = (o) => new Date((o && (o.updatedAt || o.createdAt)) || 0).getTime();
      _suppress = true;
      for (const r of remote) {
        const l = localMap.get(r.id);
        if (!l) {
          await App.DB.add(coll, r);            // 云端新增 → 插入本地
        } else if (t(r) > t(l)) {
          await App.DB.put(coll, r);            // 云端更新 → 覆盖本地
        }
        // 本地更新/更早 → 保留本地（已在上一步推上云）
      }
      _suppress = false;
    }
    _touch();
    _refreshUI();
  }

  // 登录后首次协调：先上传本地，再安全合并云端（无需区分空/非空）
  async function reconcile() {
    if (!isLoggedIn()) return;
    try {
      await pushAll();
      await pullMerge();
      App.Components.toast('已同步云端数据 ☁️', 'success');
    } catch (e) {
      App.Components.toast('同步出错：' + (e.message || e), 'error');
    }
    _refreshUI();
  }

  // 手动下载（用户主动点击「立即同步」）：先上传本地改动，再安全合并云端
  async function syncNow() {
    if (!isLoggedIn()) { App.Components.toast('请先登录云同步', 'error'); return; }
    try {
      await pushAll();
      await pullMerge();
      App.Components.toast('同步完成 ☁️', 'success');
      safeRefresh();
    } catch (e) {
      App.Components.toast('同步失败：' + (e.message || e), 'error');
    }
  }

  // 同步后刷新当前页；若在录入表单页则跳过，避免丢失未提交的输入
  function safeRefresh() {
    const p = App.Router && App.Router.currentPage;
    if (p && p.indexOf('-form') !== -1) return;
    if (App.Router && App.Router.handleRoute) App.Router.handleRoute();
  }

  // 应用启动时校验 token 是否仍有效（不拉取数据，尊重本地）
  async function validate() {
    if (!isLoggedIn()) return false;
    try {
      const res = await fetch('/api/errors', { headers: authHeaders() });
      if (res.ok) return true;
      if (res.status === 401) {
        logout();
        App.Components.toast('登录已失效，请重新登录', 'error');
        return false;
      }
      return true;
    } catch (e) {
      return true; // 网络异常时保留 token，稍后重试
    }
  }

  // ---------- 登录 / 注册 / 退出 ----------
  async function login(email, password) {
    const data = await postJSON('/auth/login', { email, password });
    if (data.error) throw new Error(data.error);
    _setSession(data.token, data.email);
    App.Components.toast('登录成功', 'success');
    await reconcile();
    _refreshUI();
  }

  async function register(email, password) {
    const data = await postJSON('/auth/register', { email, password });
    if (data.error) throw new Error(data.error);
    _setSession(data.token, data.email);
    App.Components.toast('注册成功', 'success');
    await reconcile();
    _refreshUI();
  }

  function logout() {
    _token = ''; _email = '';
    localStorage.removeItem(KT);
    localStorage.removeItem(KE);
    App.Components.toast('已退出云同步', 'success');
    _refreshUI();
  }

  // ---------- 自动同步已取消（用户需求：自动上传 + 手动下载）----------
  // 上传：每次保存经 wrapDB 钩子自动推送，无需轮询。
  // 下载：仅用户点击「立即同步」时通过 syncNow() 手动执行，避免页面被自动刷新清空。

  // ---------- 挂载到 DB 写入钩子 ----------
  function wrapDB() {
    const orig = { add: App.DB.add, put: App.DB.put, remove: App.DB.remove };
    App.DB.add = async function (store, item) {
      const r = await orig.add(store, item);
      _onMutate(store, 'put', item);
      App.DB.autoBackup();
      return r;
    };
    App.DB.put = async function (store, item) {
      const r = await orig.put(store, item);
      _onMutate(store, 'put', item);
      App.DB.autoBackup();
      return r;
    };
    App.DB.remove = async function (store, id) {
      const r = await orig.remove(store, id);
      _onMutate(store, 'del', id);
      App.DB.autoBackup();
      return r;
    };
  }

  function _onMutate(store, op, payload) {
    if (_suppress) return;
    if (!isLoggedIn()) return;
    if (!COLLS.includes(store)) return;
    if (op === 'put' && payload && payload.id) queuePush(store, payload);
    else if (op === 'del' && payload) queueDelete(store, payload);
  }

  // 重新渲染设置页（若在设置页）
  function _refreshUI() {
    try {
      if (App.Router && App.Router.currentPage === 'settings' && App.Pages.Settings) {
        App.Pages.Settings.render({});
      }
    } catch (e) { /* ignore */ }
  }

  return {
    init, wrapDB, validate,
    isLoggedIn, getEmail, getLastSyncText,
    login, register, logout,
    syncNow, reconcile,
    COLLS
  };
})();
// ===== 考公笔试复盘系统 - 表单草稿自动暂存 =====
// 解决 iPad 分屏切换 / app 被系统回收 / 任何原因导致页面重建时，未保存的输入丢失问题。
// 原则：边填边存 localStorage（纯本地，不上云）；提交成功后清除；重新打开表单时静默恢复。
// 覆盖页面：error-form / note-form / exam-form（所有录入表单）
window.App = window.App || {};

App.Draft = (function () {
  const PREFIX = 'kaogong_draft_';
  const DEBOUNCE_MS = 800;

  // 内部：取 key
  function _key(pageName) { return PREFIX + pageName; }

  // 保存草稿
  function save(pageName, data) {
    try {
      localStorage.setItem(_key(pageName), JSON.stringify({ data, savedAt: Date.now() }));
    } catch (e) { /* 存满时静默失败 */ }
  }

  // 加载草稿（返回 data 或 null）
  function load(pageName) {
    try {
      const raw = localStorage.getItem(_key(pageName));
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return parsed && parsed.data ? parsed.data : null;
    } catch (e) { return null; }
  }

  // 清除草稿（提交成功后调用）
  function clear(pageName) {
    try { localStorage.removeItem(_key(pageName)); } catch (e) {}
  }

  // 是否有草稿
  function has(pageName) {
    return !!load(pageName);
  }

  // 自动绑定：监听容器内所有输入变化，防抖后保存草稿
  //   container: 表单容器元素
  //   pageName: 草稿 key（如 'error-form'）
  //   getFormData: 返回当前完整 formData 的函数
  // 返回：取消绑定的函数（用于表单销毁时清理）
  function autoSave(container, pageName, getFormData) {
    if (!container || typeof getFormData !== 'function') return function () {};
    let timer = null;
    const handler = function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        try {
          const d = getFormData();
          if (d) save(pageName, d);
        } catch (e) {}
      }, DEBOUNCE_MS);
    };
    // 监听 input / change 事件（覆盖 text/textarea/select/radio/checkbox/contenteditable）
    container.addEventListener('input', handler);
    container.addEventListener('change', handler);
    // 也监听 blur（某些富编辑器用 blur 触发更新）
    container.addEventListener('blur', handler, true);
    return function () {
      clearTimeout(timer);
      container.removeEventListener('input', handler);
      container.removeEventListener('change', handler);
      container.removeEventListener('blur', handler, true);
    };
  }

  // ===== 进行中表单的「续编」恢复（按真实记录 id，杜绝旧草稿串入） =====
  // 设计要点：
  //  1) 新建笔记一律空白；只有「同一篇正在录入」的会话（sessionStorage 里的当前记录 id）才续编。
  //  2) 续编来源优先取 DB 里的真实记录（权威、不会重复建记录）；建记录前的极短窗口才用 localStorage 草稿兜底。
  //  3) 一旦离开表单页（返回/切换/iPad 切窗），路由会清掉 sessionStorage 的当前 id，
  //     于是下次点「新建」必为空白——彻底解决「打开新笔记却冒出旧内容」。
  const FORM_SS = 'kaogong_form_';
  function formDraftKey(page, id) { return 'form_' + page + '_' + id; }

  function getFormId(page) {
    try { return sessionStorage.getItem(FORM_SS + page) || null; } catch (e) { return null; }
  }
  function setFormId(page, id) {
    try { sessionStorage.setItem(FORM_SS + page, id); } catch (e) {}
  }
  function clearForm(page) {
    try {
      const id = sessionStorage.getItem(FORM_SS + page);
      if (id) clear(formDraftKey(page, id));
      sessionStorage.removeItem(FORM_SS + page);
    } catch (e) {}
  }
  function clearDraftKey(page, id) {
    if (id) clear(formDraftKey(page, id));
  }
  function clearAllForms() {
    ['note', 'error', 'exam'].forEach(function (p) { clearForm(p); });
  }
  function saveForm(page, id, data) {
    if (!id) return;
    save(formDraftKey(page, id), data);
  }
  function loadForm(page, id) {
    return id ? load(formDraftKey(page, id)) : null;
  }
  // 与 autoSave 同逻辑，但键名用「表单类型 + 记录 id」
  function autoSaveForm(page, id, container, getFormData) {
    return autoSave(container, formDraftKey(page, id), getFormData);
  }
  function formIdIsTemp(id) { return !id || String(id).charAt(0) === 't'; }
  // 生成「临时表单 id」（以 t 开头，便于 formIdIsTemp 识别）；仅用于草稿键名，非 DB 记录。
  function newTempId() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  }

  // 清除所有草稿（调试/重置用）
  function clearAll() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(PREFIX) === 0) keys.push(k);
    }
    keys.forEach(function (k) { localStorage.removeItem(k); });
    clearAllForms();
  }

  return {
    save: save,
    load: load,
    clear: clear,
    has: has,
    autoSave: autoSave,
    clearAll: clearAll,
    getFormId: getFormId,
    setFormId: setFormId,
    clearForm: clearForm,
    clearDraftKey: clearDraftKey,
    clearAllForms: clearAllForms,
    saveForm: saveForm,
    loadForm: loadForm,
    autoSaveForm: autoSaveForm,
    formIdIsTemp: formIdIsTemp,
    newTempId: newTempId
  };
})();
// ===== 考公笔试复盘系统 - 路由与初始化 =====
window.App = window.App || {};

App.Pages = App.Pages || {};

App.Router = {
  currentPage: 'home',
  currentParams: {},

  init() {
    window.addEventListener('hashchange', () => this.handleRoute());

    // 首次加载
    if (!location.hash) {
      location.replace('#home');
    } else {
      this.handleRoute();
    }
  },

  async handleRoute() {
    const hash = location.hash.slice(1) || 'home';
    const [base, queryString] = hash.split('?');
    const params = {};
    if (queryString) {
      queryString.split('&').forEach(pair => {
        const [k, v] = pair.split('=');
        if (k) params[k] = decodeURIComponent(v || '');
      });
    }

    // 关闭所有标签筛选面板（避免残留监听拦截后续页面点击）
    try {
      document.querySelectorAll('.tag-select').forEach(el => {
        if (el._tsClose) { try { el._tsClose(); } catch (e) {} }
      });
    } catch (e) {}

    // 隐藏所有页面
    document.querySelectorAll('.page').forEach(p => {
      p.style.display = 'none';
      p.classList.remove('active');
    });

    // 显示目标页面
    const pageEl = document.getElementById('page-' + base);
    if (pageEl) {
      pageEl.style.display = 'block';
      pageEl.classList.add('active');
    }

    // 离开表单页时清掉进行中的草稿，确保下次新建必为空白；
    // 但保留「目标即本表单」的情况（如刷新当前页），以支持续编恢复。
    try {
      if (App.Draft && App.Draft.clearForm) {
        ['note', 'error', 'exam'].forEach(function (p) {
          if (base !== p + '-form') App.Draft.clearForm(p);
        });
      }
    } catch (e) {}

    // 更新底部导航高亮
    this.updateNavHighlight(base);

    // 显示/隐藏 FAB
    this.updateFabVisibility(base);

    // 调用页面渲染
    try {
      await this.renderPage(base, params);
    } catch (err) {
      console.error('页面渲染错误:', err);
      App.Components.toast('页面加载失败，请重试', 'error');
    }

    // 滚动到顶部
    window.scrollTo(0, 0);

    this.currentPage = base;
    this.currentParams = params;

    // 更新导航角标
    this.updateNavBadges();

document.addEventListener('DOMContentLoaded', async () => {
  // 云同步后端只在提供 /api 的同源端口（沙箱 3000）可用。
  // 若经其它网关端口（如 8000 的静态服务）打开，探针会失败，此时自动重定向到 3000。
  // 重定向只需带 x-cs-sandbox-port=3000，浏览器会自动附带 x-cs-sandbox-id cookie，无需硬编码。
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    const probe = await fetch('/api/health', { signal: ctrl.signal });
    clearTimeout(t);
    const txt = await probe.text();
    const isCloudPort = probe.ok && txt.indexOf('"ok"') !== -1;
    // 静态托管下 /api/health 会兜底返回 index.html（HTTP 200 但为 HTML，不含 "ok"）。
    // 此时绝不能重定向，否则会无限跳转导致页面打不开。
    // 仅当确认当前源提供真实 API（非 HTML 兜底）但不在云端端口时才跳转（沙箱网关场景）。
    const isHtmlFallback = txt.indexOf('<html') !== -1 || txt.indexOf('<!DOCTYPE') !== -1;
    if (!isCloudPort && !isHtmlFallback) {
      const u = new URL(location.href);
      u.searchParams.set('x-cs-sandbox-port', '3000');
      location.replace(u.toString());
      return;
    }
  } catch (e) {
    // 探针异常（网络/超时）：保守不重定向，避免离线时误跳转；云同步将在网络恢复后由登录流程检测。
  }

  // 初始化主题
  App.Utils.Theme.init();

  // 初始化数据库
  try {
    await App.DB.init();
  } catch (e) {
    console.error('数据库初始化失败:', e);
    if (App.Components && App.Components.toast) {
      App.Components.toast('数据库不可用，部分功能受限', 'error');
    }
  }

  // 加载自定义标签库（考点 / 错因）
  try {
    if (App.Tags && App.Tags.init) await App.Tags.init();
  } catch (e) {
    console.error('标签库加载失败:', e);
  }

  // 初始化云端同步（挂载 DB 钩子 + 校验登录态）
  // 上传为自动（每次保存经 wrapDB 钩子推送）；下载为手动（设置页点「立即同步」）。
  try {
    if (App.Cloud) {
      App.Cloud.init();
      App.Cloud.wrapDB();
      App.Cloud.validate();
    }
  } catch (e) {
    console.error('云同步初始化失败:', e);
  }

  // 初始化内部链接点击监听
  App.Router.initInternalLinks();

  // 初始化路由
  App.Router.init();

  // 自动备份提醒已关闭（用户要求不再提醒备份/恢复）

  // 初始化 FAB 点击事件
  const fab = document.getElementById('fab');
  if (fab) {
    fab.addEventListener('click', () => {
      const page = App.Router.currentPage;
      // 点「新建」前清掉进行中的草稿，保证打开的是空白表单
      if (App.Draft && App.Draft.clearAllForms) App.Draft.clearAllForms();
      switch (page) {
        case 'home':
          // 首页 FAB 可添加待办
          App.Router.navigate('error-form');
          break;
        case 'errors': {
          // 跟随错题本当前选中的科目-模块
          const st = App.Pages.Errors && App.Pages.Errors.state;
          let q = '';
          if (st && st.subject) {
            q = '?subject=' + encodeURIComponent(st.subject);
            if (st.module) q += '&module=' + encodeURIComponent(st.module);
          }
          App.Router.navigate('error-form' + q);
          break;
        }
        case 'notes': {
          // 跟随笔记页当前选中的科目-模块
          const st = App.Pages.Notes && App.Pages.Notes.state;
          let q = '';
          if (st && st.subject) {
            q = '?subject=' + encodeURIComponent(st.subject);
            if (st.module) q += '&module=' + encodeURIComponent(st.module);
          }
          App.Router.navigate('note-form' + q);
          break;
        }
        case 'exams':
          App.Router.navigate('exam-form');
          break;
      }
    });
  }
});

            <div class='todo-stats__label'>未完成</div>
          </div>
          <div class='todo-stats__card'>
            <div class='todo-stats__value todo-stats__value--rate'>${rate}%</div>
            <div class='todo-stats__label'>完成率</div>
          </div>
          <div class='todo-stats__card'>
            <div class='todo-stats__value'>${periodTodos.length}</div>
            <div class='todo-stats__label'>${labels[mode]}总计</div>

      const tab = document.createElement('div');
      tab.className = 'todo-stats__tab active';
      tab.textContent = '今日';
      tabsWrap.appendChild(tab);
      return statsPanel;
    };

    // 日期筛选（默认今日，解决「今日待办」显示昨天待办的问题）
    const dateRow = document.createElement('div');
    dateRow.style.cssText = 'display:flex;gap:var(--spacing-sm);margin-bottom:var(--spacing-sm);';
    [['today','今日'],['week','最近7天'],['all','全部']].forEach(function (pair) {
      const key = pair[0], label = pair[1];
      const chip = document.createElement('div');
      const active = this.todoState.dateFilter === key;
      chip.style.cssText = 'padding:4px 12px;border-radius:9999px;font-size:var(--font-xs);font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent;' + (active ? 'background:var(--color-primary);color:#fff;' : 'background:var(--bg-tertiary);color:var(--text-secondary);');
      chip.textContent = label;
      chip.dataset.dk = key;
      chip.addEventListener('click', () => {
        this.todoState.dateFilter = key;
        dateRow.querySelectorAll('[data-dk]').forEach(c => {
          const on = c.dataset.dk === key;
          c.style.background = on ? 'var(--color-primary)' : 'var(--bg-tertiary)';
          c.style.color = on ? '#fff' : 'var(--text-secondary)';
        });
        refreshTodo();
      });
      dateRow.appendChild(chip);
    }.bind(this));
    todoWrap.appendChild(dateRow);

    // 待办卡片
    const todoCard = document.createElement('div');
    todoCard.className = 'card';
    todoCard.style.cssText = 'margin-bottom:var(--spacing-md);';

    const fillTodoList = (card) => {
      card.innerHTML = '';
      let listTodos = todos.slice();
    const nowDate = new Date();
    const todayStart = new Date(nowDate.getFullYear(), nowDate.getMonth(), nowDate.getDate());
    const weekStart = new Date(todayStart.getTime() - 6 * 24 * 60 * 60 * 1000);
    if (this.todoState.dateFilter === 'today') {
      listTodos = listTodos.filter(t => new Date(t.createdAt) >= todayStart);
    } else if (this.todoState.dateFilter === 'week') {
      listTodos = listTodos.filter(t => new Date(t.createdAt) >= weekStart);
    }
    if (this.todoState.filter === 'active') listTodos = listTodos.filter(t => !t.completed);
    else if (this.todoState.filter === 'done') listTodos = listTodos.filter(t => t.completed);

    if (listTodos.length === 0) {
      const msg = this.todoState.filter === 'done' ? '还没有已完成的待办' : this.todoState.filter === 'active' ? '没有进行中的待办，很棒！' : '还没有待办事项';
      const sub = this.todoState.filter === 'all' ? '选择下方类型并添加' : '切换筛选或添加新待办';
      todoCard.innerHTML = `
        <div style='text-align:center;padding:var(--spacing-xl);'>
          <div style='font-size:32px;margin-bottom:var(--spacing-sm);opacity:0.3;'>${this.todoState.filter === 'done' ? '🎉' : '✅'}</div>
          <div style='font-size:var(--font-md);color:var(--text-secondary);margin-bottom:4px;'>${msg}</div>
          <div style='font-size:var(--font-sm);color:var(--text-tertiary);'>${sub}</div>
        </div>
      `;
    } else {
      listTodos.forEach(todo => {
        const item = document.createElement('div');
        item.className = 'todo-item' + (todo.completed ? ' completed' : '');
        const typeIcon = (TODO_TYPES.find(function (t) { return t.key === (todo.type || 'study'); }) || TODO_TYPES[0]).icon;
        const checkbox = document.createElement('div');
        checkbox.className = 'todo-checkbox' + (todo.completed ? ' checked' : '');
        checkbox.textContent = todo.completed ? '✓' : '';
        checkbox.addEventListener('click', async (e) => {
          e.stopPropagation();
          todo.completed = !todo.completed;
          todo.status = todo.completed ? 'completed' : (todo.status === 'completed' ? 'pending' : (todo.status || 'pending'));
          if (todo.completed) todo.completedAt = new Date().toISOString();
          else todo.completedAt = null;
          await App.DB.updateTodo(todo);
          App.Components.toast(todo.completed ? '已完成 ✓' : '已恢复', 'success');
          refreshTodo();
        });

        const content = document.createElement('div');
        content.className = 'todo-content';
        const title = document.createElement('div');
        title.className = 'todo-title';
        title.textContent = typeIcon + '  ' + todo.text;
        content.appendChild(title);
        let noteEl = null;
        if (todo.note) {
          noteEl = document.createElement('div');
          noteEl.className = 'todo-note';
          noteEl.textContent = todo.note;
          content.appendChild(noteEl);
        }

        // 在原始位置就地展开编辑区（标题 + 备注），不弹出独立页面
        const openInlineEdit = (targetItem) => {
          if (targetItem.dataset.editing === '1') return;
          targetItem.dataset.editing = '1';
          targetItem.classList.add('todo-item--editing');
          if (title) title.style.display = 'none';
          if (noteEl) noteEl.style.display = 'none';

          const editWrap = document.createElement('div');
          editWrap.className = 'todo-inline-edit';

          const titleInput = document.createElement('input');
          titleInput.className = 'todo-inline-edit__title';
          titleInput.type = 'text';
          titleInput.placeholder = '待办内容...';
          titleInput.value = todo.text;

          const noteArea = document.createElement('textarea');
          noteArea.className = 'todo-inline-edit__note';
          noteArea.placeholder = '添加备注...';
          noteArea.value = todo.note || '';

          const actions = document.createElement('div');
          actions.className = 'todo-inline-edit__actions';
          const doneBtn = document.createElement('button');
          doneBtn.className = 'todo-inline-edit__btn todo-inline-edit__btn--done';
          doneBtn.type = 'button';
          doneBtn.textContent = '完成';
          const delBtn = document.createElement('button');
          delBtn.className = 'todo-inline-edit__btn todo-inline-edit__btn--del';
          delBtn.type = 'button';
          delBtn.textContent = '删除';
          actions.appendChild(doneBtn);
          actions.appendChild(delBtn);

          editWrap.appendChild(titleInput);
          editWrap.appendChild(noteArea);
          editWrap.appendChild(actions);
          content.appendChild(editWrap);

          const closeEdit = (rerender) => {
            targetItem.dataset.editing = '0';
            targetItem.classList.remove('todo-item--editing');
            if (title) title.style.display = '';
            if (noteEl) noteEl.style.display = '';
            if (editWrap.parentNode) editWrap.remove();
            if (rerender) refreshTodo();
          };

          const save = async () => {
            const newText = titleInput.value.trim();
            const newNote = noteArea.value.trim();
            let changed = false;
            if (newText && newText !== todo.text) { todo.text = newText; changed = true; }
            if (newNote !== (todo.note || '')) { todo.note = newNote; changed = true; }
            if (changed) {
              await App.DB.updateTodo(todo);
              title.textContent = typeIcon + '  ' + todo.text;
              if (todo.note) {
                if (!noteEl) { noteEl = document.createElement('div'); noteEl.className = 'todo-note'; content.appendChild(noteEl); }
                noteEl.textContent = todo.note;
              } else if (noteEl) {
                noteEl.remove(); noteEl = null;
              }
            }
            closeEdit(false);
          };

          doneBtn.addEventListener('click', (e) => { e.stopPropagation(); save(); });
          titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
          noteArea.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); closeEdit(false); } });
          delBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const ok = await App.Components.confirm('删除待办', '确定删除这项待办？', '删除', '取消', true);
            if (ok) {
              await App.DB.remove('todos', todo.id);
              App.Components.toast('已删除', 'success');
              closeEdit(true);
            }
          });
          editWrap.addEventListener('click', (e) => e.stopPropagation());

          setTimeout(() => { noteArea.focus(); }, 0);
        };

        item.addEventListener('click', (e) => {
          if (e.target === checkbox || e.target.closest('.todo-checkbox')) return;
          openInlineEdit(item);
        });

        item.appendChild(checkbox);
        item.appendChild(content);
        card.appendChild(item);
      });
    }
    };
    // 轻量刷新：只更新计数、进度条和列表，绝不整页重绘
    const refreshTodo = () => {
      const cc = todos.filter(t => t.completed).length;
      const tc = todos.length;
      const pp = tc > 0 ? Math.round(cc / tc * 100) : 0;
      const cnt = document.getElementById('todo-count-text');
      if (cnt) cnt.textContent = cc + '/' + tc;
      const pf = document.getElementById('todo-progress-fill');
      if (pf) pf.style.width = pp + '%';
      App.Utils.transitionSwap(todoCard, (c) => fillTodoList(c));
    };
    fillTodoList(todoCard);
    todoWrap.appendChild(todoCard);

    // 类型快捷栏
    const typeRow = document.createElement('div');
    typeRow.style.cssText = 'display:flex;gap:var(--spacing-sm);margin-bottom:var(--spacing-sm);flex-wrap:wrap;';
    TODO_TYPES.forEach(function (t) {
      const active = this.todoState.type === t.key;
      const tc = document.createElement('div');
      tc.style.cssText = 'padding:5px 12px;border-radius:9999px;font-size:var(--font-xs);cursor:pointer;-webkit-tap-highlight-color:transparent;' + (active ? 'background:var(--color-primary-bg);color:var(--color-primary);border:1px solid var(--color-primary);' : 'background:var(--bg-tertiary);color:var(--text-tertiary);');
      tc.textContent = t.icon + ' ' + t.label;
      tc.dataset.tk = t.key;
      tc.addEventListener('click', () => {
        this.todoState.type = t.key;
        typeRow.querySelectorAll('[data-tk]').forEach(c => {
          const on = c.dataset.tk === t.key;
          c.style.cssText = 'padding:5px 12px;border-radius:9999px;font-size:var(--font-xs);cursor:pointer;-webkit-tap-highlight-color:transparent;' + (on ? 'background:var(--color-primary-bg);color:var(--color-primary);border:1px solid var(--color-primary);' : 'background:var(--bg-tertiary);color:var(--text-tertiary);');
        });
      });
      typeRow.appendChild(tc);
    }.bind(this));
    todoWrap.appendChild(typeRow);

    // 添加输入
    const addTodoRow = document.createElement('div');
    addTodoRow.style.cssText = 'display:flex;gap:var(--spacing-sm);margin-bottom:var(--spacing-xl);';
    const addInput = document.createElement('input');
    addInput.className = 'form-input';
    addInput.placeholder = '添加待办事项...';
    addInput.style.flex = '1';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn btn--primary btn--sm';
    addBtn.textContent = '添加';
    addBtn.addEventListener('click', async () => {
      const text = addInput.value.trim();
      if (!text) { App.Components.toast('请输入待办内容', 'error'); return; }
      const newTodo = await App.DB.addTodo({ text, type: this.todoState.type, completed: false, createdAt: new Date().toISOString() });
      todos.push(newTodo);
      addInput.value = '';
      App.Components.toast('已添加', 'success');
      refreshTodo();
    });
    addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addBtn.click(); });
    addTodoRow.appendChild(addInput);
    addTodoRow.appendChild(addBtn);
    todoWrap.appendChild(addTodoRow);

    container.appendChild(todoWrap);

    // 底部留白
    const spacer = document.createElement('div');
    spacer.style.height = '80px';
    container.appendChild(spacer);
  }
};

  // ===== 智能拆分 v2：把「题干 + 选项」整段文字解析为 题干 与 A/B/C/D 选项 =====
  // 相比旧版：全角归一化、多种标记格式、A→B→C→D 序列校验（避免题干中的字母被误判）、多重兜底策略
  parseQuestion(raw) {
    let text = (raw || '').replace(/\r\n/g, '\n');
    // 1) 归一化：全角字母 Ａ-Ｈ/ａ-ｈ → 半角；全角句点 ．﹒· → .；去掉行首多余空白
    text = text.replace(/[Ａ-Ｈａ-ｈ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
    text = text.replace(/[．﹒]/g, '.');
    text = text.split('\n').map(l => l.replace(/^[ \t\u3000]+/, '')).join('\n').trim();
    if (!text) return { question: '', options: [] };

    // 题干规范：OCR 粘贴的题干含大量换行噪音，先把题目部分所有换行/空白合并为一行，
    // 再单独拆出最后一句（问题，以 。！？!? 结尾）换行显示，便于看清提问
    const breakLastSentence = (q) => {
      if (!q) return q;
      const t = q.replace(/\s+/g, ' ').trim();
      const m = t.match(/^([\s\S]*?)([^。！？!?]+[。！？!?])\s*$/);
      if (m && m[1].trim() && m[2].trim()) {
        return m[1].trim() + '\n' + m[2].trim();
      }
      return t;
    };

    // 2) 收集所有候选选项标记（记录字母，供序列校验）
    const candidates = [];
    let m;
    // 形式一：A. / A、 / A。 / A： / A） 等（前面须是行首、空白或 ：（ 等分隔符）
    const re1 = /(^|[\n\s\u3000：:；;（(])([A-Ha-h])\s*[\.、。:：)）]\s*/g;
    while ((m = re1.exec(text)) !== null) {
      candidates.push({ letter: m[2].toUpperCase(), index: m.index + m[1].length, end: m.index + m[0].length });
    }
    // 形式二：（A）/ (A) / 【A】 / [A]
    const re2 = /[（(【\[]\s*([A-Ha-h])\s*[）)】\]]\s*/g;
    while ((m = re2.exec(text)) !== null) {
      candidates.push({ letter: m[1].toUpperCase(), index: m.index, end: m.index + m[0].length });
    }
    // 形式三：行首裸字母 + 空格（OCR 常见丢标点：「A 选项内容」）
    const re3 = /(^|\n)([A-Ha-h])[ \t\u3000]+(?=\S)/g;
    while ((m = re3.exec(text)) !== null) {
      candidates.push({ letter: m[2].toUpperCase(), index: m.index + m[1].length, end: m.index + m[0].length });
    }
    candidates.sort((a, b) => a.index - b.index || a.end - b.end);

    // 3) 序列校验：从每个 'A' 出发贪心找 A→B→C→D… 连续递增链，
    //    取最长链；等长取起点最靠后的（题干中出现的干扰字母通常在前面）
    let best = null;
    for (let i = 0; i < candidates.length; i++) {
      if (candidates[i].letter !== 'A') continue;
      const chain = [candidates[i]];
      let want = 'B';
      for (let j = i + 1; j < candidates.length; j++) {
        if (candidates[j].letter === want && candidates[j].index >= chain[chain.length - 1].end) {
          chain.push(candidates[j]);
          want = String.fromCharCode(want.charCodeAt(0) + 1);
        }
      }
      if (chain.length >= 2 && (!best || chain.length > best.length ||
          (chain.length === best.length && chain[0].index > best[0].index))) {
        best = chain;
      }
    }
    if (best) {
      const question = text.slice(0, best[0].index).replace(/[（(【\[]\s*$/, '').trim();
      const options = best.map((c, i) => {
        const start = c.end;
        const end = (i + 1 < best.length) ? best[i + 1].index : text.length;
        return text.slice(start, end).trim().replace(/\s*\n\s*/g, ' ');
      });
      return { question: breakLastSentence(question), options };
    }

    // 4) 兜底一：①②③④ 行首标记作为选项
    const circleLines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const circleIdx = circleLines.findIndex(l => /^[①②③④⑤⑥⑦⑧]/.test(l));
    if (circleIdx > 0 && circleLines.slice(circleIdx).every(l => /^[①②③④⑤⑥⑦⑧]/.test(l))) {
      return {
        question: breakLastSentence(circleLines.slice(0, circleIdx).join('\n')),
        options: circleLines.slice(circleIdx).map(l => l.replace(/^[①②③④⑤⑥⑦⑧]\s*[\.、。:：]?\s*/, ''))
      };
    }

    // 5) 兜底二：按行拆分——以最后一个含「？/?/（ ）」的行为题干结尾，其后各行为选项
    const lines = circleLines;
    if (lines.length >= 2) {
      let qEnd = 0;
      for (let i = 0; i < lines.length - 1; i++) {
        if (/[？?]\s*$|（\s*）|\(\s*\)/.test(lines[i])) qEnd = i;
      }
      return { question: breakLastSentence(lines.slice(0, qEnd + 1).join('\n')), options: lines.slice(qEnd + 1) };
    }
    return { question: breakLastSentence(text), options: [] };
  },

        <div class="modal-dialog__body">
          <div style="font-size:var(--font-xs);color:var(--text-tertiary);margin-bottom:8px;line-height:1.6;">
            粘贴「题干 + 选项」整段文字，自动拆分成题干与 A/B/C/D 选项。支持 A. / A、 / （A） / 全角Ａ / 丢标点「A 内容」/ ①②③④ 等多种格式，自动排除题干中的干扰字母
          </div>
        </div>
      </div>
    `;
    const body = overlay.querySelector('.modal-dialog__body');
    const ta = document.createElement('textarea');
    ta.className = 'form-textarea';
    ta.style.minHeight = '170px';
    ta.style.textAlign = 'left';
    ta.placeholder = '例：\n某市进行人口普查……下列说法正确的是？\nA. 选项一内容\nB. 选项二内容\nC. 选项三内容\nD. 选项四内容';
    body.appendChild(ta);

    const actions = document.createElement('div');
    actions.className = 'modal-dialog__actions';
    const cancel = document.createElement('button');
    cancel.className = 'btn-cancel';
    cancel.textContent = '取消';
    const ok = document.createElement('button');
    ok.className = 'btn-confirm';
    ok.textContent = '识别拆分';
    actions.appendChild(cancel);
    actions.appendChild(ok);
    overlay.querySelector('.modal-dialog').appendChild(actions);

    cancel.addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    ok.addEventListener('click', () => {
      const parsed = this.parseQuestion(ta.value);
      if (!parsed.question.trim() && parsed.options.filter(o => o.trim()).length === 0) {
        App.Components.toast('未识别到内容', 'error');
        return;
      }
      formData.question = parsed.question.trim();
      formData.options = [
        parsed.options[0] || '', parsed.options[1] || '',
        parsed.options[2] || '', parsed.options[3] || ''
      ];
      overlay.remove();
      if (rebuild) rebuild();
      App.Components.toast('已拆分填入 ✓', 'success');
    });

    container.appendChild(overlay);
    setTimeout(() => ta.focus(), 50);
  },

  async renderSubjectGrid(container) {
    this._expanded = this._expanded || {};
    const errorCounts = {};
    App.Constants.SUBJECTS.forEach(s => {
      errorCounts[s.name] = this.state.allErrors.filter(e => e.subject === s.name).length;
    });

    container.innerHTML = '';

    // 「全部」项
    const allItem = document.createElement('div');
    allItem.className = 'sidebar__item' + (this.state.subject === null ? ' active' : '');
    allItem.innerHTML = `
      <span class="sidebar__item-icon">📚</span>
      <span class="sidebar__item-name">全部</span>
    `;
    allItem.addEventListener('click', () => {
      this.state.subject = null;
      this.state.module = null;
      this.state.knowledgePoint = null;
      this._expanded = {};
      this.refreshAll();
    });
    container.appendChild(allItem);

    // 各科目（可展开 -> 模块）
    App.Constants.SUBJECTS.forEach(s => {
      const isActive = this.state.subject === s.name;
      const expanded = !!this._expanded[s.name];
      const modules = App.Constants.getModules(s.name);

      const row = document.createElement('div');
      row.className = 'sidebar__item' + (isActive ? ' active' : '') + (expanded ? ' sidebar__item--expanded' : '');
      const count = errorCounts[s.name];
      row.innerHTML = `
        <span class="sidebar__arrow">▶</span>
        <span class="sidebar__item-icon">${s.icon}</span>
        <span class="sidebar__item-name">${s.name}</span>
        ${count > 0 ? `<span class="sidebar__item-count">${count}</span>` : ''}
      `;
      // 箭头：展开/收起该科目下的模块
      row.querySelector('.sidebar__arrow').addEventListener('click', (e) => {
        e.stopPropagation();
        this._expanded[s.name] = !this._expanded[s.name];
        this.renderSubjectGrid(container);
      });
      // 点击科目行：选中 / 取消该科目
      row.addEventListener('click', () => {
        this.state.subject = (this.state.subject === s.name) ? null : s.name;
        this.state.module = null;
        this.state.knowledgePoint = null;
        this.refreshAll();
      });
      container.appendChild(row);

      // 模块（仅在该科目展开时显示，作为左侧二级导航）
      if (expanded) {
        modules.forEach(mod => {
          const mCount = this.state.allErrors.filter(e => e.subject === s.name && e.module === mod).length;
          const sub = document.createElement('div');
          sub.className = 'sidebar__sub' + (isActive && this.state.module === mod ? ' active' : '');
          sub.innerHTML = `
            <span class="sidebar__sub-name">${mod}</span>
            ${mCount > 0 ? `<span class="sidebar__sub-count">${mCount}</span>` : ''}
          `;
          sub.addEventListener('click', (e) => {
            e.stopPropagation();
            this.state.subject = s.name;
            this.state.module = (this.state.module === mod) ? null : mod;
            this.state.knowledgePoint = null;
            this.refreshAll();
          });
          container.appendChild(sub);
        });
      }
    });
  },

  renderStats(container) {
    const subject = this.state.subject;
    let errors = this.state.allErrors;
    if (subject) errors = errors.filter(e => e.subject === subject);
    if (this.state.module) errors = errors.filter(e => e.module === this.state.module);

    const total = errors.length;
    const unmastered = errors.filter(e => e.status === '未掌握').length;
    const mastered = errors.filter(e => e.status === '已掌握').length;
    const todayStr = new Date().toISOString().slice(0, 10);
    const weekNew = errors.filter(e => e.createdAt.slice(0, 10) >= todayStr.slice(0, 8) + String(Math.max(1, parseInt(todayStr.slice(8)) - 7)).padStart(2, '0')).length;
    const thisWeekNew = errors.filter(e => {
      const d = new Date(e.createdAt);
      const now = new Date();
      const weekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
      return d >= weekAgo;
    }).length;

    container.innerHTML = `
      <div class="stat-item">
        <div class="stat-item__value">${total}</div>
        <div class="stat-item__label">总错题</div>
      </div>
      <div class="stat-item">
        <div class="stat-item__value stat-item__value--danger">${unmastered}</div>
        <div class="stat-item__label">待掌握</div>
      </div>
      <div class="stat-item">
        <div class="stat-item__value">${mastered}</div>
        <div class="stat-item__label">已掌握</div>
      </div>
      <div class="stat-item">
        <div class="stat-item__value">${thisWeekNew}</div>
        <div class="stat-item__label">本周新增</div>
      </div>
    `;
  },

  renderFilters(container) {
    container.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'tag-select-row';

    // 考点筛选（模块已在左侧导航选择）
    if (this.state.module) {
      const kps = this.getDistinctKnowledgePoints(this.state.module);
      row.appendChild(App.Components.tagSelect(
        kps.map(k => ({ name: k })),
        this.state.knowledgePoint,
        (kp) => {
          this.state.knowledgePoint = (this.state.knowledgePoint === kp) ? null : kp;
          this.refreshFiltersAndList();
        },
        { kind: 'kp', module: this.state.module, onDone: () => this.refreshFiltersAndList(), placeholder: '考点' }
      ));
    }

    // 错因筛选
    const causes = this.getDistinctErrorCauses();
    row.appendChild(App.Components.tagSelect(
      causes.map(c => ({ name: c })),
      this.state.errorCause,
      (cause) => {
        this.state.errorCause = (this.state.errorCause === cause) ? null : cause;
        this.refreshFiltersAndList();
      },
      { kind: 'ec', module: this.state.module, onDone: () => this.refreshFiltersAndList(), placeholder: '错因' }
    ));

    // 状态筛选
    row.appendChild(App.Components.tagSelect(
      ['未掌握', '已掌握'],
      this.state.status,
      (status) => {
        this.state.status = (this.state.status === status) ? null : status;
        this.refreshFiltersAndList();
      },
      { placeholder: '状态', showMenu: false }
    ));

    // 画廊窗口大小切换（小 / 中 / 大）
    const sizeSwitch = document.createElement('div');
    sizeSwitch.className = 'gallery-size-switch';
    const curSize = this.state.gallerySize || 'md';
    [['sm', '小'], ['md', '中'], ['lg', '大']].forEach((pair) => {
      const key = pair[0], label = pair[1];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'gallery-size-switch__btn' + (curSize === key ? ' active' : '');
      b.textContent = label;
      b.title = key === 'sm' ? '小窗口' : key === 'md' ? '中窗口' : '大窗口';
      b.addEventListener('click', () => {
        this.state.gallerySize = key;
        this.state.gallerySizeAuto = false;
        this.refreshAll();
      });
      sizeSwitch.appendChild(b);
    });
    row.appendChild(sizeSwitch);

    container.appendChild(row);
  },

  async renderList(container) {
    container.innerHTML = '';

    // 构建筛选条件
    const filters = {};
    if (this.state.subject) filters.subject = this.state.subject;
    if (this.state.module) filters.module = this.state.module;
    if (this.state.knowledgePoint) filters.knowledgePoint = this.state.knowledgePoint;
    if (this.state.errorCause) filters.errorCause = this.state.errorCause;
    if (this.state.status) filters.status = this.state.status;
    if (this.state.search) filters.search = this.state.search;

    const errors = await App.DB.getErrors(filters);

    // 更新标题计数
    const countEl = document.getElementById('error-count');
    if (countEl) countEl.textContent = '共 ' + errors.length + ' 道';

    if (errors.length === 0) {
      container.appendChild(App.Components.emptyState(
        '📋',
        '还没有错题',
        '复盘时记录的错题会自动收录到这里',
        '添加错题',
        () => {
          // 跟随当前选中的科目-模块
          let q = '';
          if (this.state.subject) {
            q = '?subject=' + encodeURIComponent(this.state.subject);
            if (this.state.module) q += '&module=' + encodeURIComponent(this.state.module);
          }
          App.Router.navigate('error-form' + q);
        }
      ));
      return;
    }

    // Notion 画廊模式：网格卡片，右侧可切换小/中/大窗口
    const size = this.state.gallerySize || 'md';
    const gallery = document.createElement('div');
    gallery.className = 'error-gallery error-gallery--' + size;

    errors.forEach((error) => {
      const card = App.Components.galleryErrorCard(
        error,
        () => App.Router.navigate('error-detail?id=' + error.id)
      );
      gallery.appendChild(card);
    });
    container.appendChild(gallery);
  },

  // 局部刷新：筛选条即时切换不动画，列表仅做进入动画
  refreshFiltersAndList() {
    const filterArea = document.getElementById('error-filter-area');
    const listArea = document.getElementById('error-list');
    if (filterArea) this.renderFilters(filterArea);
    if (listArea) App.Utils.transitionSwap(listArea, (c) => this.renderList(c));
  },

  refreshAll() {
    const sidebar = document.getElementById('error-sidebar');
    const searchArea = document.getElementById('error-search-area');
    const statsRow = document.getElementById('error-stats');
    const filterArea = document.getElementById('error-filter-area');
    const listArea = document.getElementById('error-list');

    if (sidebar) this.renderSubjectGrid(sidebar);
    if (searchArea) this.renderSearchBar(searchArea);
    if (statsRow) this.renderStats(statsRow);
    if (filterArea) this.renderFilters(filterArea);
    if (listArea) App.Utils.transitionSwap(listArea, (c) => this.renderList(c));
  },

  // 右上角三点菜单
  async _showPageMenu() {
    const action = await App.Components.actionSheet([
      { label: '🔍 ' + (this.state.searchVisible ? '隐藏搜索' : '搜索错题'), value: 'search' }
    ], '错题本');
    if (action === 'search') {
      this.state.searchVisible = !this.state.searchVisible;
      const searchArea = document.getElementById('error-search-area');
      if (searchArea) this.renderSearchBar(searchArea);
    }
  },

  renderSearchBar(container) {
    container.innerHTML = '';
    if (!this.state.searchVisible) return;
    const searchBar = document.createElement('div');
    searchBar.className = 'search-bar';
    searchBar.style.marginBottom = 'var(--spacing-md)';
    const val = (this.state.search || '').replace(/"/g, '&quot;');
    searchBar.innerHTML = `
      <span class="search-bar__icon">🔍</span>
      <input type="text" placeholder="搜索错题 / 知识点" id="error-search" value="${val}">
    `;
    container.appendChild(searchBar);
    const input = searchBar.querySelector('input');
    input.addEventListener('input', App.Utils.debounce((e) => {
      this.state.search = e.target.value;
      this.renderList(document.getElementById('error-list'));
    }, 300));
  },

  // ===== 错题详情页 =====
  async renderDetail(params) {
    const container = document.getElementById('page-error-detail');
    container.innerHTML = '';

    const errorId = params.id;
    if (!errorId) {
      App.Router.navigate('errors');
      return;
    }

    const error = await App.DB.get('errors', errorId);
    if (!error) {
      App.Components.toast('错题不存在', 'error');
      App.Router.navigate('errors');
      return;
    }

    // 数据迁移：旧版 error.doodle 迁移为底部独立手写笔记；screenDoodle 用于屏幕勾画
    if (error.doodle && !error.handNote) {
      error.handNote = error.doodle;
      delete error.doodle;
      error.doodleHidden = false;
      await App.DB.updateError(error).catch(() => {});
    }

    // 返回栏 + 右上角：屏幕勾画铅笔 + 三点菜单（编辑已整合进三点菜单）
    const header = App.Components.pageHeader('错题详情');
    const detailRight = header.querySelector('.page-header__right');
    if (detailRight) {
      detailRight.style.display = 'flex';
      detailRight.style.alignItems = 'center';
      detailRight.style.gap = '2px';
      detailRight.innerHTML = '';

      const doodleBtn = document.createElement('button');
      doodleBtn.className = 'detail-header-action';
      doodleBtn.title = error.screenDoodle ? '屏幕勾画（已隐藏保存）' : '屏幕勾画';
      doodleBtn.innerHTML = '✏️' + (error.screenDoodle ? '<span class="detail-header-action__dot"></span>' : '');
      doodleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this._openScreenDoodle(error, params);
      });
      detailRight.appendChild(doodleBtn);

      const moreBtn = document.createElement('button');
      moreBtn.className = 'detail-header-action';
      moreBtn.textContent = '⋮';
      moreBtn.title = '更多操作';
      moreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this._showErrorMenu(error);
      });
      detailRight.appendChild(moreBtn);
    }
    container.appendChild(header);

    const content = document.createElement('div');
    content.style.cssText = 'padding:var(--spacing-md) var(--page-padding);padding-bottom:calc(var(--nav-height) + var(--safe-bottom) + var(--spacing-lg));';

    // 题号 + 标签
    const headerInfo = document.createElement('div');
    headerInfo.style.cssText = 'margin-bottom:var(--spacing-md);';
    const subjectTagType = {
      '言语理解': 'primary', '数量关系': 'warning', '判断推理': 'success',
      '资料分析': 'purple', '常识判断': 'gold', '申论': 'teal'
    };
    const statusType = error.status === '已掌握' ? 'success' : 'danger';
    const kps = (error.knowledgePoints || []);
    let detailLines = '';
    if (kps.length) {
      detailLines += `<div style="margin-bottom:4px;"><span style="font-weight:600;color:var(--text-secondary);font-size:var(--font-xs);">考点：</span>${kps.map(kp => `<span class="tag tag--neutral">${kp}</span>`).join('')}</div>`;
    }
    if (error.errorCause) {
      detailLines += `<div style="margin-bottom:4px;"><span style="font-weight:600;color:var(--text-secondary);font-size:var(--font-xs);">错因：</span><span class="tag tag--neutral">${error.errorCause}</span></div>`;
    }
    if (error.pitfall) {
      detailLines += `<div style="margin-bottom:4px;"><span style="font-weight:600;color:var(--text-secondary);font-size:var(--font-xs);">挖坑点：</span><span style="font-size:var(--font-sm);color:var(--text-secondary);">${error.pitfall}</span></div>`;
    }
    headerInfo.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <span class="tag tag--${statusType}">${error.status}</span>
      </div>
      ${detailLines}
    `;
    content.appendChild(headerInfo);

    // 题干（white-space:pre-line 保留编辑页手动换行）
    const questionEl = document.createElement('div');
    questionEl.style.cssText = 'font-size:var(--font-md);line-height:1.7;margin-bottom:var(--spacing-md);padding:var(--spacing-md);background:var(--bg-tertiary);border-radius:var(--radius-md);white-space:pre-line;';
    questionEl.textContent = error.question;
    content.appendChild(questionEl);

    // 选项
    const optionsList = document.createElement('div');
    optionsList.className = 'options-list';
    const letters = ['A', 'B', 'C', 'D'];
    (error.options || []).forEach((opt, idx) => {
      const letter = letters[idx] || String(idx);
      const isCorrect = letter === error.correctOption;
      const isWrong = letter === error.userOption;

      const item = document.createElement('div');
      item.className = 'option-item';
      if (isCorrect) item.classList.add('option-item--correct');
      if (isWrong) item.classList.add('option-item--wrong');

      let label = '';
      if (isCorrect && isWrong) label = ' ✅ 正确答案（你的选择）';
      else if (isCorrect) label = ' ✅ 正确答案';
      else if (isWrong) label = ' ❌ 你的选择';

      item.innerHTML = `
        <span class="option-item__letter">${letter}.</span>
        <span>${opt}${label}</span>
      `;
      optionsList.appendChild(item);
    });
    content.appendChild(optionsList);

    // 正确率
    const accuracyEl = document.createElement('div');
    accuracyEl.style.cssText = 'font-size:var(--font-sm);color:var(--text-secondary);margin-bottom:var(--spacing-md);';
    accuracyEl.innerHTML = `📊 全站正确率：<strong>${error.accuracy || 0}%</strong>`;
    content.appendChild(accuracyEl);

    // 题目来源
    if (error.questionSource) {
      const sourceEl = document.createElement('div');
      sourceEl.style.cssText = 'font-size:var(--font-sm);color:var(--text-secondary);margin-bottom:var(--spacing-md);';
      sourceEl.innerHTML = `📚 题目来源：<strong>${error.questionSource}</strong>`;
      content.appendChild(sourceEl);
    }

    // 错题笔记（个人复盘心得）
    const enoteTitle = document.createElement('div');
    enoteTitle.style.cssText = 'font-size:var(--font-sm);font-weight:600;color:var(--text-secondary);margin:0 0 var(--spacing-sm);';
    enoteTitle.innerHTML = '📒 错题笔记 <span style="font-weight:400;color:var(--text-tertiary);font-size:var(--font-xs);">（点击可编辑，记录复盘心得）</span>';
    content.appendChild(enoteTitle);

    const enoteContent = document.createElement('div');
    enoteContent.className = 'card';
    enoteContent.style.cssText = 'margin:0 0 4px 0;line-height:1.7;min-height:60px;cursor:pointer;';
    enoteContent.innerHTML = error.note
      ? App.Utils.simpleMarkdown(error.note)
      : '<span style="color:var(--text-tertiary);">点击添加错题笔记</span>';
    content.appendChild(enoteContent);

    let enoteEditing = false;
    enoteContent.addEventListener('click', () => {
      if (enoteEditing) return;
      enoteEditing = true;
      enoteContent.style.cursor = 'default';
      // 替换为编辑器前先锁定当前高度，避免清空内容导致塌陷/抖动
      enoteContent.style.minHeight = Math.max(enoteContent.offsetHeight, 60) + 'px';
      const editor = App.Components.notionEditor(error.note, false, function (content) {
        error.note = content;
      });
      enoteContent.innerHTML = '';
      enoteContent.appendChild(editor.element);

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;margin-top:8px;';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn btn--primary btn--sm';
      saveBtn.textContent = '保存';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn--outline btn--sm';
      cancelBtn.textContent = '取消';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      enoteContent.appendChild(actions);

      saveBtn.addEventListener('click', async () => {
        error.note = editor.getContent();
        await App.DB.updateError(error);
        App.Components.toast('已保存 ✓', 'success');
        this.renderDetail(params);
      });
      cancelBtn.addEventListener('click', () => { this.renderDetail(params); });
    });

    // 解析分析笔记
    const noteTitle = document.createElement('div');
    noteTitle.style.cssText = 'font-size:var(--font-sm);font-weight:600;color:var(--text-secondary);margin:var(--spacing-md) 0 var(--spacing-sm);';
    noteTitle.innerHTML = '📝 解析分析笔记 <span style="font-weight:400;color:var(--text-tertiary);font-size:var(--font-xs);">（点击可编辑）</span>';
    content.appendChild(noteTitle);

    const noteContent = document.createElement('div');
    noteContent.className = 'card';
    noteContent.style.cssText = 'margin:0 0 4px 0;line-height:1.7;min-height:60px;cursor:pointer;';
    noteContent.innerHTML = error.analysisNote
      ? App.Utils.simpleMarkdown(error.analysisNote)
      : '<span style="color:var(--text-tertiary);">点击添加解析笔记</span>';
    content.appendChild(noteContent);

    // 点击就地编辑解析笔记
    let noteEditing = false;
    noteContent.addEventListener('click', () => {
      if (noteEditing) return;
      noteEditing = true;
      noteContent.style.cursor = 'default';
      // 替换为编辑器前先锁定当前高度，避免清空内容导致塌陷/抖动
      noteContent.style.minHeight = Math.max(noteContent.offsetHeight, 60) + 'px';
      const editor = App.Components.notionEditor(error.analysisNote, false, function (content) {
        error.analysisNote = content;
      });
      noteContent.innerHTML = '';
      noteContent.appendChild(editor.element);

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;margin-top:8px;';
      const saveBtn = document.createElement('button');
      saveBtn.className = 'btn btn--primary btn--sm';
      saveBtn.textContent = '保存';
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn--outline btn--sm';
      cancelBtn.textContent = '取消';
      actions.appendChild(saveBtn);
      actions.appendChild(cancelBtn);
      noteContent.appendChild(actions);

      saveBtn.addEventListener('click', async () => {
        error.analysisNote = editor.getContent();
        await App.DB.updateError(error);

      上次复习 ${error.lastReviewDate ? App.Utils.formatDate(error.lastReviewDate) : '从未'}
    `;

    container.appendChild(content);
  },

  // ===== 错题详情页右上角三点菜单 =====
  async _showErrorMenu(error) {
    const isMastered = error.status === '已掌握';
    const action = await App.Components.actionSheet([
      { label: '✏️ 编辑题目', value: 'edit' },
      { label: isMastered ? '↩️ 标记未掌握' : '✓ 标记已掌握', value: 'master' },
      { label: '📅 加入今日复习', value: 'review' },
      { label: '🗑️ 删除', value: 'delete' }
    ], error.question ? error.question.slice(0, 20) : '错题');
    if (!action) return;

    switch (action) {
      case 'edit': {
        App.Router.navigate('error-form?id=' + error.id);
        break;
      }
      case 'master': {
        if (isMastered) {
          error.status = '未掌握';
          await App.DB.updateError(error);
          App.Components.toast('已标记为未掌握', 'success');
        } else {
          error.status = '已掌握';
          error.lastReviewDate = new Date().toISOString();
          error.reviewCount = (error.reviewCount || 0) + 1;
          await App.DB.updateError(error);
          App.Components.toast('已标记为掌握 ✓', 'success');
        }
        this.renderDetail({ id: error.id });
        break;
      }
      case 'review': {
        error.lastReviewDate = new Date().toISOString();
        error.reviewCount = (error.reviewCount || 0) + 1;
        await App.DB.updateError(error);
        App.Components.toast('已加入今日复习', 'success');
        this.renderDetail({ id: error.id });
        break;
      }
      case 'delete': {
        const confirmed = await App.Components.confirm(
          '删除错题',
          '确定删除这道错题？此操作不可撤销。',
          '删除', '取消', true
        );
        if (confirmed) {
          await App.DB.remove('errors', error.id);
          App.Components.toast('已删除', 'success');
          App.Router.navigate('errors');
        }
        break;
      }
    }
  },

  // ===== 打开屏幕勾画覆盖层（右上角铅笔图标触发） =====
  _openScreenDoodle(error, params) {

  // ===== 打开底部手写笔记覆盖层 =====
  _openHandNote(error, params) {

      initial: error.handNote || null,
      onChange: async (dataURL) => {
        error.handNote = dataURL || null;
        try { await App.DB.updateError(error); } catch (e) {}
      }
    }).then(async (dataURL) => {
      error.handNote = dataURL || null;
      try { await App.DB.updateError(error); } catch (e) {}
      this.renderDetail(params);

  },

  // ===== 新建/编辑错题表单 =====
  renderForm(params) {
    const container = document.getElementById('page-error-form');
    container.innerHTML = '';

    let isEdit = !!params.id;

    // 默认空白表单
    let formData = {
      subject: '',
      module: '',
      knowledgePoints: [],
      errorCause: '',
      pitfall: '',
      question: '',
      options: ['', '', '', ''],
      correctOption: '',
      userOption: '',
      accuracy: '',
      analysisNote: '',
      note: '',
      questionSource: '',
      status: '未掌握',
      sourceExamId: params.examId || null
    };

    // 如果是编辑，加载数据；如果是新建，尝试恢复「同一篇正在录入」的草稿
    const loadAndRender = async () => {
      if (isEdit) {
        const error = await App.DB.get('errors', params.id);
        if (error) {
          formData = {
            subject: error.subject || '',
            module: error.module || '',
            knowledgePoints: error.knowledgePoints || [],
            errorCause: error.errorCause || '',
            pitfall: error.pitfall || '',
            question: error.question || '',
            options: error.options || ['', '', '', ''],
            correctOption: error.correctOption || '',
            userOption: error.userOption || '',
            accuracy: error.accuracy !== undefined ? String(error.accuracy) : '',
            analysisNote: error.analysisNote || '',
            note: error.note || '',
            questionSource: error.questionSource || '',
            status: error.status || '未掌握',
            sourceExamId: error.sourceExamId || null,
            id: error.id
          };
        }
        formData._formId = params.id;
      } else {
        // 新建/续编：仅当 sessionStorage 记录着「同一篇正在录入」的 id 时才续编；否则一律空白。
        const fid = App.Draft.getFormId('error');
        if (fid) {
          if (App.Draft.formIdIsTemp(fid)) {
            const d = App.Draft.loadForm('error', fid);
            if (d) Object.assign(formData, d);
            formData._formId = fid;
          } else {
            const error = await App.DB.get('errors', fid);
            if (error) {
              isEdit = true;
              formData = {
                subject: error.subject || '',
                module: error.module || '',
                knowledgePoints: error.knowledgePoints || [],
                errorCause: error.errorCause || '',
                pitfall: error.pitfall || '',
                question: error.question || '',
                options: error.options || ['', '', '', ''],
                correctOption: error.correctOption || '',
                userOption: error.userOption || '',
                accuracy: error.accuracy !== undefined ? String(error.accuracy) : '',
                analysisNote: error.analysisNote || '',
                note: error.note || '',
                questionSource: error.questionSource || '',
                status: error.status || '未掌握',
                sourceExamId: error.sourceExamId || null,
                id: error.id
              };
              formData._formId = fid;
            }
          }
        }
        // URL 参数指定科目-模块（从某科目点新建）优先
        if (!formData.subject && params.subject) {
          formData.subject = params.subject;
          if (params.module && App.Constants.getModules(params.subject).indexOf(params.module) !== -1) {
            formData.module = params.module;
          }
        }
        // 仍未指定科目时，默认带入上次选择的科目-模块
        if (!formData.subject) {
          const last = App.Utils.rememberSelect.get('error');
          if (last && last.subject) {
            formData.subject = last.subject;
            formData.module = (last.module && App.Constants.getModules(last.subject).indexOf(last.module) !== -1) ? last.module : '';
          }
        }
        if (!formData._formId) {
          formData._formId = App.Draft.newTempId();
          App.Draft.setFormId('error', formData._formId);
        }
        // 从某套卷点「加错题」时，关联回该套卷
        if (params.examId && !formData.sourceExamId) formData.sourceExamId = params.examId;
      }
      buildForm();
    };

    const buildForm = () => {
      container.innerHTML = '';

      // 返回栏
      container.appendChild(App.Components.pageHeader(
        isEdit ? '编辑错题' : '添加错题',
        isEdit ? '保存' : '提交',
        async () => {
          if (!formData.subject || !formData.module || formData.knowledgePoints.length === 0 || !formData.errorCause || !formData.question) {
            App.Components.toast('请先完成必填项', 'error');
            return;
          }
          await submitForm();
        }
      ));

      const form = document.createElement('div');
      form.className = 'form-page';

      // 科目
      form.appendChild(App.Components.formSelector(
        '科目',
        App.Constants.SUBJECTS,
        formData.subject,
        (val) => {
          formData.subject = val;
          formData.module = '';
          formData.knowledgePoints = [];
          buildForm();
        },
        true
      ));

      // 模块
      if (formData.subject) {
        form.appendChild(App.Components.formSelector(
          '模块',
          App.Constants.getModules(formData.subject),
          formData.module,
          (val) => {
            formData.module = val;
            formData.knowledgePoints = [];
            buildForm();
          },
          true
        ));
      }

      // 考点
      if (formData.module) {
        form.appendChild(App.Components.tagInput(
          '考点',
          App.Tags.getKnowledgePointSuggestions(formData.module),
          formData.knowledgePoints,
          (val) => { formData.knowledgePoints = val; },
          3,
          true,
          '输入自定义考点，回车添加',
          (v) => App.Tags.addKnowledgePoint(formData.module, v),
          { kind: 'kp', module: formData.module, onDone: () => buildForm() }
        ));
      }

      // 错因（仅该模块的专属错因）
      form.appendChild(App.Components.tagInput(
        '错因',
        App.Tags.getMergedErrorCauses(formData.module),
        formData.errorCause ? [formData.errorCause] : [],
        (val) => { formData.errorCause = val[0] || ''; },
        1,
        true,
        '选择或输入错因，回车添加',
        (v) => App.Tags.addModuleErrorCause(formData.module, v),
        { kind: 'ec', module: formData.module, onDone: () => buildForm() }
      ));

      // 挖坑点（简短文字，不需要格式，不参与筛选）
      form.appendChild(App.Components.formInput(
        '挖坑点',
        formData.pitfall,
        '一句话记录这道题的坑在哪（可选）',
        (val) => { formData.pitfall = val; },
        'input'
      ));

      // AI 智能拆分（题干 + 选项）
      const aiBtn = document.createElement('button');
      aiBtn.type = 'button';
      aiBtn.className = 'btn btn--outline btn--full';
      aiBtn.style.marginBottom = 'var(--spacing-md)';
      aiBtn.innerHTML = '🤖 AI 智能拆分题干与选项';
      aiBtn.addEventListener('click', () => this.openSmartSplit(formData, buildForm));
      form.appendChild(aiBtn);

      // 题目
      form.appendChild(App.Components.formInput(
        '题目',
        formData.question,
        '请输入完整题干',
        (val) => { formData.question = val; },
        'textarea',
        true
      ));

      // 选项
      const optionsGroup = document.createElement('div');
      optionsGroup.className = 'form-group';
      const optionsLabel = document.createElement('label');
      optionsLabel.className = 'form-label';
      optionsLabel.innerHTML = '选项<span class="required">*</span>';
      optionsGroup.appendChild(optionsLabel);

      ['A', 'B', 'C', 'D'].forEach((letter, idx) => {
        const input = document.createElement('input');
        input.className = 'form-input';
        input.style.marginBottom = '6px';
        input.placeholder = '选项 ' + letter;
        input.value = formData.options[idx] || '';
        input.addEventListener('input', () => {
          formData.options[idx] = input.value;
        });
        const wrapper = document.createElement('div');
        wrapper.style.display = 'flex';
        wrapper.style.alignItems = 'center';
        wrapper.style.gap = '8px';
        const letterSpan = document.createElement('span');
        letterSpan.style.cssText = 'font-weight:700;width:20px;flex-shrink:0;';
        letterSpan.textContent = letter;
        wrapper.appendChild(letterSpan);
        wrapper.appendChild(input);
        optionsGroup.appendChild(wrapper);
      });
      form.appendChild(optionsGroup);

      // 正确选项 + 错误选项
      const selectRow = document.createElement('div');
      selectRow.style.cssText = 'display:flex;gap:var(--spacing-md);';
      selectRow.appendChild(App.Components.formSelector(
        '正确选项',
        ['A', 'B', 'C', 'D'],
        formData.correctOption,
        (val) => { formData.correctOption = val; buildForm(); },
        true
      ));
      selectRow.appendChild(App.Components.formSelector(
        '你的选项',
        ['A', 'B', 'C', 'D'],
        formData.userOption,
        (val) => { formData.userOption = val; buildForm(); },
        false
      ));
      form.appendChild(selectRow);

      // 正确率
      form.appendChild(App.Components.formInput(
        '全站正确率（%）',
        formData.accuracy,
        '例如：65',
        (val) => { formData.accuracy = val; },
        'number',
        false
      ));

      // 题目来源
      form.appendChild(App.Components.formInput(
        '题目来源',
        formData.questionSource,
        '如：2023 国考真题 / 某机构模拟卷 / 日常练习',
        (val) => { formData.questionSource = val; },
        'text',
        false
      ));

      // 解析笔记
      const noteGroup = document.createElement('div');
      noteGroup.className = 'form-group';
      const noteLabel = document.createElement('label');
      noteLabel.className = 'form-label';
      noteLabel.textContent = '解析分析笔记';
      noteGroup.appendChild(noteLabel);

      const editor = App.Components.notionEditor(formData.analysisNote, false, function (content) {
        formData.analysisNote = content;
      });
      noteGroup.appendChild(editor.element);
      formData._getNote = editor.getContent;
      form.appendChild(noteGroup);

      // 错题笔记（个人复盘心得，区别于解析分析）
      const enoteGroup = document.createElement('div');
      enoteGroup.className = 'form-group';
      const enoteLabel = document.createElement('label');
      enoteLabel.className = 'form-label';
      enoteLabel.textContent = '错题笔记（个人复盘心得）';
      enoteGroup.appendChild(enoteLabel);

      const enoteEditor = App.Components.notionEditor(formData.note, false, function (content) {
        formData.note = content;
      });
      enoteGroup.appendChild(enoteEditor.element);
      formData._getENote = enoteEditor.getContent;
      form.appendChild(enoteGroup);

      container.appendChild(form);

      // 草稿自动暂存（localStorage 兜底）+ 触发 DB 自动保存
      App.Draft.autoSaveForm('error', formData._formId, container, function () {
        if (formData._getNote) { try { formData.analysisNote = formData._getNote(); } catch (e) {} }
        if (formData._getENote) { try { formData.note = formData._getENote(); } catch (e) {} }
        debouncedSaveToDB();
        return JSON.parse(JSON.stringify(formData));
      });
    };

    // 防抖自动保存到 DB
    let _errSaveTimer = null, _errSaving = false;
    function debouncedSaveToDB() {
      clearTimeout(_errSaveTimer);
      _errSaveTimer = setTimeout(async () => {
        if (_errSaving) return;
        // 必填项校验：科目、模块、考点、错因、题目
        if (!formData.subject || !formData.module || formData.knowledgePoints.length === 0 ||
            !formData.errorCause || !formData.question.trim()) return;
        _errSaving = true;
        try { await submitFormInternal(); } catch (e) {}
        _errSaving = false;
      }, 2000);
    }

    const submitFormInternal = async () => {
      if (formData._getNote) formData.analysisNote = formData._getNote();
      if (formData._getENote) formData.note = formData._getENote();
      App.Utils.rememberSelect.set('error', formData.subject, formData.module);

      const data = {
        subject: formData.subject, module: formData.module,
        knowledgePoints: formData.knowledgePoints, errorCause: formData.errorCause,
        pitfall: formData.pitfall || '',
        question: formData.question, options: formData.options.filter(o => o.trim()),
        correctOption: formData.correctOption, userOption: formData.userOption || '',
        accuracy: parseInt(formData.accuracy) || 0,
        analysisNote: formData.analysisNote || '', note: formData.note || '',
        questionSource: formData.questionSource || '',
        status: formData.status || '未掌握', sourceExamId: formData.sourceExamId || null,
      };
      if (isEdit && formData.id) {
        data.id = formData.id;
        const existing = await App.DB.get('errors', formData.id);
        data.reviewCount = existing ? existing.reviewCount || 0 : 0;
        data.lastReviewDate = new Date().toISOString();
        data.createdAt = existing ? existing.createdAt : new Date().toISOString();
        await App.DB.updateError(data);
      } else {
        if (!formData.id) { await App.DB.addError(data); formData.id = data.id; isEdit = true; }
        else { data.id = formData.id; await App.DB.updateError(data); }
      }
    };

    const submitForm = async () => {
      clearTimeout(_errSaveTimer);
      if (formData._getNote) formData.analysisNote = formData._getNote();
      if (formData._getENote) formData.note = formData._getENote();
      if (!formData.subject) { App.Components.toast('请选择科目', 'error'); return; }
      if (!formData.module) { App.Components.toast('请选择模块', 'error'); return; }
      if (formData.knowledgePoints.length === 0) { App.Components.toast('请选择考点', 'error'); return; }
      if (!formData.errorCause) { App.Components.toast('请选择错因', 'error'); return; }
      if (!formData.question.trim()) { App.Components.toast('请输入题目', 'error'); return; }
      if (!formData.correctOption) { App.Components.toast('请选择正确选项', 'error'); return; }
      try {
        await submitFormInternal();
        App.Components.toast('已自动保存 ✓', 'success');
        App.Draft.clearForm('error');
        App.Router.navigate('errors');
      } catch (e) { App.Components.toast('保存失败', 'error'); }
    };

    loadAndRender();
  }
};

// 错题本画廊：窗口尺寸变化时，自动模式下重新选择密度
(function galleryResizeAuto() {
  let resizeTimer = null;
  function update() {
    const page = App.Pages.Errors;
    if (!page || !page.state || !page.state.gallerySizeAuto) return;
    const w = window.innerWidth;
    const size = w < 600 ? 'sm' : (w < 1100 ? 'md' : 'lg');
    if (size !== page.state.gallerySize) {
      page.state.gallerySize = size;
      if (App.Router && App.Router.currentPage === 'errors' && page.refreshAll) {
        page.refreshAll();
      }
    }
  }
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(update, 250);
  });
})();
