name: KaogongReviewNative
options:
  bundleIdPrefix: com.baoger07122
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "9.5.3"
    CURRENT_PROJECT_VERSION: "40"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  KaogongReviewNative:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baoger07122.kaogongreview.nativebeta
        PRODUCT_NAME: KaogongReviewNative
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 考公复盘·原生
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
  SpeedAnimationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Animation
      - Sources/Features/Speed/SpeedAnimatedText.swift
    dependencies:
      - target: KaogongReviewNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/KaogongReviewNative.app/KaogongReviewNative"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SpeedInteractionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: KaogongReviewNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KaogongReviewNative
schemes:
  KaogongReviewNative:
    build:
      targets:
        KaogongReviewNative: all
        SpeedInteractionUITests: [test]
        SpeedAnimationTests: [test]
    test:
      targets:
        - SpeedInteractionUITests
        - SpeedAnimationTests
