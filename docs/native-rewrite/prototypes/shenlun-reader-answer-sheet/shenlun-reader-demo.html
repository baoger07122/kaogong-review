    openDetail(item);
    if (!onQuestions) return;
    const anchor = byID("pages").querySelector(`[data-paper-question="${CSS.escape(item.id)}"]`);
    const page = anchor?.closest(".paper-wrap");
    if (!page) return;
    const offset = Math.max(0, (anchor.getBoundingClientRect().top - page.getBoundingClientRect().top) / scaleForWidth() - 76);
    scrollToPage(page.dataset.pageId, offset);
  }

  function updatePageStatus() {
    activePage = Math.min(activePage, Math.max(0, rendered.length - 1));
    byID("page-label").textContent = rendered.length ? `${activePage + 1}/${rendered.length} 页` : "";
    byID("page-prev").disabled = !activePage;
    byID("page-next").disabled = activePage >= rendered.length - 1;
    const active = rendered[activePage];
    for (const tab of document.querySelectorAll(".material-tab")) {
      const tabPage = rendered.find((page) => page.id === tab.dataset.page);
      const selected = Boolean(tabPage && active && (tabPage.kind === "questions" ? active.kind === "questions" : tabPage.material === active.material));
      tab.setAttribute("aria-current", String(selected));
      if (selected) {
        const nav = byID("material-tabs");
        const bounds = nav.getBoundingClientRect();
        const item = tab.getBoundingClientRect();
        if (item.right > bounds.right + 1 || item.left < bounds.left - 1) {
          nav.scrollLeft += item.left - bounds.left - Math.max(0, (bounds.width - item.width) / 2);
        }
      }
    }
    const layerKey = active?.canvas ? scopeKey(active) : null;
    const pageChanged = lastToolPage !== active?.id;
    lastToolPage = active?.id;
    if (layerKey !== lastLayerGroup) {
      lastLayerGroup = layerKey;
      nameEdit = null;
      layerMenu = null;
      if (!layerKey) { layersOpen = false; paletteOpen = false; }
      updateTools();
    } else {
      updateInkActions(active);
      if (pageChanged && layersOpen && active?.canvas) paintLayerPreviews(active);
    }
  }

  function scopeKey(page) {
    return `${current.group}|${page.material}`;
  }

  function layersFor(page) {
    return model.layerGroups[scopeKey(page)] ??= {
      active: "base",
      list: page.material === 1 && [examplePaper, standaloneGroup].includes(current.group)
        ? [{ id: "base", name: "通读批注", visible: true }, { id: "review", name: "对照补记", visible: true }]
        : [{ id: "base", name: "批注", visible: true }]
    };
  }

  function inkKey(page, layer = "base") {
    const base = `${current.group}|${page.id}`;
    return layer === "base" ? base : `${base}|${layer}`;
  }

  function drawings(page, layer) {
    return model.drawings[inkKey(page, layer)] ?? [];
  }

  function writableLayer(page) {
    if (!page?.canvas || !toolbarVisible || !inkVisible) return null;
    const layers = layersFor(page);
    return layers.list.find((layer) => layer.visible && layer.id === layers.active);
  }

  function updateInkActions(page) {
    const layer = writableLayer(page);
    byID("undo").disabled = !layer || !page.undo.get(inkKey(page, layer.id))?.length;
    byID("clear-ink").disabled = !layer || !drawings(page, layer.id).length;
  }

  function updateTools() {
    const page = rendered[activePage];
    const canAnnotate = Boolean(page?.canvas);
    const group = canAnnotate ? layersFor(page) : null;
    const active = group?.list.find((item) => item.id === group.active);
    byID("doodle-scroll").hidden = !toolbarVisible;
    byID("tool-toggle").hidden = toolbarVisible;
    byID("tool-toggle").disabled = !canAnnotate;
    byID("layer-indicator").textContent = !canAnnotate || !toolbarVisible ? ""
      : !inkVisible ? "笔迹暂时隐藏" : active?.name ? `正在写入 · ${active.name}` : "请选择可见图层";
    byID("layers-toggle").disabled = !canAnnotate;
    byID("layers-toggle").setAttribute("aria-expanded", String(layersOpen && canAnnotate));
    byID("layers-panel").hidden = !layersOpen || !canAnnotate;
    byID("palette-panel").hidden = !paletteOpen || !toolbarVisible || !canAnnotate;
    byID("colors").setAttribute("aria-pressed", String(paletteOpen && toolbarVisible));
    byID("finger-draw").setAttribute("aria-pressed", String(fingerDrawing));
    byID("finger-draw").disabled = !canAnnotate;
    byID("colors").disabled = !canAnnotate;
    const toggleAction = inkVisible ? "隐藏全部笔迹" : "显示全部笔迹";
    byID("ink-toggle").setAttribute("aria-label", toggleAction);
    byID("ink-toggle").title = toggleAction;
    byID("ink-toggle").setAttribute("aria-pressed", String(inkVisible));
    for (const [attribute, key] of [["tool", "tool"], ["color", "color"], ["pen-width", "width"], ["eraser-width", "eraserWidth"]]) {
      for (const button of document.querySelectorAll(`[data-${attribute}]`)) {
        button.setAttribute("aria-pressed", String(button.getAttribute(`data-${attribute}`) === String(model.pencil[key])));
        if (attribute === "tool") button.disabled = !canAnnotate;
      }
    }
    updateInkActions(page);
    for (const value of rendered) {
      if (!value.canvas) continue;
      value.canvas.classList.toggle("hide-ink", !inkVisible);
      value.canvas.classList.toggle("read-ink", !writableLayer(value));
      value.canvas.classList.toggle("finger-ink", Boolean(fingerDrawing && writableLayer(value)));
    }
    if (layersOpen && canAnnotate) {
      popoverAt(byID("layers-toggle"), byID("layers-panel"));
      renderLayers(page);
    }
  }

  function renderLayers(page) {
    const layers = layersFor(page);
    byID("layer-name-form").hidden = !nameEdit;
    byID("layer-list").innerHTML = [...layers.list].reverse().map((layer) => {
      const active = layer.id === layers.active;
      const name = escape(layer.name);
      const more = layer.id === layerMenu;
      return `<li class="layer-line" data-current="${active}">
        <button class="layer-name" type="button" data-layer-select="${escape(layer.id)}" aria-pressed="${active}" title="${name}">
          <canvas class="layer-preview" data-thumb="${escape(layer.id)}" width="70" height="62" aria-hidden="true"></canvas><strong>${name}</strong></button>
        <button class="layer-eye" type="button" data-layer-visibility="${escape(layer.id)}" aria-pressed="${layer.visible}"
          aria-label="${layer.visible ? "隐藏" : "显示"} ${name}"><span class="eye-icon" aria-hidden="true"></span></button>
        <button class="mini-btn layer-more" type="button" data-layer-menu="${escape(layer.id)}" aria-expanded="${more}" aria-label="${name}的更多操作">···</button>
        ${more ? `<div class="layer-overflow"><button class="menu-item" type="button" data-layer-rename="${escape(layer.id)}">重命名</button></div>` : ""}
      </li>`;
    }).join("");
    paintLayerPreviews(page);
  }

  function paintLayerPreviews(page) {
    for (const thumbnail of byID("layer-list").querySelectorAll("[data-thumb]")) {
      const ctx = thumbnail.getContext("2d");
      ctx.clearRect(0, 0, thumbnail.width, thumbnail.height);
      const samples = drawings(page, thumbnail.dataset.thumb);
      if (!samples.length) continue;
      let x0=paperWidth, y0=paperHeight, x1=0, y1=0;
      for (const sample of samples) {
        for (const [x, y] of sample.points || [[sample.x, sample.y], [sample.x + 26, sample.y + 7]]) {
          x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
        }
      }
      if (x0 > x1 || y0 > y1) continue;
      const scale = Math.min(60 / Math.max(20, x1-x0), 48 / Math.max(20, y1-y0), 1.3);
      ctx.save();
      ctx.translate((thumbnail.width-(x1-x0)*scale)/2, (thumbnail.height-(y1-y0)*scale)/2);
      ctx.scale(scale, scale);
      ctx.translate(-x0, -y0);
      paintStrokes(ctx, samples);
      ctx.restore();
    }
  }

  function refreshLayerInk(page) {
    for (const value of rendered) {
      if (value.material === page.material && value.canvas?.width > 1) redraw(value);
    }
    updateTools();
  }

  function changeLayer(kind, id) {
    const page = rendered[activePage];
    if (!page?.canvas) return;
    const group = layersFor(page);
    const layer = group.list.find((item) => item.id === id);
    if (!layer) return;
    finishDrawing();
    layerMenu = null;
    if (kind === "select") {
      layer.visible = true;
      group.active = id;
    } else {
      layer.visible = !layer.visible;
      if (!layer.visible && group.active === id) group.active = group.list.findLast((item) => item.visible)?.id ?? null;
      if (layer.visible && !group.active) group.active = id;
    }
    save();
    refreshLayerInk(page);
  }

  function editLayerName(id) {
    const page = rendered[activePage];
    if (!page?.canvas) return;
    const group = layersFor(page);
    const layer = group.list.find((item) => item.id === id);
    layerMenu = null;
    nameEdit = { scope: scopeKey(page), id: layer?.id ?? null };
    byID("layer-name-label").textContent = layer ? "重命名图层" : "新建图层";
    const input = byID("layer-name-input");
    input.setCustomValidity("");
    input.value = layer?.name ?? "";
    input.placeholder = `图层 ${group.list.length + 1}`;
    renderLayers(page);
    input.focus();
    input.select();
  }

  function redraw(page) {
    if (page.canvas.width === 1) {
      page.canvas.width = paperWidth * backingScale;
      page.canvas.height = Math.ceil(paperHeight * backingScale);
    }
    const context = page.canvas.getContext("2d");
    context.setTransform(backingScale, 0, 0, backingScale, 0, 0);
    context.clearRect(0, 0, paperWidth, paperHeight);
    const samples = layersFor(page).list.filter((layer) => layer.visible).flatMap((layer) => drawings(page, layer.id));
    paintStrokes(context, samples);
  }

  function paintStrokes(context, samples) {
    for (const stroke of samples) {
      if (stroke.kind === "note") {
        context.save();
        context.translate(stroke.x, stroke.y);
        context.rotate(-.13);
        context.fillStyle = stroke.color;
        context.font = '13px "KaiTi", "Microsoft YaHei", sans-serif';
        context.fillText(stroke.text, 0, 0);
        context.restore();
      } else if (stroke.points?.length) {
        const [first, ...remaining] = stroke.points;
        context.globalAlpha = stroke.kind === "highlight" ? .43 : .96;
        context.lineWidth = stroke.width;
        context.strokeStyle = stroke.color;
        context.lineCap = "round";
        context.lineJoin = "round";
        context.beginPath();
        context.moveTo(first[0], first[1]);
        if (!remaining.length) context.lineTo(first[0] + .1, first[1] + .1);
        for (const point of remaining) context.lineTo(point[0], point[1]);
        context.stroke();
        context.globalAlpha = 1;
      }
    }
  }

  function textRects(page, needle) {
    const paragraph = [...page.paper.querySelectorAll("p")].find((node) => node.textContent.includes(needle));
    if (!paragraph) return [];
    const from = paragraph.textContent.indexOf(needle);
    const to = from + needle.length;
    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);
    const range = document.createRange();
    let i = 0, node, first = false;
    while ((node = walker.nextNode())) {
      const length = node.textContent.length;
      if (!first && from < i + length) { range.setStart(node, from - i); first = true; }
      if (first && to <= i + length) { range.setEnd(node, to - i); break; }
      i += length;
    }
    const base = page.paper.getBoundingClientRect();
    const scale = base.width / paperWidth;
    const lines = [];
    for (const rect of range.getClientRects()) {
      const item = { x: (rect.left - base.left) / scale, y: (rect.top - base.top) / scale, w: rect.width / scale, h: rect.height / scale };
      const sameLine = lines.find((line) => Math.abs(item.y - line.y) < 3);
      if (sameLine) {
        sameLine.w = Math.max(sameLine.x + sameLine.w, item.x + item.w) - Math.min(sameLine.x, item.x);
        sameLine.x = Math.min(sameLine.x, item.x);
        sameLine.h = Math.max(sameLine.h, item.h);
      } else lines.push(item);
    }
    return lines;
  }

  function seedDemonstration(page) {
    const base = inkKey(page);
    const review = inkKey(page, "review");
    if (!page.paper.getBoundingClientRect().width || (Object.hasOwn(model.drawings, base) && Object.hasOwn(model.drawings, review))) return;
    const values = [];
    const reviewMarks = [];
    const color = "#252525";
    const red = "#bb3d38";
    function mark(phrase, kind, strokes = values, strokeColor = color) {
      return textRects(page, phrase).map((rect) => {
        let points;
        if (kind === "circle") {
          points = Array.from({ length: 31 }, (_, index) => {
            const angle = index / 30 * Math.PI * 2;
            const t = Math.sin(index * .82) * .8;
            return [rect.x + rect.w / 2 + (rect.w / 2 + 5 + t) * Math.cos(angle), rect.y + rect.h / 2 + (rect.h / 2 + 2 + t) * Math.sin(angle)];
          });
        } else {
          const y = rect.y + rect.h * 1.02;
          points = Array.from({ length: 17 }, (_, index) => [rect.x + rect.w * index / 16, y + Math.sin(index * 1.7) * .6]);
        }
        strokes.push({ kind: "pen", width: 1.55, points, color: strokeColor });
        return rect;
      });
    }
    mark("整合物流资源", "circle");
    mark("提供全流程铁路运输服务", "underline");
    mark("新建了8条园区铁路专用线", "underline");
    const cost = mark("均下调约50%", "circle");
    mark("扩建铁路线路、增加班次", "underline");
    const capacity = mark("升级改造装卸设备", "circle", reviewMarks, red);
    mark("“物流总包”协议", "underline", reviewMarks, red);
    if (cost[0]) values.push({ kind: "note", x: 551, y: cost[0].y + 8, text: "降成本", color });
    if (capacity[0]) reviewMarks.push({ kind: "note", x: 550, y: capacity[0].y + 9, text: "扩能", color: red });
    model.drawings[base] ??= values;
    model.drawings[review] ??= reviewMarks;
  }

  function pushUndo(page, key, previous) {
    const history = page.undo.get(key) ?? [];
    history.push(previous);
    page.undo.set(key, history);
  }

  function finishDrawing() {
    if (!workingStroke) return;
    const { page, key, previous, pointer } = workingStroke;
    workingStroke = null;
    if (page.canvas.hasPointerCapture(pointer)) page.canvas.releasePointerCapture(pointer);
    if (model.drawings[key] !== previous) {
      pushUndo(page, key, previous);
      save();
    }
  }

  function eraseAt(session, position) {
    let changed = false;
    const visible = model.drawings[session.key] ?? [];
    const remaining = [];
    const radius = model.pencil.eraserWidth / 2;
    for (const stroke of visible) {
      if (!stroke.points?.some(([x, y]) => Math.hypot(x - position[0], y - position[1]) <= radius)) {
        remaining.push(stroke);
        continue;
      }
      changed = true;
      let section = [];
      for (const point of stroke.points) {
        if (Math.hypot(point[0] - position[0], point[1] - position[1]) > radius) section.push(point);
        else if (section.length) {
          remaining.push({ ...stroke, points: section });
          section = [];
        }
      }
      if (section.length) remaining.push({ ...stroke, points: section });
    }
    if (changed) model.drawings[session.key] = remaining;
  }

  function drawAt(session, point) {
    const stroke = session.stroke;
    const last = stroke.points.at(-1);
    const steps = Math.max(1, Math.ceil(Math.hypot(point[0] - last[0], point[1] - last[1]) / 4));
    for (let step = 1; step <= steps; step++) {
      const fraction = step / steps;
      stroke.points.push([last[0] + fraction * (point[0] - last[0]), last[1] + fraction * (point[1] - last[1])]);
    }
  }

  function editCurrentInk(action) {
    finishDrawing();
    const page = rendered[activePage];
    const layer = writableLayer(page);
    if (!layer) return;
    const key = inkKey(page, layer.id);
    if (action === "clear") {
      pushUndo(page, key, drawings(page, layer.id));
      model.drawings[key] = [];
    } else {
      const undone = page.undo.get(key)?.pop();
      if (!undone) return;
      model.drawings[key] = undone;
    }
    redraw(page);
    save();
    updateTools();
  }

  function wireCanvas(page) {
    const point = (event) => {
      const rect = page.canvas.getBoundingClientRect();
      return [(event.clientX - rect.left) * paperWidth / rect.width, (event.clientY - rect.top) * paperHeight / rect.height];
    };
    page.canvas.addEventListener("pointerdown", (event) => {
      const layer = writableLayer(page);
      if (!layer || workingStroke || (event.pointerType === "touch" && !fingerDrawing) || event.button !== 0) return;
      activePage = rendered.indexOf(page);
      updatePageStatus();
      const position = point(event);
      const key = inkKey(page, layer.id);
      const previous = model.drawings[key] ?? [];
      event.preventDefault();
      page.canvas.setPointerCapture(event.pointerId);
      const erasing = model.pencil.tool === "erase";
      const stroke = erasing ? null : { kind: "pen", color: model.pencil.color, width: model.pencil.width, points: [position] };
      workingStroke = { page, key, previous, pointer: event.pointerId, stroke };
      if (erasing) {
        model.drawings[key] ??= previous;
        eraseAt(workingStroke, position);
      } else {
        model.drawings[key] = [...previous, stroke];
      }
      redraw(page);
    });
    page.canvas.addEventListener("pointermove", (event) => {
      if (workingStroke?.page !== page || workingStroke.pointer !== event.pointerId) return;
      if (workingStroke.stroke) drawAt(workingStroke, point(event));
      else eraseAt(workingStroke, point(event));
      redraw(page);
    });
    for (const action of ["pointerup", "pointercancel", "lostpointercapture"]) {
      page.canvas.addEventListener(action, (event) => {
        if (workingStroke?.page !== page || workingStroke.pointer !== event.pointerId) return;
        finishDrawing();
        updateTools();
      });
    }
  }

  const countAnswer = (answer) => [...(answer || "").replace(/\s/g, "")].length;

  function anchorButton(id, label) {
    const page = rendered.find((entry) => entry.id === id);
    if (!page) return "";
    const name = label || (page.kind === "questions" ? "作答要求" : `材料 ${page.material} · 第 ${rendered.indexOf(page) + 1} 页`);
    return `<button class="anchor" type="button" data-anchor="${escape(id)}">${escape(name)} ↗</button>`;
  }

  function renderQuestionNavigation() {
    const items = questionsIn(current.group);
    const index = items.indexOf(current);
    const count = byID("question-count");
    byID("question-pager").hidden = items.length < 2;
    count.textContent = `${index + 1}/${items.length}`;
    count.setAttribute("aria-label", `第 ${index + 1} 题，共 ${items.length} 题，选择题目`);
    byID("question-prev").disabled = index <= 0;
    byID("question-next").disabled = index >= items.length - 1;
    byID("question-chooser").innerHTML = items.map((item, position) =>
      `<button class="menu-item" type="button" data-question="${escape(item.id)}" aria-current="${String(item === current)}">第 ${position + 1} 题</button>`).join("");
  }

  const answerColumns = 25;
  const answerPageSize = answerColumns * 24;
  const glyphs = typeof Intl.Segmenter === "function" ? new Intl.Segmenter("zh", { granularity: "grapheme" }) : null;

  function answerPositions(text, limit) {
    const cells = [];
    let columnPosition = 0;
    let used = 0;
    const lines = text.replace(/\r\n?/g, "\n").split("\n");
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const entries = glyphs ? [...glyphs.segment(line)].map(({segment}) => segment) : Array.from(line);
      for (const letter of entries) {
        if (columnPosition < limit) cells[columnPosition] = /^\s$/u.test(letter) ? "" : letter;
        columnPosition++;
        used = columnPosition;
      }
      if (i < lines.length - 1) {
        const isPartial = columnPosition % answerColumns;
        columnPosition += isPartial ? answerColumns - isPartial : !entries.length ? answerColumns : 0;
      }
    }
    return { cells, used };
  }

  function answerSheets(limit, minimum) {
    const template = [];
    const sheets = Math.ceil(limit / answerPageSize);
    for (let index = 0; index < sheets; index++) {
      const start = index * answerPageSize + 1;
      const end = Math.min(start + answerPageSize - 1, limit);
      const rows = [];
      for (let row = start; row <= end; row += answerColumns) {
        const marks = [];
        const cells = [];
        for (let i = row; i <= Math.min(row + answerColumns - 1, end); i++) {
          const marker = i === limit || i === minimum || i % 100 === 0;
          cells.push(`<span class="answer-cell" aria-hidden="true"${marker ? " data-marker" : ""}></span>`);
          if (marker) marks.push({ i, pos: (i - row + 1) * 4 });
        }
        const labels = marks.map((mark, i) => {
          if (marks[i + 1]?.pos - mark.pos < 11) return "";
          const text = i && mark.pos - marks[i-1].pos < 11 ? `${marks[i-1].i} / ${mark.i}` : mark.i;
          return `<small class="sheet-mark" style="left:${mark.pos}%" aria-hidden="true">${text}</small>`;
        });
        rows.push(`<div class="sheet-row">${cells.join("")}${labels.join("")}</div>`);
      }
      template.push(`<section class="sheet-grid" data-sheet-size="${end - start + 1}" aria-label="第 ${index + 1} 张答题纸，${end - start + 1} 格">
        ${sheets > 1 ? `<div class="sheet-page-number">${index + 1}/${sheets} 张</div>` : ""}
        <div class="sheet-rows">${rows.join("")}</div></section>`);
    }
    return template.join("");
  }

  function updateAnswerSheet() {
    const output = byID("answer-count");
    const help = byID("sheet-help");
    if (!output) return;
    const cap = current.limit;
    const layout = cap ? answerPositions(current.answer, cap) : { used: countAnswer(current.answer) };
    output.textContent = cap ? `${layout.used}/${cap} 格` : `${layout.used} 字`;
    output.dataset.over = String(Boolean(cap && layout.used > cap));
    if (help) help.textContent = cap
      ? layout.used > cap ? `超出 ${layout.used - cap} 格，原文未截断。` : ""
      : "未设字数上限";
    if (!cap) return;
    for (let i = 0; i < answerCellNodes.length; i++) {
      const value = layout.cells[i] ?? "";
      if (answerCellNodes[i].textContent !== value) answerCellNodes[i].textContent = value;
    }
  }

  function updateComposer(focus = false) {
    const open = activePhase === "work" && (composerOpen || !current.limit);
    const input = byID("answer-input");
    byID("answer-composer").hidden = !open;
    byID("close-composer").hidden = !current.limit;
    if (open && input.value !== current.answer) input.value = current.answer;
    if (open && focus) input.focus({ preventScroll: true });
  }

  function startTyping() {
    if (activePhase !== "work") return;
    composerOpen = true;
    updateComposer(true);
  }

  function syncAnswer(input) {
    if (!current || route !== "detail" || activePhase !== "work") return;
    if (current.answer !== input.value) {
      invalidateAnalysis(current);
      current.answer = input.value;
      save();
    }
    updateAnswerSheet();
    const finish = byID("finish-answer");
    if (finish) finish.disabled = !current.answer.trim();
  }

  function workPanels() {
    const doubts = current.doubts;
    return `<section class="answer-sheets" aria-label="我的作答纸">
        <div class="sheet-card" data-has-limit="${Boolean(current.limit)}">
          <div class="sheet-head">
            <button class="mini-btn" data-command="type-answer" type="button"><span class="doodle-glyph" aria-hidden="true">&#xE765;</span>键入</button>
            <output class="sheet-count" id="answer-count"></output>
          </div>
          <p id="sheet-help" class="sheet-help" role="status"></p>
          ${current.limit ? `<div class="sheet-grids" data-answer-sheet>${answerSheets(current.limit, current.minimum)}</div>` : ""}
        </div>
      </section>
      ${doubts.length ? `<details class="work-doubts"><summary>疑惑 ${doubts.length}</summary>
        <ol class="doubt-list">${doubts.map((item, index) => `<li><div class="doubt-body"><span class="doubt-number">${index + 1}</span><div><p>${escape(item.text)}</p>${anchorButton(item.page)}</div></div></li>`).join("")}</ol>
      </details>` : ""}`;
  }

  function comparePanels() {
    return `
      <div class="panel">
        <div class="panel-head"><h3>我的作答</h3><button class="mini-btn" type="button" data-command="edit-answer">编辑</button></div>
        <p class="read-answer">${escape(current.answer)}</p>
      </div>
      <div class="panel reference-text">
        <div class="panel-head"><h3><label for="reference-input">参考答案</label></h3>
          ${current.reference === exampleReference ? '<span class="minor">演示内容</span>'
            : supportsReviewExample(current) && !current.reference ? '<button class="mini-btn" type="button" data-command="use-example-reference">填入演示参考</button>' : ""}
        </div>
        <textarea id="reference-input" class="answer-input" placeholder="粘贴参考答案原文">${escape(current.reference)}</textarea>
      </div>`;
  }

  const isPendingDoubt = (item) => !item.reply?.trim() && !item.deferred;
  const draftReplies = (item) => item.doubts.filter((doubt) => doubt.draft && isPendingDoubt(doubt));
  const supportsReviewExample = (item) => item.stem === examples[0].stem && item.answer === exampleAnswer;

  function analysisBlock(item, mode) {
    if (!item.answer?.trim() || !item.reference?.trim()) return "先在「对照答案」补齐我的作答和参考答案";
    if (paperFor(item) && !Array.isArray(item.materialRefs)) return "先确认本题关联材料";
    if (mode === "score" && item.doubts.some(isPendingDoubt)) return "先完成答疑，或把未解决的问题标为待验证";
    return "";
  }

  function doubtPanels() {
    const list = current.doubts;
    const block = list.some(isPendingDoubt) ? analysisBlock(current, "doubt") : "";
    return `
      <div class="panel">
        <div class="panel-head tight"><h3>疑惑清单</h3><button class="mini-btn" type="button" data-command="add-doubt">＋ 记一条</button></div>
        <p class="minor">${list.length ? `已答 ${list.filter((item) => item.reply?.trim()).length} / ${list.length}${draftReplies(current).length ? ` · ${draftReplies(current).length} 条待确认` : ""}` : "暂无记录的疑惑"}</p>
        ${block ? `<p class="notice below">${block}</p>` : ""}
      </div>
      ${list.map((item, index) => {
        const draft = isPendingDoubt(item) ? item.draft : null;
        const evidence = draft?.page ?? item.evidence;
        const state = draft ? "待确认" : item.reply?.trim() ? "已答" : item.deferred ? "待验证" : "待答";
        return `<div class="panel${draft ? " ai-draft" : ""}">
          <div class="panel-head"><div class="doubt-body"><span class="doubt-number">${index + 1}</span><strong>${escape(item.text)}</strong></div>
            <span class="minor" data-reply-state="${escape(item.id)}">${state}</span></div>
          ${anchorButton(item.page)}
          <label class="minor" for="reply-${escape(item.id)}">${draft ? "AI 答复草稿" : "答疑"}</label>
          <textarea ${draft ? "data-draft-reply" : "data-reply"}="${escape(item.id)}" id="reply-${escape(item.id)}" placeholder="记录结论与材料依据">${escape(draft?.text ?? item.reply ?? "")}</textarea>
          ${evidence ? anchorButton(evidence, "查看材料依据") : ""}
          <button class="mini-btn" type="button" data-defer="${escape(item.id)}">${item.deferred ? "取消待验证" : "留待验证"}</button>
        </div>`;
      }).join("")}`;
  }

  function scorePanels() {
    const block = analysisBlock(current, "score");
    const draft = current.scoreDraft;
    const values = draft ?? current.scorePending ?? { value: current.score, reason: current.scoreReason };
    return `
      <div class="panel${draft ? " ai-draft" : ""}">
        <div class="panel-head"><h3>${draft ? "AI 评分草稿" : "评分"}</h3>${draft ? '<span class="review-tag">待确认</span>' : ""}</div>
        ${block ? `<p class="notice">${block}</p>` : ""}
        ${current.status === "revise" ? '<p class="notice">答案已有修改，旧评分待复核。</p>' : ""}
        <div class="score-check"><label for="score-input" class="summary">${draft ? "建议得分" : "得分"}</label><input id="score-input" class="score-input" type="number" min="0" ${current.full ? `max="${current.full}"` : ""} step="any" value="${escape(values.value ?? "")}" ${current.full ? "" : "disabled"}>${current.full ? `<span class="minor">/ ${current.full} 分</span>` : '<span class="minor">文字评估</span>'}</div>
        <label for="score-reason" class="minor">评分依据与扣分点</label>
        <textarea id="score-reason" class="below" placeholder="记录得分依据或待核实项">${escape(values.reason || "")}</textarea>
        ${(draft?.points ?? current.savedPoints)?.length ? `<ul class="evidence-list">${(draft?.points ?? current.savedPoints).map((entry) =>
          `<li><div class="row"><strong>${escape(entry.title)}</strong><span class="minor">${escape(entry.points)}</span></div>
            <p class="minor">${escape(entry.text)}</p>${anchorButton(entry.page)}</li>`
        ).join("")}</ul>` : ""}
      </div>
      <div class="panel">
        <div class="panel-head"><h3><label for="analysis-input">分析笔记</label></h3></div>
        <textarea id="analysis-input" class="answer-input" placeholder="记录考点、错因、下次可验证的规则">${escape(current.analysis || "")}</textarea>
      </div>`;
  }

  function renderWorkspace() {
    renderQuestionNavigation();
    const isWork = activePhase === "work";
    byID("workspace-title").textContent = isWork ? "答题纸" : "复盘";
    const stages = isWork ? [] : [["compare", "对照答案"], ["doubt", "逐条答疑"], ["score", "评分与分析"]];
    byID("workspace-tabs").hidden = isWork;
    byID("workspace-tabs").innerHTML = stages.map(([state, label]) => `<button class="section-tab" data-review-panel="${state}" aria-current="${String(activePanel === state)}" type="button">${label}</button>`).join("");
    byID("workspace-content").innerHTML = isWork ? workPanels() : { compare: comparePanels, doubt: doubtPanels, score: scorePanels }[activePanel]();
    answerCellNodes = [...byID("workspace-content").querySelectorAll(".answer-cell")];
    updateAnswerSheet();
    updateComposer();
    renderFooter();
    byID("workspace-content").scrollTop = workspaceScroll;
  }

  function renderFooter() {
    const footer = byID("footer-actions");
    if (activePhase === "work") {
      footer.innerHTML = `<button class="soft" data-command="add-doubt" type="button">记疑惑</button>
        <button id="finish-answer" class="primary" data-command="finish" type="button" ${current.answer.trim() ? "" : "disabled"}>完成作答</button>`;
      return;
    }
    const job = analysisJobs.get(current.id);
    const message = job ? `正在为${current.number}${job.mode === "doubt" ? "答疑" : "评分"}…`
      : analysisMessages.get(current.id) || requestScope();
    const status = `<span id="work-message" class="ai-status" role="status" data-busy="${Boolean(job)}">${escape(message)}</span>`;
    if (job) {
      footer.innerHTML = status + '<button class="soft" data-command="cancel-analysis" type="button">取消请求</button>';
      return;
    }
    if (activePanel === "compare") {
      footer.innerHTML = status + '<button class="primary" data-review-panel="doubt" type="button">进入逐条答疑</button>';
      return;
    }
    if (activePanel === "doubt") {
      const hasDraft = draftReplies(current).some((item) => item.draft.text.trim());
      const action = hasDraft ? ["confirm-doubts", "确认答疑"] : ["request-doubts", "发起答疑"];
      const button = current.doubts.some(isPendingDoubt)
        ? `<button class="primary" data-command="${action[0]}" type="button">${action[1]}</button>`
        : '<button class="primary" data-review-panel="score" type="button">进入评分与分析</button>';
      footer.innerHTML = status + button;
      return;
    }
    const editable = current.scoreDraft || current.scorePending;
    const request = `<button class="${editable ? "soft" : "primary"}" data-command="request-score" type="button">${current.scoreDraft || current.status === "score" ? "重新评分" : "发起评分"}</button>`;
    const confirm = editable ? '<button class="primary" data-command="save-score" type="button">保存评分</button>' : "";
    footer.innerHTML = status + request + confirm;
  }

  function report(text, item = current) {
    analysisMessages.set(item.id, text);
    if (route === "detail" && current === item && activePhase === "review") renderFooter();
  }

  function analysisPages(item) {
    const pages = chapters(item.group);
    return paperFor(item) ? pages.filter((page) => item.materialRefs?.includes(page.material)) : pages;
  }

  function requestScope() {
    if (activePanel === "compare" || analysisBlock(current, activePanel)) return "";
    if (activePanel === "doubt" && !current.doubts.some(isPendingDoubt)) return "";
    const materials = [...new Set(analysisPages(current).map((page) => page.material))];
    const scope = materials.map((number) => `材料 ${number}`).join("、");
    return scope ? `使用本题两份答案与${scope}` : "使用本题题干和两份答案";
  }

  function analysisSignature(item) {
    return JSON.stringify([
      item.kind, item.stem, item.requirement, item.full, item.limit, item.minimum, item.answer, item.reference,
      analysisPages(item).map((page) => page.id),
      item.doubts.map((entry) => [entry.id, entry.text, entry.page, entry.deferred, entry.reply])
    ]);
  }

  function demoReplies(item) {
    const replies = [
      { text: "修建专用线解决铁路接入，协调降费解决运输成本。题干要求说明如何优化，可放在同一个大点下并列两项措施。", page: "m1-1" },
      { text: "总包是整合资源的服务方式，一条龙服务是其具体内容。先写实行物流总包，再写运输方案、交通衔接和全程盯控等服务。", page: "m1-2" }
    ];
    for (const doubt of item.doubts.filter(isPendingDoubt)) {
      const index = examples[0].doubts.findIndex((sample) => sample.text === doubt.text);
      if (index >= 0) doubt.draft = { ...replies[index] };
    }
    return draftReplies(item).length;
  }

  function demoScore() {
    return {
      value: 7,
      reason: "覆盖专用线建设、调度扩能和物流总包。降费写得较概括，遗漏了一条龙服务的环节和全程盯控。",
      points: [
        { title: "专用线与降费", points: "部分覆盖", text: "已提到建线与降费，可补上协调港口、铁路和园区费用。", page: "m1-1" },
        { title: "扩大运力", points: "已覆盖", text: "写到了扩线、增班和设备升级。", page: "m1-1" },
        { title: "物流总包与全程服务", points: "部分覆盖", text: "已提到整合资源与总包，缺少运输方案、交通衔接和全程盯控。", page: "m1-2" }
      ]
    };
  }

  function startAnalysis(mode) {
    const item = current;
    if (analysisJobs.has(item.id)) return;
    const blocked = analysisBlock(item, mode);
    if (blocked) return report(blocked);
    if (mode === "doubt" && !item.doubts.some(isPendingDoubt)) return;
    const signature = analysisSignature(item);
    const job = { mode, timer: null };
    analysisJobs.set(item.id, job);
    renderFooter();
    job.timer = setTimeout(() => {
      if (analysisJobs.get(item.id) !== job) return;
      analysisJobs.delete(item.id);
      if (analysisSignature(item) !== signature) return report("本题内容已更新，请重新发起", item);
      const approvedDemo = supportsReviewExample(item) && item.reference === exampleReference
        && analysisPages(item).some((page) => page.id === "m1-2");
      if (!approvedDemo) return report("原型使用铁路物流题演示生成结果", item);
      if (mode === "doubt") {
        const count = demoReplies(item);
        analysisMessages.set(item.id, count ? `${count} 条答复待确认` : "样例答复已查看，可手动记录新增疑惑");
      } else {
        item.scoreDraft = demoScore();
        analysisMessages.set(item.id, "评分草稿待确认");
      }
      save();
      if (route === "detail" && current === item && activePhase === "review") renderWorkspace();
    }, 860);
  }

  function invalidateAnalysis(item) {
    invalidateScore(item);
    for (const doubt of item.doubts) delete doubt.draft;
  }

  function invalidateScore(item) {
    if (item.status === "score") item.status = "revise";
    delete item.scoreDraft;
    delete item.scorePending;
  }

  function confirmDoubts() {
    invalidateScore(current);
    for (const doubt of draftReplies(current)) {
      if (!doubt.draft.text.trim()) continue;
      doubt.reply = doubt.draft.text;
      doubt.evidence = doubt.draft.page;
      delete doubt.draft;
    }
    analysisMessages.set(current.id, "答疑已保存");
    save();
    renderWorkspace();
  }

  function confirmScore() {
    const blocked = analysisBlock(current, "score");
    if (blocked) return report(blocked);
    const input = byID("score-input");
    const reason = byID("score-reason").value;
    if (current.full && (!input.value || !input.reportValidity())) return report("请输入满分范围内的得分");
    if (!reason.trim()) return report("请补充评分依据");
    current.score = current.full ? Number(input.value) : null;
    current.scoreReason = reason;
    if (current.scoreDraft?.points) current.savedPoints = current.scoreDraft.points;
    delete current.scoreDraft;
    delete current.scorePending;
    current.status = "score";
    analysisMessages.set(current.id, "评分已保存");
    save();
    renderWorkspace();
  }

  function openQuestionForm(mode) {
    newMode = mode;
    const fromDetail = route === "detail";
    if (fromDetail) {
      finishDrawing();
      rememberReading();
    }
    const existing = mode === "edit" ? current : null;
    const group = fromDetail ? current.group : null;
    const paper = group ? model.papers[group] : null;
    entry = { fromDetail, group, paper, existing, refs: existing?.materialRefs?.slice() ?? null, staged: [] };
    route = "entry";
    setDetailHeader(false);
    layersOpen = false;
    paletteOpen = false;
    for (const id of ["library", "settings", "detail", "dock", "bar-name", "back", "detail-name", "new"]) byID(id).hidden = true;
    for (const id of ["question-entry", "entry-name", "entry-save", "entry-cancel"]) byID(id).hidden = false;
    const form = byID("new-form");
    form.reset();
    form.elements.stem.setCustomValidity("");
    form.elements.paperTitle.setCustomValidity("");
    form.elements.minimum.setCustomValidity("");
    const title = { single: "录入单题", paper: "新建套卷", append: "录入套卷题目", edit: "编辑题目" }[mode];
    byID("new-title").textContent = title;
    byID("entry-context").textContent = paper ? `${paper.title} · ${existing?.number || `第 ${questionsIn(group).length + 1} 题`}` : "";
    byID("entry-context").hidden = !paper;
    byID("entry-save").textContent = mode === "paper" ? "保存套卷" : "保存题目";
    byID("entry-save").disabled = false;
    byID("paper-title-field").hidden = mode !== "paper";
    form.elements.paperTitle.required = mode === "paper";
    form.elements.number.placeholder = mode === "append" ? `第 ${questionsIn(group).length + 1} 题` : "第 1 题";
    if (existing) {
      for (const field of ["source", "number", "kind", "stem", "requirement", "full", "limit", "minimum"]) {
        form.elements[field].value = existing[field] ?? "";
      }
    }
    byID("entry-reference").open = false;
    byID("entry-reference").hidden = Boolean(existing);
    byID("entry-reference-sealed").hidden = !existing;
    byID("entry-reference-sealed").querySelector(".minor").textContent = existing?.reference
      ? existing.status === "work" ? "已封存 · 作答完成后显示" : "已录入 · 可在对照答案查看"
      : "可在作答后补录";
    byID("entry-refs").hidden = !paper;
    byID("entry-feedback").textContent = "";
    byID("question-entry").scrollTop = 0;
    renderEntryMaterials();
  }

  function hideQuestionEntry() {
    for (const id of ["question-entry", "entry-name", "entry-save", "entry-cancel"]) byID(id).hidden = true;
  }

  function closeQuestionEntry() {
    const target = entry;
    entry = null;
    hideQuestionEntry();
    if (!target?.fromDetail) return selectDock("library");
    route = "detail";
    for (const id of ["detail", "detail-name", "back"]) byID(id).hidden = false;
    setDetailHeader(true);
    applySize();
    restoreReading(current);
    renderWorkspace();
    updateTools();
  }

  function renderEntryMaterials() {
    const existing = entry.group ? chapters(entry.group) : [];
    const selected = existing.filter((page) => !page.continues && (!entry.paper || entry.refs?.includes(page.material)));
    const total = selected.length + entry.staged.length;
    const existingRows = selected.map((page) => `<div class="entry-material">
      <div class="row"><strong>材料 ${page.material}</strong><span class="minor">${existing.filter((value) => value.material === page.material).length} 页</span></div>
      <p class="minor">${escape(page.paragraphs[0] || "")}</p></div>`);
    const stagedRows = entry.staged.map((pages, index) => `<div class="entry-material">
      <div class="row"><strong>材料 ${pages[0].material} <span class="minor">· ${pages.length} 页</span></strong>
        <button class="mini-btn" type="button" data-remove-staged="${index}">移除</button></div>
      <p class="minor">${escape(pages[0].paragraphs[0] || "")}</p></div>`);
    byID("entry-material-list").innerHTML = total ? [...existingRows, ...stagedRows].join("")
      : `<p class="entry-hint">${entry.paper && Array.isArray(entry.refs) ? "当前题目无关联材料。" : "材料选填，可在保存后补录。"}</p>`;
    byID("entry-material-count").textContent = total ? `${total} 份` : "";
  }

  function openMaterialReferences() {
    if (route !== "entry" || !entry?.paper) return;
    const sources = chapters(entry.group);
    const selected = entry.refs;
    const firstPages = sources.filter((page) => !page.continues);
    byID("material-ref-choices").innerHTML = firstPages.length
      ? firstPages.map((page) => `<label><input type="checkbox" name="materials" value="${page.material}"
          ${selected?.includes(page.material) ? "checked" : ""}> 材料 ${page.material}</label>`).join("")
      : '<p class="minor">套卷暂无材料，可先保存为无需材料。</p>';
    byID("material-ref-dialog").showModal();
  }

  docScroll.addEventListener("scroll", () => {
    if (scrollFrame) return;
    scrollFrame = requestAnimationFrame(() => {
      scrollFrame = 0;
      if (route !== "detail" || !rendered.length) return;
      const position = docScroll.scrollTop + 42;
      activePage = Math.max(0, rendered.findLastIndex((page) => page.shell.offsetTop <= position));
      updatePageStatus();
      rememberReading();
    });
  }, { passive: true });
  window.addEventListener("resize", () => {
    applySize();
    if (!byID("detail-edit-menu").hidden) popoverAt(byID("detail-more"), byID("detail-edit-menu"));
    if (!byID("layers-panel").hidden) popoverAt(byID("layers-toggle"), byID("layers-panel"));
  }, { passive: true });
  byID("workspace-content").addEventListener("scroll", (event) => { workspaceScroll = event.target.scrollTop; }, { passive: true });
  byID("review-toggle").addEventListener("change", (event) => {
    model.showReview = event.target.checked;
    byID("dock-review").hidden = !model.showReview;
    save();
  });

  function dismissLayers(restoreFocus = false) {
    layersOpen = false;
    nameEdit = null;
    layerMenu = null;
    updateTools();
    if (restoreFocus) byID("layers-toggle").focus();
  }

  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || route !== "detail" || document.querySelector("dialog[open]")) return;
    if (layersOpen) dismissLayers(true);
    else if (paletteOpen) { paletteOpen = false; updateTools(); byID("colors").focus(); }
    else if (!byID("detail-edit-menu").hidden) { closeEditMenu(); byID("detail-more").focus(); }
    else if (!byID("question-chooser").hidden) { closeQuestionChooser(); byID("question-count").focus(); }
    else if (composerOpen && current.limit) { composerOpen = false; updateComposer(); }
    else return;
    event.preventDefault();
  });

  document.addEventListener("click", (event) => {
    const hit = event.target;
    const button = hit.closest("button");
    if (route === "detail") {
      if (layersOpen && !hit.closest("#layers-panel, #layers-toggle")) dismissLayers();
      if (paletteOpen && !hit.closest("#palette-panel, #colors")) { paletteOpen = false; updateTools(); }
      if (!hit.closest("#detail-edit-menu, #detail-more")) closeEditMenu();
      if (!hit.closest("#question-pager")) closeQuestionChooser();
      if (!button && hit.closest("[data-answer-sheet]")) return startTyping();
    }
    if (!button || button.disabled) return;
    const { close, dock, mode, kind, id, paper, question, page, tool, color, anchor, reviewPanel, command, defer: deferID } = button.dataset;
    const { penWidth, eraserWidth, layerSelect, layerVisibility, layerMenu: requestedLayerMenu, layerRename, entryAsset, removeStaged } = button.dataset;
    if (close) return byID(close).close();
    if (dock) return selectDock(dock);
    if (mode) {
      practiceMode = mode;
      return renderList();
    }
    if (kind) {
      kindFilter = kind;
      byID("filters").querySelectorAll("button").forEach((entry) => entry.setAttribute("aria-pressed", String(entry === button)));
      return renderList();
    }
    if (id) return openDetail(model.items.find((item) => item.id === id));
    if (paper) {
      const questions = questionsIn(paper);
      return openDetail(questions.find((item) => item.id === model.papers[paper].recent) ?? questions[0]);
    }
    if (question) { closeQuestionChooser(); return navigateQuestion(questionsIn(current.group).find((item) => item.id === question)); }
    if (page || anchor) return focusPage(page || anchor);
    if (tool || color || penWidth || eraserWidth) {
      finishDrawing();
      if (tool) model.pencil.tool = tool;
      if (color || penWidth) model.pencil.tool = "pen";
      if (color) model.pencil.color = color;
      if (penWidth) model.pencil.width = Number(penWidth);
      if (eraserWidth) {
        model.pencil.tool = "erase";
        model.pencil.eraserWidth = Number(eraserWidth);
      }
      save();
      return updateTools();
    }
    if (layerSelect) return changeLayer("select", layerSelect);
    if (layerVisibility) return changeLayer("visibility", layerVisibility);
    if (requestedLayerMenu) {
      layerMenu = layerMenu === requestedLayerMenu ? null : requestedLayerMenu;
      nameEdit = null;
      return updateTools();
    }
    if (layerRename) return editLayerName(layerRename);
    if (entryAsset) {
      byID("entry-feedback").textContent = `${entryAsset}导入将在 App 中接入，可先试用粘贴文字。`;
      return;
    }
    if (removeStaged !== undefined) {
      entry.staged.splice(Number(removeStaged), 1);
      const last = entry.group ? (chapters(entry.group).at(-1)?.material ?? 0) : 0;
      entry.staged.forEach((pages, index) => pages.forEach((page) => { page.material = last + index + 1; }));
      return renderEntryMaterials();
    }
    if (reviewPanel) {
      if (activePanel !== reviewPanel && !analysisJobs.has(current.id)) analysisMessages.delete(current.id);
      activePanel = reviewPanel;
      workspaceScroll = 0;
      return renderWorkspace();
    }
    if (deferID) {
      const item = current.doubts.find((doubt) => doubt.id === deferID);
      if (item) {
        item.deferred = !item.deferred;
        if (item.deferred) delete item.draft;
        invalidateScore(current);
        save();
        renderWorkspace();
      }
      return;
    }
    if (button.id === "back") return selectDock("library");
    if (button.id === "new") return openQuestionForm(practiceMode);
    if (button.id === "entry-cancel") return closeQuestionEntry();
    if (button.id === "detail-more") {
      const menu = byID("detail-edit-menu");
      menu.hidden = !menu.hidden;
      button.setAttribute("aria-expanded", String(!menu.hidden));
      if (!menu.hidden) popoverAt(button, menu);
      return;
    }
    if (button.id === "question-count") {
      const picker = byID("question-chooser");
      picker.hidden = !picker.hidden;
      button.setAttribute("aria-expanded", String(!picker.hidden));
      return;
    }
    if (button.id === "question-next" || button.id === "question-prev") {
      const bank = questionsIn(current.group);
      return navigateQuestion(bank[bank.indexOf(current) + (button.id === "question-next" ? 1 : -1)]);
    }
    if (button.id === "entry-paste" && route === "entry") {
      const materialForm = byID("material-form");
      materialForm.reset();
      materialForm.elements.body.setCustomValidity("");
      return byID("material-dialog").showModal();
    }
    if (button.id === "entry-refs") return openMaterialReferences();
    if (button.id === "colors" || button.id === "close-palette") {
      paletteOpen = button.id === "colors" && !paletteOpen;
      if (paletteOpen) { layersOpen = false; nameEdit = null; layerMenu = null; }
      return updateTools();
    }
    if (button.id === "tool-toggle" || button.id === "collapse-doodle") {
      finishDrawing();
      toolbarVisible = button.id === "tool-toggle";
      if (!toolbarVisible) paletteOpen = false;
      return updateTools();
    }
    if (button.id === "layers-toggle") {
      layersOpen = !layersOpen;
      nameEdit = null;
      layerMenu = null;
      if (layersOpen) paletteOpen = false;
      return updateTools();
    }
    if (button.id === "new-layer") return editLayerName(null);
    if (button.id === "cancel-layer-name") { nameEdit = null; return updateTools(); }
    if (button.id === "ink-toggle") {
      finishDrawing();
      inkVisible = !inkVisible;
      return updateTools();
    }
    if (button.id === "finger-draw") { fingerDrawing = !fingerDrawing; return updateTools(); }
    if (button.id === "undo" || button.id === "clear-ink") return editCurrentInk(button.id === "undo" ? "undo" : "clear");
    if (button.id === "zoom-in" || button.id === "zoom-out") {
      const page = rendered[activePage];
      zoom = Math.min(2.40, Math.max(.66, zoom + (button.id === "zoom-in" ? .14 : -.14)));
      applySize();
      if (page) focusPage(page.id);
      return;
    }
    if (button.id === "page-next" || button.id === "page-prev") {
      const next = rendered[activePage + (button.id === "page-next" ? 1 : -1)];
      if (next) focusPage(next.id);
      return;
    }
    if (button.id === "close-composer") {
      syncAnswer(byID("answer-input"));
      composerOpen = false;
      return updateComposer();
    }
    if (command === "type-answer") return startTyping();
    if (command === "add-doubt") {
      const paper = rendered[activePage];
      byID("doubt-anchor").textContent = !paper ? "" : paper.kind === "questions"
        ? "将关联作答要求" : `将关联材料 ${paper.material} · 第 ${activePage + 1} 页`;
      return byID("doubt-dialog").showModal();
    }
    if (command === "append-question") return openQuestionForm("append");
    if (command === "edit-question") return openQuestionForm("edit");
    if (command === "finish") {
      if (!current.answer.trim()) return;
      if (current.status === "work") current.status = "review";
      activePhase = "review"; activePanel = "compare"; workspaceScroll = 0; save(); renderWorkspace(); return;
    }
    if (command === "edit-answer") { activePhase = "work"; workspaceScroll = 0; composerOpen = true; return renderWorkspace(); }
    if (command === "use-example-reference") {
      current.reference = exampleReference;
      save();
      return renderWorkspace();
    }
    if (command === "request-doubts") return startAnalysis("doubt");
    if (command === "request-score") return startAnalysis("score");
    if (command === "confirm-doubts") return confirmDoubts();
    if (command === "save-score") return confirmScore();
    if (command === "cancel-analysis") {
      const job = analysisJobs.get(current.id);
      if (!job) return;
      clearTimeout(job.timer);
      analysisJobs.delete(current.id);
      return report("已取消，可重新发起");
    }
  });

  document.addEventListener("input", (event) => {
    if (!current) return;
    const input = event.target;
    if (input.id === "answer-input") {
      if (!event.isComposing) syncAnswer(input);
      return;
    } else if (input.id === "reference-input") {
      if (current.reference !== input.value) invalidateAnalysis(current);
      current.reference = input.value;
    } else if (input.id === "score-input" || input.id === "score-reason") {
      const next = current.scoreDraft ?? (current.scorePending ??= { value: current.score, reason: current.scoreReason });
      if (input.id === "score-input") next.value = input.value === "" ? null : Number(input.value);
      else next.reason = input.value;
      if (!byID("footer-actions").querySelector('[data-command="save-score"]')) renderFooter();
    } else if (input.id === "analysis-input") current.analysis = input.value;
    else if (input.dataset.draftReply) {
      const item = current.doubts.find((doubt) => doubt.id === input.dataset.draftReply);
      if (!item?.draft) return;
      item.draft.text = input.value;
      renderFooter();
    } else if (input.dataset.reply) {
      const item = current.doubts.find((doubt) => doubt.id === input.dataset.reply);
      if (!item) return;
      item.reply = input.value;
      invalidateScore(current);
      const label = document.querySelector(`[data-reply-state="${CSS.escape(item.id)}"]`);
      if (label) label.textContent = item.reply.trim() ? "已答" : item.deferred ? "待验证" : "待答";
      renderFooter();
    } else return;
    save();
  });
  byID("answer-input").addEventListener("compositionend", (event) => syncAnswer(event.target));

  function showRequired(field, message) {
    field.setCustomValidity(message);
    field.reportValidity();
  }

  for (const field of [byID("new-form").elements.stem, byID("new-form").elements.paperTitle, byID("new-form").elements.minimum,
    byID("material-form").elements.body, byID("layer-name-input")]) {
    field.addEventListener("input", () => field.setCustomValidity(""));
  }
  byID("new-form").elements.limit.addEventListener("input", () => byID("new-form").elements.minimum.setCustomValidity(""));

  byID("new-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const target = entry;
    if (route !== "entry" || !target) return;
    const form = new FormData(event.target);
    const stem = form.get("stem");
    const isNewPaper = newMode === "paper";
    const paperTitle = form.get("paperTitle").trim();
    if (!stem.trim()) return showRequired(event.target.elements.stem, "请输入题干");
    if (isNewPaper && !paperTitle) return showRequired(event.target.elements.paperTitle, "请输入套卷名称");
    const group = target.group ?? uniq();
    const source = form.get("source").trim() || target.paper?.title || paperTitle || "自建练习";
    const full = Number(form.get("full")) || null;
    const limit = Number(form.get("limit")) || null;
    const minimum = Number(form.get("minimum")) || null;
    if (minimum && (!limit || minimum > limit)) {
      return showRequired(event.target.elements.minimum, "字数下限不能高于上限，请同时填写上限");
    }
    const nextNumber = newMode === "append" ? questionsIn(group).length + 1 : 1;
    const item = target.existing ?? {
      id: uniq(), group, answer: "", reference: form.get("reference"), status: "work", doubts: []
    };
    const previousSignature = target.existing ? analysisSignature(item) : null;
    Object.assign(item, {
      source, kind: form.get("kind"), number: form.get("number").trim() || `第 ${nextNumber} 题`,
      stem, short: target.existing?.stem === stem && target.existing.short
        ? target.existing.short : Array.from(stem.trim().replace(/\s+/g, " ")).slice(0, 30).join(""),
      requirement: form.get("requirement"), full, limit, minimum, limitsLabel: minimum ? `限 ${minimum}–${limit} 字` : limit ? `限 ${limit} 字` : ""
    });
    if (isNewPaper) model.papers[group] = { title: paperTitle };
    if (target.staged.length) (model.customGroups[group] ||= []).push(...target.staged.flat());
    if (paperFor(item)) {
      const additions = target.staged.map(([first]) => first.material);
      item.materialRefs = additions.length ? [...(target.refs ?? []), ...additions] : target.refs;
    }
    if (target.existing) {
      if (previousSignature !== analysisSignature(item)) invalidateAnalysis(item);
    } else if (paperFor(item)) model.items.push(item);
    else model.items.unshift(item);
    save();
    const panel = target.existing ? activePanel : "compare";
    if (target.fromDetail) {
      closeQuestionEntry();
      renderPaper();
      restoreReading(current);
    } else entry = null;
    openDetail(item, panel);
  });

  byID("material-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const form = event.target;
    const field = form.elements.body;
    const raw = field.value;
    const paragraphs = raw.split(/\r\n?|\n/).filter((p) => p.trim());
    if (!paragraphs.length) return showRequired(field, "请输入材料正文");
    const pending = entry;
    if (route !== "entry" || !pending) return;
    const submit = form.querySelector('[type="submit"]');
    if (submit.disabled) return;
    submit.disabled = true;
    try {
      await document.fonts.ready;
      if (route !== "entry" || entry !== pending || !byID("material-dialog").open || field.value !== raw) return;
      const previous = pending.group ? chapters(pending.group) : [];
      const material = (previous.at(-1)?.material ?? 0) + pending.staged.length + 1;
      const pages = paginateMaterial(material, paragraphs);
      pending.staged.push(pages);
      byID("entry-feedback").textContent = "";
      renderEntryMaterials();
      byID("material-dialog").close();
      form.reset();
    } finally { submit.disabled = false; }
  });

  byID("material-ref-form").addEventListener("submit", (event) => {
    event.preventDefault();
    if (route !== "entry" || !entry?.paper) return;
    const selected = new FormData(event.target).getAll("materials").map(Number);
    entry.refs = selected;
    byID("material-ref-dialog").close();
    renderEntryMaterials();
  });

  byID("layer-name-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const page = rendered[activePage];
    if (!nameEdit || !page?.canvas || nameEdit.scope !== scopeKey(page)) return;
    const input = byID("layer-name-input");
    const name = input.value.trim();
    if (!name) return showRequired(input, "请输入图层名称");
    finishDrawing();
    const group = layersFor(page);
    if (nameEdit.id) {
      const layer = group.list.find((item) => item.id === nameEdit.id);
      if (layer) layer.name = name;
    } else {
      const id = uniq();
      group.list.push({ id, name, visible: true });
      group.active = id;
    }
    nameEdit = null;
    save();
    refreshLayerInk(page);
  });

  byID("doubt-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const value = new FormData(event.target).get("question").trim();
    if (!value) return;
    current.doubts.push({ id: uniq(), text: value, page: rendered[activePage]?.id, reply: "" });
    invalidateScore(current);
    save();
    byID("doubt-dialog").close();
    event.target.reset();
    renderWorkspace();
  });

  const screen = params.get("screen") || "read";
  if (screen === "settings") selectDock("settings");
  else if (screen === "entry") {
    selectDock("library");
    openQuestionForm(practiceMode);
  } else if (["read", "review", "layers", "questions"].includes(screen)) {
    const itemID = params.get("mode") === "single" ? standaloneExample.id : params.get("question") || "first";
    const item = model.items.find((entry) => entry.id === itemID) ?? model.items.find((entry) => entry.id === "first");
    const stage = params.get("stage");
    openDetail(item, ["compare", "doubt", "score"].includes(stage) ? stage : "compare");
    if (screen === "questions") focusPage("questions-1");
    if (screen === "layers") {
      layersOpen = true;
      updateTools();
    }
  } else {
    selectDock("library");
  }
})();

</script>
</body>
</html>
