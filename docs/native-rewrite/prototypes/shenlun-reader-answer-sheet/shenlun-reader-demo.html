<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申论学习工作区 · 设计原型</title>
<style>
  :root {
    --ink: #182131;
    --secondary: #536074;
    --muted: #68758a;
    --line: #e4e9f0;
    --surface: #f2f4f8;
    --paper-back: #e8edf5;
    --white: #fff;
    --blue: #1262cc;
    --blue-fill: #e8f1ff;
    --green: #176450;
    --green-fill: #e7f4ed;
    --orange: #885727;
    --orange-fill: #fcf2e3;
    --radius: 17px;
    --font: -apple-system, BlinkMacSystemFont, "Microsoft YaHei UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box }
  [hidden] { display: none !important }
  html, body { height: 100%; margin: 0 }
  body { overflow: hidden; font: 14px/1.55 var(--font); color: var(--ink); background: var(--surface) }
  button, input, textarea, select { font: inherit; color: inherit }
  button { cursor: pointer }
  button:disabled { opacity: .48; cursor: not-allowed }
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px
  }
  h1, h2, h3, p { margin: 0 }
  h1 { font-size: 21px; font-weight: 700; line-height: 1.25 }
  h2 { font-size: 16px; font-weight: 700 }
  h3 { font-size: 15px; font-weight: 700 }
  .minor { color: var(--muted); font-size: 12px }
  .summary { color: var(--secondary); line-height: 1.72 }
  .app { height: 100%; display: grid; grid-template-rows: 64px minmax(0, 1fr) }
  .bar {
    position: relative; z-index: 4; border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, .96); display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 24px
  }
  .bar-left, .bar-actions { display: flex; align-items: center; gap: 10px; min-width: 0 }
  .bar-left { grid-column: 1 }
  .bar-actions { grid-column: 3; justify-content: flex-end }
  .bar-name { display: flex; gap: 9px; align-items: center }
  .demo { color: var(--muted); font-size: 11px; font-weight: 500; white-space: nowrap }
  .detail-name { min-width: 0; text-align: center; grid-column: 2 }
  .detail-name h1 { font-size: 17px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis }
  .detail-name .minor { margin-top: 3px }
  .icon {
    width: 20px; height: 20px; flex: 0 0 20px; display: inline-flex;
    align-items: center; justify-content: center; color: currentColor; position: relative
  }
  .icon-book::before { content: ""; width: 13px; height: 15px; border: 1.7px solid currentColor; border-radius: 3px }
  .icon-book::after { content: ""; width: 6px; height: 1.6px; background: currentColor; position: absolute; top: 7px; box-shadow: 0 4px currentColor }
  .icon-grid::before { content: ""; width: 5px; height: 5px; border: 1.5px solid currentColor; border-radius: 1px; transform: translate(-4px, -4px); box-shadow: 8px 0 currentColor, 0 8px currentColor, 8px 8px currentColor }
  .icon-home::before { content: ""; width: 11px; height: 11px; border-left: 1.6px solid currentColor; border-top: 1.6px solid currentColor; transform: rotate(45deg); position: absolute; top: 3px }
  .icon-home::after { content: ""; width: 11px; height: 9px; border: 1.6px solid currentColor; border-top: 0; border-radius: 1px; position: absolute; top: 9px }
  .icon-gear, .icon-check { font-size: 21px; line-height: 1 }
  .primary, .plain, .quiet, .soft, .back {
    min-height: 44px; border: 0; border-radius: 11px; padding: 0 15px; white-space: nowrap; background: none; font-weight: 600
  }
  .primary { color: white; background: #1264d7 }
  .primary:hover:not(:disabled) { background: #0d59c4 }
  .plain { color: var(--blue); background: transparent }
  .plain:hover, .quiet:hover, .back:hover, .soft:hover { background: var(--blue-fill) }
  .soft { background: var(--blue-fill); color: var(--blue) }
  .quiet { color: var(--secondary); padding: 0 10px }
  .back { padding: 0 6px; color: var(--blue); font-size: 15px }
  .back .chevron { font-size: 25px; vertical-align: -2px; margin-right: 3px; font-weight: 400 }
  .pill {
    padding: 4px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px;
    white-space: nowrap; font-size: 12px; font-weight: 600; line-height: 1.4
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
  .state-work { color: var(--blue); background: var(--blue-fill) }
  .state-review { color: var(--orange); background: var(--orange-fill) }
  .state-score { color: var(--green); background: var(--green-fill) }
  .body-screen { min-height: 0; position: relative }
  .home-screen { height: 100%; min-height: 0; overflow-y: auto }
  .library-wrap { width: min(900px, calc(100% - 48px)); margin: 50px auto 140px }
  .list-title { font-size: 29px; letter-spacing: .02em; margin-bottom: 19px }
  .practice-modes { display: inline-flex; gap: 4px; padding: 4px; margin-bottom: 18px; background: #e5eaf2; border-radius: 12px }
  .practice-modes button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 9px; background: none; font-weight: 600; color: var(--secondary) }
  .practice-modes button[aria-current="true"] { background: white; color: var(--blue); box-shadow: 0 1px 4px #172d5420 }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px }
  .filter {
    border: 1px solid var(--line); border-radius: 999px; background: white;
    padding: 0 18px; min-height: 44px; color: var(--secondary); font-weight: 600
  }
  .filter[aria-pressed="true"] { background: var(--blue-fill); color: var(--blue); border-color: #c7ddff }
  .entry-list { background: white; border: 1px solid var(--line); border-radius: 19px; overflow: hidden }
  .entry {
    display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 16px; align-items: center;
    width: 100%; text-align: left; border: 0; background: white; padding: 17px 20px; gap: 16px
  }
  .entry + .entry { border-top: 1px solid var(--line) }
  .entry:hover { background: #f8fbff }
  .entry h3 { font-size: 17px; margin: 4px 0 3px }
  .entry-progress { color: var(--secondary); text-align: right; font-size: 12px; line-height: 1.55; white-space: nowrap }
  .entry-mark { height: 40px; width: 40px; border-radius: 11px; color: var(--blue); background: var(--blue-fill); display: grid; place-items: center }
  .entry-arrow { font-size: 23px; color: #6a7890 }
  .empty { color: var(--muted); padding: 25px 18px; text-align: center }
  .dock {
    position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: 20px;
    max-width: calc(100% - 22px); min-width: 370px; padding: 5px; display: flex;
    border: 1px solid #dce4f0; border-radius: 32px; background: rgba(255, 255, 255, .94);
    box-shadow: 0 10px 30px rgba(43, 65, 97, .13); backdrop-filter: blur(12px)
  }
  .dock button { border: 0; border-radius: 26px; min-height: 50px; flex: 1; min-width: 62px; color: var(--secondary); display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12px; background: none }
  .dock button[aria-current="page"] { color: var(--blue); background: var(--blue-fill); font-weight: 700 }
  .settings-switch { display: flex; gap: 18px; align-items: center; justify-content: space-between; padding: 17px 18px }
  .settings-switch input { appearance: none; width: 48px; height: 28px; border-radius: 16px; background: #ccd3dd; margin: 0; position: relative; flex: 0 0 48px }
  .settings-switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: white; box-shadow: 0 1px 3px #26334540 }
  .settings-switch input:checked { background: #24a268 }
  .settings-switch input:checked::after { left: 23px }

  .detail-screen {
    height: 100%; min-height: 0; display: grid;
    grid-template-columns: minmax(0, 60fr) minmax(320px, 40fr);
    background: white
  }
  .narrow-nav { display: none }
  .reader, .workspace { min-width: 0; min-height: 0; display: flex; flex-direction: column }
  .reader { border-right: 1px solid #d9e1ec; background: var(--paper-back) }
  .reading-top { position: relative; z-index: 4; background: white; border-bottom: 1px solid var(--line); padding: 5px 16px 0 }
  .material-row { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px }
  .material-nav { min-width: 0; display: flex; overflow: auto; padding: 0 0 1px; scrollbar-width: none }
  .material-nav::-webkit-scrollbar { display: none }
  .material-tab, .section-tab, .narrow-tab {
    background: transparent; border: 0; min-height: 44px; padding: 0 13px; font-weight: 600;
    color: var(--secondary); white-space: nowrap; border-bottom: 2px solid transparent
  }
  .material-tab[aria-current="true"], .section-tab[aria-current="true"], .narrow-tab[aria-current="true"] {
    color: var(--blue); border-bottom-color: #2676db
  }
  .tools {
    position: relative; z-index: 3; flex: 0 0 auto; min-height: 53px; padding: 4px 14px; background: #f9fbff; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 8px; align-items: center
  }
  .doodle-controls, .zoom { display: flex; align-items: center; gap: 6px; min-width: 0 }
  .doodle-scroll { overflow: auto; padding-block: 4px; scrollbar-width: none }
  .doodle-scroll::-webkit-scrollbar { display: none }
  .doodle-capsule {
    width: max-content; min-width: 0; height: 40px; display: flex; gap: 2px; align-items: center;
    padding: 0 6px; border-radius: 23px; border: 1px solid #d9e1eb;
    background: #ffffffdf; box-shadow: 0 2px 5px #24365014; backdrop-filter: blur(14px)
  }
  .doodle-capsule button { border: 0; background: transparent; width: 32px; height: 38px; color: var(--ink); padding: 0; border-radius: 18px; display: grid; place-items: center; flex: 0 0 32px }
  .doodle-capsule button:hover, .doodle-capsule button[aria-pressed="true"], .layers-button[aria-expanded="true"] { color: var(--blue); background: var(--blue-fill) }
  .doodle-glyph { font: 15px/1 "Segoe MDL2 Assets", "Segoe UI Symbol", sans-serif }
  .doodle-hand { font: 18px/1 "Segoe UI Symbol", sans-serif }
  .layer-indicator { margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  .layers-button { display: flex; align-items: center; gap: 6px; border-radius: 20px }
  .stack-icon { position: relative; display: inline-block; width: 15px; height: 15px; flex: 0 0 15px }
  .stack-icon::before, .stack-icon::after { content: ""; width: 9px; height: 9px; position: absolute; left: 2px; transform: rotate(45deg) skew(-12deg,-12deg); border: 1.4px solid currentColor; border-radius: 2px }
  .stack-icon::before { top: 1px; z-index: 1; background: #f9fbff }
  .stack-icon::after { top: 5px }
  .zoom button, .page-controls button {
    height: 44px; min-width: 44px; padding: 0 9px; border: 0; border-radius: 9px; color: var(--secondary); white-space: nowrap; background: transparent
  }
  .zoom button:hover, .page-controls button:hover { background: var(--blue-fill) }
  .swatch {
    width: 28px; height: 28px; border-radius: 50%; display: inline-block; background: var(--stroke, #222)
  }
  .floating-panel {
    position: absolute; width: min(322px, calc(100% - 22px)); background: #fff;
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 10px 36px #182d4933; padding: 13px;
    max-height: min(520px, 65vh); overflow: auto
  }
  .layers-panel { z-index: 5; top: 47px; right: 12px }
  .palette-panel { top: calc(100% + 3px); left: 12px }
  .floating-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px }
  .floating-head .mini-btn { color: var(--secondary) }
  .layer-list { display: grid; margin: 0 0 7px; padding: 0; list-style: none }
  .layer-line { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; min-height: 48px; padding: 0 3px; border-bottom: 1px solid var(--line); gap: 2px }
  .layer-line:first-child { border-top: 1px solid var(--line) }
  .layer-line[data-current="true"] { background: #f2f7ff; border-color: #dce9ff }
  .layer-name { text-align: left; min-height: 44px; background: none; border: 0; padding: 3px 7px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px }
  .layer-name strong { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600 }
  .layer-line[data-current="true"] .layer-name, .layer-line[data-current="true"] .layer-name .minor { color: var(--blue) }
  .layer-eye { min-width: 38px; height: 44px; display: grid; place-items: center; color: var(--secondary); border: 0; background: none; border-radius: 8px }
  .eye-icon { position: relative; width: 18px; height: 12px; border: 1.4px solid currentColor; border-radius: 70% 70%; display: inline-grid; place-items: center }
  .eye-icon::before { content: ""; width: 5px; height: 5px; background: currentColor; border-radius: 50% }
  .layer-eye[aria-pressed="false"] .eye-icon::after { content: ""; position: absolute; width: 20px; height: 1.5px; background: currentColor; transform: rotate(-35deg) }
  .layer-actions { display: flex; align-items: center; justify-content: space-between; gap: 5px }
  .layer-name-form { display: grid; gap: 6px; padding: 5px 0 7px }
  .layer-name-form input { min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px }
  .layer-name-form footer { display: flex; justify-content: flex-end; gap: 4px }
  .palette-panel .color-choices { display: flex; justify-content: space-between; gap: 5px; margin: 7px 0 12px }
  .color-choices button { min-width: 48px; min-height: 44px; border: 0; background: none; padding: 3px; display: grid; place-items: center }
  .color-choices button[aria-pressed="true"] .swatch { outline: 2px solid var(--blue); outline-offset: 3px }
  .tool-options { display: flex; gap: 3px; margin: 4px 0 11px; border-radius: 8px; padding: 3px; background: #eef1f6 }
  .tool-options button { flex: 1; min-height: 37px; border: 0; border-radius: 6px; background: none }
  .tool-options [aria-pressed="true"] { color: var(--blue); background: white; box-shadow: 0 1px 3px #24365020 }
  .zoom { flex: 0 0 auto }
  .zoom button, .page-controls button { font-size: 20px; line-height: 1 }
  .zoom-output { font-size: 12px; min-width: 37px; text-align: center }
  .reader-scroll { position: relative; min-height: 0; flex: 1; overflow: auto; padding: 18px 16px 22px; overscroll-behavior: contain }
  .reader-pages { display: grid; justify-items: center; align-items: start; gap: 16px; min-width: max-content; position: relative }
  .paper-wrap { position: relative; width: 612px; height: 866.033px; box-shadow: 0 8px 28px #3549631e }
  .paper {
    position: absolute; left: 0; top: 0; width: 612px; height: 866.033px; background: white;
    transform-origin: top left; color: #1a1b22; overflow: hidden; touch-action: pan-y pinch-zoom
  }
  .paper-running { position: absolute; left: 70px; right: 69.5px; top: 47px; display: flex; align-items: center; justify-content: space-between; color: #526584; border-bottom: 1px solid #e3e8f0; padding-bottom: 8px; font: 9.2px/1.4 var(--font) }
  .paper-copy { position: absolute; top: 91px; left: 70px; right: 69.5px; bottom: 60px; font: 11.31px/20.6px "FangSong", "STFangsong", "仿宋", "Noto Serif SC", serif; font-weight: 400; color: #17191e }
  .paper-copy.continuing { top: 96px }
  .paper-copy p { margin: 0; text-indent: 22.63px; text-align: justify; text-align-last: auto; line-break: strict; overflow-wrap: anywhere; orphans: 2; widows: 2 }
  .paper-copy .latin { font-family: "Times New Roman", serif }
  .paper-copy h2 { font: 16px/21px var(--font); font-weight: 700; color: #181b22; margin-bottom: 19px }
  .paper-copy h3 { width: max-content; padding: 0 9px; border-radius: 4px; background: #477ded; color: white; font: 700 11.5px/23px var(--font); margin-bottom: 15px }
  .paper-copy .paragraph-continuation { text-indent: 0 }
  .paper-copy.paper-measure { position: fixed; top: 0; left: -1000px; right: auto; bottom: auto; width: 472.5px; height: 715.033px; visibility: hidden; overflow: hidden; pointer-events: none }
  .paper-measure.continuing { height: 710.033px }
  .paper-footer { position: absolute; left: 70px; right: 69.5px; bottom: 30px; border-top: 1px solid #e3e8f0; padding-top: 7px; color: #5f7089; font-size: 9px; text-align: right }
  .ink { position: absolute; inset: 0; width: 100%; height: 100%; background: transparent; touch-action: pan-y pinch-zoom }
  .ink.hide-ink { visibility: hidden; pointer-events: none }
  .ink.finger-ink { touch-action: none }
  .ink.read-ink { pointer-events: none }
  .page-controls { position: relative; z-index: 2; align-self: center; display: flex; gap: 8px; align-items: center; margin: 6px 0 9px; min-height: 44px; padding: 0 5px; border-radius: 24px; background: #fff; border: 1px solid #dce5f0; font-size: 12px; color: #526277 }
  .page-controls button { border-radius: 20px }

  .workspace { background: #f7f8fb }
  .workspace-head { padding: 7px 19px 0; background: white; border-bottom: 1px solid var(--line) }
  .paper-nav { padding-bottom: 8px; border-bottom: 1px solid var(--line) }
  .question-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px }
  .question-tabs { min-width: 0; display: flex; align-items: center; gap: 7px; overflow-x: auto; scrollbar-width: thin; padding: 3px 0 }
  .question-tab { min-height: 44px; flex: 0 0 auto; padding: 3px 11px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--secondary); font-size: 13px; font-weight: 600; white-space: nowrap }
  .question-tab span { font-size: 11px; margin-inline-start: 5px; font-weight: 500 }
  .question-tab[aria-current="true"] { background: var(--blue-fill); border-color: #c7ddff; color: var(--blue) }
  .question-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
  .question-links .mini-btn { padding-inline: 3px }
  .question-links .anchor { padding-inline: 3px }
  .workspace-title { display: flex; min-height: 36px; align-items: center; justify-content: space-between; gap: 10px }
  .workspace-tabs { display: flex; gap: 1px; overflow: auto; scrollbar-width: none }
  .section-tab { padding-inline: 12px }
  .pane-scroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; padding: 16px 18px 20px; display: grid; align-content: start; gap: 12px }
  .panel { background: white; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); min-width: 0 }
  .panel + .panel { margin-top: 0 }
  .panel-head, .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0 }
  .panel-head { min-height: 29px; margin-bottom: 8px }
  .panel-head.tight { margin-bottom: 0 }
  .panel p { overflow-wrap: anywhere }
  .question-text { font-size: 14.5px; font-weight: 600; line-height: 1.75; margin: 5px 0 6px; white-space: pre-wrap }
  .requirement { color: var(--secondary); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap }
  .workspace textarea, .workspace input, dialog input, dialog textarea, dialog select {
    width: 100%; background: #f7f9fc; border: 1px solid #e1e7f0; border-radius: 10px;
    color: var(--ink); padding: 10px 11px; line-height: 1.65
  }
  .workspace textarea { display: block; min-height: 76px; resize: vertical }
  .workspace .answer-input { min-height: 114px }
  .read-answer { white-space: pre-wrap; line-height: 1.8 }
  .reference-text { background: #f2f7ff; border-color: #dbe9fc }
  .below { margin-top: 8px }
  .doubt-list { padding: 0; margin: 0; list-style: none }
  .doubt-list li { padding: 10px 0 }
  .doubt-list li + li { border-top: 1px solid var(--line) }
  .doubt-number { font: 700 12px/1 var(--font); width: 23px; height: 23px; border-radius: 8px; display: inline-grid; place-items: center; background: var(--blue-fill); color: var(--blue); flex: 0 0 23px }
  .doubt-body { display: flex; gap: 9px; align-items: flex-start }
  .doubt-body strong { font-weight: 600 }
  .anchor { color: var(--blue); font-size: 11.5px; min-height: 25px; padding: 0; border: 0; background: none; line-height: 1.4; text-align: left }
  .anchor:hover { text-decoration: underline }
  .mini-btn { min-height: 44px; border: 0; border-radius: 9px; background: none; color: var(--blue); padding: 0 8px; font-size: 12px; font-weight: 600; white-space: nowrap }
  .mini-btn:hover { background: var(--blue-fill) }
  .meter { color: var(--blue); font-size: 25px; font-weight: 700; letter-spacing: -.02em }
  .meter small { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: 0 }
  .score-input { width: 92px !important }
  .score-check { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin-bottom: 8px }
  .footer-actions { flex: 0 0 auto; background: white; border-top: 1px solid var(--line); padding: 9px 18px; display: flex; gap: 9px; justify-content: flex-end; align-items: center }
  .footer-actions .minor { margin-right: auto }
  .footer-actions .primary, .footer-actions .soft { min-height: 44px }
  .ai-status { font-size: 12px; color: var(--blue); min-width: 0; margin-right: auto; line-height: 1.4 }
  .ai-status:empty { display: none }
  .ai-status[data-busy="true"]::before { display: inline-block; content: ""; width: 11px; height: 11px; border: 2px solid #c1d7f8; border-top-color: var(--blue); border-radius: 50%; margin-right: 6px; vertical-align: -2px; animation: spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg) } }
  .ai-draft { border-color: #c7ddff; background: #f3f8ff }
  .ai-draft .review-tag { color: var(--blue); font-size: 12px; white-space: nowrap }
  .evidence-list { margin: 13px 0 0; padding: 0; list-style: none }
  .evidence-list li { padding: 10px 0 8px; border-top: 1px solid #dce8f8 }
  .evidence-list strong { font-weight: 600 }
  .notice { color: var(--orange); background: var(--orange-fill); padding: 8px 10px; border-radius: 9px; margin-bottom: 8px; font-size: 12px }
  dialog { border: 1px solid var(--line); border-radius: 18px; max-width: min(500px, calc(100% - 24px)); width: 100%; padding: 20px; box-shadow: 0 18px 50px #24334a4a }
  dialog::backdrop { background: rgba(24, 34, 53, .32) }
  dialog form { display: grid; gap: 11px }
  dialog label { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; font-weight: 600 }

    .reader-scroll { padding: 12px 8px 18px }
    .reading-top { padding-inline: 8px }
    .tools { padding-inline: 5px; gap: 4px; min-height: 49px }
    .layer-indicator { display: none }
    .zoom { gap: 0 }
    .zoom button { padding-inline: 3px; min-width: 35px }
    .zoom-output { min-width: 32px; font-size: 11px }
    .pane-scroll { padding: 10px }
    .footer-actions { padding-inline: 9px; gap: 5px; flex-wrap: wrap }
    .entry-progress { font-size: 10.5px }
    .workspace-head { padding-inline: 10px }
  }

  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0 }
  .app { grid-template-rows: auto minmax(0, 1fr) }
  .bar { min-height: 64px }
  .bar.is-detail {
    grid-template-columns: minmax(90px, 1fr) minmax(0, auto) minmax(0, 1fr);

  .detail-actions { grid-area: actions; justify-content: flex-end }
  .top-doodle { justify-content: flex-end }
  .top-icon { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 20px; border: 0; padding: 0; display: grid; place-items: center; font-size: 23px; color: var(--ink); background: transparent }

  .floating-panel.layers-panel, .floating-panel.detail-menu, .floating-panel.palette-panel { top: calc(100% + 5px); right: auto; left: var(--pop-x, auto); z-index: 10 }

  .floating-panel.palette-panel { left: auto; right: 12px }
  .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; text-align: left; white-space: nowrap; color: var(--ink); font-size: 14px; font-weight: 550 }
  .menu-item:hover { background: var(--blue-fill) }
  .menu-plus { width: 15px; font-size: 17px }
  .layer-list { margin: 0 }
  .layer-line { position: relative; min-height: 47px; grid-template-columns: minmax(0, 1fr) 44px 44px; gap: 0; padding: 0 2px; border: 0; border-radius: 8px }
  .layer-line:first-child { border-top: 0 }
  .layer-line + .layer-line { margin-top: 2px }
  .layer-line[data-current="true"] { background: #e8f1fe; border-color: transparent }
  .layer-name { flex-direction: row; align-items: center; justify-content: flex-start; padding: 0 6px; gap: 9px; font-size: 13px }
  .layer-preview { flex: 0 0 34px; width: 34px; height: 31px; border: 1px solid #e0e6ee; border-radius: 5px; background: #fff }
  .layer-eye { min-width: 44px; color: var(--secondary) }
  .layer-more { padding: 0; color: var(--secondary); font-size: 16px; min-width: 44px }
  .layer-overflow { grid-column: 1 / -1; padding: 0 5px 4px; }

  .layer-actions { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 2px }
  .layer-name-form { padding: 7px 5px 4px }

  .revised-workspace.detail-screen {
    grid-template-columns: minmax(0, 55fr) minmax(280px, 45fr);
    grid-template-rows: minmax(0, 1fr);
  }
  .revised-workspace .reader { border-right: 1px solid #dee3eb; background: #eeeff3 }

  .revised-workspace .material-nav { align-items: center; padding: 0; height: 51px }
  .revised-workspace .material-tab { font-size: 13px; padding-inline: 11px; min-height: 51px }
  .revised-workspace .material-tab[aria-current="true"] { color: var(--blue); border-color: #2676db }
  .revised-workspace .reader-scroll { padding: 14px 10px 16px }
  .revised-workspace .paper-wrap { box-shadow: 0 2px 15px #30395317 }
  .paper-copy, .paper-copy.continuing { top: 68px; bottom: 57px }
  .paper-copy.paper-measure, .paper-measure.continuing { height: 741.033px; position: absolute }
  .paper-copy .material-heading { background: transparent; font: 650 12px/20px var(--font); color: #244a7a; margin: 0 0 11px; padding: 0 }
  .question-copy h2 { font-size: 17px; margin-bottom: 24px }
  .paper-copy .question-block { margin: 0 0 14px }
  .paper-copy .question-block h3 {
    text-align: center; background: transparent; color: #1a1b22; font: 700 12px/18px "FangSong", "STFangsong", "仿宋", serif;
    width: auto; padding: 0; margin: 0 0 10px;
  }
  .paper-copy .question-block p { text-indent: 0; text-align: start; white-space: pre-wrap; line-height: 20px }
  .paper-copy .question-block .question-copy-stem { font-weight: 700 }
  .paper-copy .question-block[data-active="true"] h3 { color: #284e81 }
  .reader-footer {
    flex: 0 0 auto; min-height: 48px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 0 9px; background: #fafbfc; border-top: 1px solid var(--line)
  }
  .reader-footer .zoom button { font-size: 15px; min-width: 34px; padding: 0 5px }
  .reader-footer .page-controls { margin: 0; min-height: 41px; gap: 4px; border: 0; background: none; padding: 0 }

  .revised-workspace .workspace-title { min-height: 51px }

  }

    width: 164px; top: calc(100% + 6px); right: 0; display: grid; padding: 5px;
    border-radius: 12px; z-index: 6;
  }
  .question-chooser button { text-align: left; padding: 0 9px; font-size: 13px; min-height: 37px }
  .question-chooser button[aria-current="true"] { color: var(--blue); background: var(--blue-fill); font-weight: 650 }
  .revised-workspace .pane-scroll { padding: 14px 18px 18px }
  .answer-sheets { min-width: 0; display: grid; gap: 11px }
  .sheet-card { background: #fff; border: 1px solid #e8e9ee; border-radius: 12px; padding: 8px 13px 15px; min-width: 0 }
  .sheet-head { min-height: 35px; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px }
  .sheet-count { color: #70616a; font-size: 12px; font-variant-numeric: tabular-nums }
  .sheet-count[data-over="true"] { color: #a13e45 }
  .sheet-head button { min-height: 34px; font-size: 12px; border-radius: 8px; display: flex; align-items: center; gap: 6px }
  .sheet-head button .doodle-glyph { font-size: 13px }
  .sheet-grids { display: grid; gap: 16px; container-type: inline-size }
  .sheet-grid { --grid-line: #b57f82; --grid-dark: #935360; min-width: 0; white-space: normal; display: grid; gap: 5px }
  .sheet-rows { display: grid; gap: 1.62cqw; border-radius: 1px; min-width: 0; position: relative }
  .sheet-row { display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); position: relative }
  .answer-cell {
    aspect-ratio: 1; min-width: 0; display: grid; place-items: center; font-size: clamp(7px, 2.90cqw, 17px); line-height: 1;
    color: #24202a; border: 1px solid var(--grid-line); border-right: 0; overflow: hidden;
  }
  .answer-cell:last-of-type { border-right: 1px solid var(--grid-line) }
  .answer-cell[data-marker] { border-bottom-color: var(--grid-dark); border-right-color: var(--grid-dark) }
  .sheet-row .sheet-mark {
    position: absolute; top: 100%; font-variant-numeric: tabular-nums; line-height: 1; font-size: clamp(7px, 1.45cqw, 10px);
    color: #7d4e59; pointer-events: none; transform: translate(-100%, 1px)
  }
  .sheet-row:last-child .sheet-mark { transform: translate(-100%, 4px) }
  .sheet-grid:not(:last-of-type) { padding-bottom: 14px; border-bottom: 1px solid var(--line) }
  .sheet-page-number { text-align: right; font-size: 11px; color: var(--muted); margin-bottom: 3px }
  .sheet-help { margin: 0 0 9px; font-size: 12px; color: var(--muted) }
  .sheet-help:empty { display: none }
  .sheet-card[data-has-limit="true"] { padding-bottom: 22px }
  .answer-composer {
    padding: 5px 17px 9px; flex: 0 0 auto; min-height: 0; border-top: 1px solid var(--line); background: white;
  }
  .answer-composer label { font-size: 12px; color: var(--secondary) }
  .answer-composer textarea { min-height: 72px; max-height: 136px; resize: none }

  .workspace .footer-actions { min-height: 55px; padding: 5px 16px; }

  @media (min-width: 680px) and (max-width: 1000px) {
    .revised-workspace .pane-scroll { padding: 12px; }

  }

  }

    .revised-workspace .reader { border-right: 0; border-bottom: 1px solid #dfe4ec }
    .revised-workspace .workspace { padding-inline: 0 }
    .revised-workspace .reading-top { padding-inline: 7px }

</style>

<body>
<div class="app">
  <header class="bar">
    <div class="bar-left">
      <div id="bar-name" class="bar-name"><span class="icon icon-book" aria-hidden="true" style="color:var(--blue)"></span><h1 id="root-title">申论</h1><span class="demo">交互示例</span></div>
      <button id="back" class="back" type="button" hidden><span class="chevron" aria-hidden="true">‹</span>申论</button>
      <button id="entry-cancel" class="back" type="button" hidden>取消</button>
    </div>
    <div id="detail-name" class="detail-name" hidden><h1 id="exam-title"></h1></div>
    <div id="entry-name" class="detail-name" hidden><h1 id="new-title">录入单题</h1><div id="entry-context" class="minor" hidden></div></div>
    <div class="bar-actions">
      <button id="new" class="primary" type="button">＋ 新建练习</button>
      <button id="entry-save" class="primary" type="submit" form="new-form" hidden>保存题目</button>
      <div id="detail-actions" class="detail-actions" hidden>
        <button id="detail-more" class="top-icon" aria-label="练习操作" aria-expanded="false" aria-controls="detail-edit-menu" type="button">···</button>
        <div id="top-doodle" class="top-doodle" role="group" aria-label="材料涂鸦">
          <button id="layers-toggle" class="top-icon layers-button" type="button" aria-label="图层" aria-expanded="false" aria-controls="layers-panel" title="图层"><span class="stack-icon" aria-hidden="true"></span></button>
          <button id="tool-toggle" class="top-icon" type="button" aria-label="展开涂鸦工具" title="展开涂鸦工具" hidden><span class="doodle-glyph" aria-hidden="true">&#xE70F;</span></button>
          <div class="doodle-scroll" id="doodle-scroll">
            <div class="doodle-capsule" aria-label="现有涂鸦工具">
              <button id="collapse-doodle" type="button" aria-label="收起涂鸦工具" title="收起涂鸦工具"><span class="doodle-glyph" aria-hidden="true">&#xE711;</span></button>
              <button type="button" data-tool="pen" aria-label="画笔" title="画笔" aria-pressed="true"><span class="doodle-glyph" aria-hidden="true">&#xE70F;</span></button>
              <button type="button" data-tool="erase" aria-label="橡皮擦" title="橡皮擦" aria-pressed="false"><span class="doodle-glyph" aria-hidden="true">&#xE75C;</span></button>
              <button id="undo" type="button" aria-label="撤销" title="撤销"><span class="doodle-glyph" aria-hidden="true">&#xE7A7;</span></button>
              <button id="clear-ink" type="button" aria-label="清空当前页活动图层" title="清空当前页活动图层"><span class="doodle-glyph" aria-hidden="true">&#xE74D;</span></button>
              <button id="colors" type="button" aria-label="画笔调节" title="画笔调节" aria-pressed="false"><span class="doodle-glyph" aria-hidden="true">&#xE790;</span></button>
              <button id="finger-draw" type="button" aria-label="手指涂鸦" title="手指涂鸦" aria-pressed="false"><span class="doodle-hand" aria-hidden="true">☝︎</span></button>
            </div>
          </div>
          <span id="layer-indicator" class="visually-hidden" aria-live="polite"></span>
        </div>
      </div>
    </div>
    <div id="detail-edit-menu" class="floating-panel detail-menu" role="group" aria-label="练习操作" hidden>
      <button class="menu-item" data-command="edit-question" type="button"><span class="doodle-glyph" aria-hidden="true">&#xE70F;</span>编辑题目</button>
      <button id="append-command" class="menu-item" data-command="append-question" type="button"><span class="menu-plus" aria-hidden="true">＋</span>添加题目</button>
    </div>
    <section class="floating-panel layers-panel" id="layers-panel" aria-label="图层" hidden>
      <ul id="layer-list" class="layer-list"></ul>
      <form id="layer-name-form" class="layer-name-form" hidden>
        <label id="layer-name-label" for="layer-name-input" class="minor">图层名称</label>
        <input id="layer-name-input" name="layerName" required autocomplete="off">
        <footer><button id="cancel-layer-name" class="quiet" type="button">取消</button><button class="primary" type="submit">保存</button></footer>
      </form>
      <div class="layer-actions">
        <button id="new-layer" type="button" class="mini-btn">＋ 新建图层</button>
        <button id="ink-toggle" type="button" class="layer-eye" aria-pressed="true" aria-label="隐藏全部笔迹" title="隐藏全部笔迹"><span class="eye-icon" aria-hidden="true"></span></button>
      </div>
    </section>
    <section id="palette-panel" class="floating-panel palette-panel" aria-labelledby="palette-title" hidden>
      <div class="floating-head"><h2 id="palette-title">画笔调节</h2><button id="close-palette" class="mini-btn" type="button">完成</button></div>
      <div class="color-choices" aria-label="笔色">
        <button type="button" data-color="#252525" aria-label="黑色"><span class="swatch" style="--stroke:#252525"></span></button>
        <button type="button" data-color="#ff3b30" aria-label="红色"><span class="swatch" style="--stroke:#ff3b30"></span></button>
        <button type="button" data-color="#007aff" aria-label="蓝色"><span class="swatch" style="--stroke:#007aff"></span></button>
        <button type="button" data-color="#34c759" aria-label="绿色"><span class="swatch" style="--stroke:#34c759"></span></button>
      </div>
      <p class="minor">画笔粗细</p>

<script id="reference-materials" type="application/json">[{"material":1,"paragraphs":["为落实国家推动绿色物流、优化运输结构的政策，作为铁路物流业务的市场经营主体，江化铁路物流中心积极与江化市庆北工业园协调，整合物流资源，为园区企业提供全流程铁路运输服务。","庆北工业园是位于内陆地区的综合性产业基地。作为园区的龙头企业，盛力钢铁有限公司在距离主厂区不到一公里处新建了铁运原材料卸料区，数条铁路轨道在此交汇，火车车厢内的矿石由巨型翻车机倾倒进集料区，再通过传送带直接输送至原料厂。","过去，盛力钢铁主要通过公路运输矿石。公司曾经也试过铁路运输，工厂离港口距离仅75公里，但需先经铁路将矿石由码头运至30公里外的铁路货运站，再经汽车转运入厂。经成本核算，最终还是选择了公路运输。","“2020年初，我们与上级部门协同推进，新建了8条园区铁路专用线，实现非临港钢铁企业铁路专用线接入全覆盖。随后，经我们多方协调，港口、铁路及园区铁路专用线的物流费用均下调约50%，这样就比公路运输有了明显优势。”江化铁路物流中心张主任说。","物流费用的下降吸引了园区内不少钢铁企业选择铁路运输。然而，随着钢铁企业货物量的不断增长，铁路的运输和装卸能力又出现了新的瓶颈。对此，江化铁路物流中心经过反复研究论证，于2023年陆续启动了一系列升级改造项目。","“我们通过协调上级部门扩建铁路线路、增加班次，并为各个货运站升级改造装卸设备，从而提升整体运力，确保货物高效周转，保障企业的运输需求。”张主任说。","2023年11月，改造完成的江化货运北站新增一条到发线路，货场面积和装卸能力都增加了一倍，铁路的运输能力也增加了80%。扩能改造后，园区钢铁企业的铁路运输占比越来越高。江化铁路物流中心还依托铁路网络优势，整合社会物流资源，与多家钢铁企业签订了“物流总包”协议，运价降幅达14%。","2024年3月，盛力钢铁与江化铁路物流中心正式签署“物流总包”协议，全面启动铁路运输。“以前我们主要都是靠公路运输，现在有50%以上是铁路运输，铁路运输一吨能省3.5元。仅铁矿石一项，我们年运输量1100万吨，粗略计算，运输成本节省接近4000万元。”盛力钢铁田经理说，“根据‘物流总包’协议，年发运量超过300万吨即可享受26.5元/吨的总包价，这个价格很有吸引力。公路运输价格波动较大，成本不好控制。长期稳定的价格是我们经营的重要保障。”","“对于签订协议的企业，我们提供包括运输方案选择、交通工具衔接、物流装备开发和单证手续办理等‘一条龙’服务。同时，我们从前端放货到装车、挂运，一直到卸车，每个环节都有人盯控，确保货物安全。”张主任说。","实际上，除了服务像盛力钢铁这样有大宗货物运输需求的企业，江化铁路物流中心也关注到需要长距离运输的散货杂货。园区的富同有限公司是一家箱包进出口企业，箱包体积大、重量轻，货值不算太高。过去，像这种对物流成本比较敏感的进出口企业，大都设在沿海城市。但是，老板唐先生却把工厂设在了位于内陆地区的庆北工业园。“我是本地人，早有意愿回家乡投资，但我们以外贸为主，之前测算出的运费很不合适，所以一直没有落地。”唐先生说。","对于内陆地区，很多散杂货物来源都比较分散，无法直接用铁路专列运输。“打通铁路进港的‘最后一公里’，是实现多式联运‘无缝’切换的重要一环。”张主任说，“以往园区货物需要用汽车短驳至国际陆港，每个集装箱的拖车费是1700元。如今通过我们积极协调，开通了直通国际陆港的铁路专用线，实现了园区企业货物的就地发运。”","“相比海港城市，在内陆设厂主要差在内陆运费，能省下拖车费，成本就能降低不少。而内陆地区场地租赁和人工成本都比沿海地区要低，两头算下来在园区设厂更划算。”唐先生说。出于同样的考虑，越来越多的外贸企业把工厂搬到了庆北工业园。","“传统公路运输具有灵活便捷的优势，但在长距离、大宗货物运输方面，其能耗与排放相对较高。铁路运输则凭借其运量大、单位能耗低的特点，成为构建高效、低碳综合交通运输体系的关键环节。”张主任说。"]},{"material":2,"paragraphs":["走进路宇村的“巧手工坊”，数十位老年人正围坐在一起剥莲子。“在家闲着也是闲着，来这儿吹着空调挣钱，还能唠嗑。”72岁的何奶奶笑着说。","这个温暖场景的背后是年轻人苏晓返乡创业的故事。2019年，苏晓考察了多个农业项目都不太满意。困惑之际，她向父亲寻求建议。父亲老苏常年致力于莲子品种研究，恰巧发现了一个莲心清甜的野生莲种，并将其命名为“莲湖果莲”。父亲告诉她，相比其他项目，果莲市场的竞争比较小。因此，苏晓决定听从父亲的建议，做一名“果莲农人”。","2020年7月，苏晓在离家10公里的齐平区路宇村找到了规模化种植基地。该村河网密布，曾改造了千亩荷塘，但莲藕产业收益一直上不去。与村党支部孟书记交谈后，双方一拍即合。苏晓找到了理想的果莲种植基地，而路宇村也由此获得产业升级的契机。区政府得知这一合作意向后，非常支持，根据农业产业扶持政策提供了30万元创业补贴，并协调农技站专家组建帮扶小组。同年，苏晓联合村委会创办了“莲语农业”公司，并吸纳返乡青年负责种植技术和市场运营。公司通过土地流转获得50亩荷塘，开启规模化种植。","苏晓团队虚心向老师傅们请教，快速掌握了种植技术要领，但也很快遇到鲜食莲子采摘时机把控和保鲜两大难题。这导致产品损耗率很高，有限利润空间被大幅挤压。无奈之下，苏晓向区里寻求帮助。在区政府协调下，“莲语农业”联合省农科院、农业大学和电子科技大学的有关科研团队展开攻关，成功研发了成熟度识别准确率达95%的视觉系统，配合改进后的分段预冷和气调保鲜技术，莲子保鲜期延长至5天。2021年5月，该技术体系通过市级认证，推动制定了鲜食果莲的地方标准，为果莲产业的规范发展和价值提升打开了新局面。","在市场开拓初期，“莲语农业”又遇到了销售困境。因鲜食莲子保质期短且知名度低，多家大型综合商超拒绝合作。苏晓调整了思路：“小众产品也许更适合特色商超。”这一思路带来了转机，大型连锁生鲜超市“悦品鲜”的采购经理品鉴果莲后高度认可。当年夏季，莲湖果莲在“悦品鲜”上市，广受欢迎。","借助“悦品鲜”的供应链优势，莲湖果莲销至全国，年产值近千万元，同时带动了周边农产品的销售。产业快速发展的同时，用工短缺问题随之出现。果莲产业属于劳动密集型产业，莲蓬采摘和脱粒都需要人工操作。此时，苏晓注意到留在村里的近半村民都是老年人，便萌生了一个想法。与村委会沟通后，“莲语农业”发布了一份特殊的“招工启事”：招聘莲子脱粒员工，不限年龄，月薪3000元起……","第二天上午，加工点外聚集了七八十位前来应聘的中老年村民。面对远超预期的人数，苏晓决定全部录用，并将加工点命名为“巧手工坊”。“这一举措既解决了‘莲语农业’用工问题，也让这些人获得了一定收入。”孟书记说。","随着规模的扩大，“巧手工坊”开始吸引大学生的加入。这些年轻人主要负责技术研发与运营管理等工作，为“莲语农业”的发展注入了新的活力。“我很看好这个家门口的产业。”大学生小戴表示。","2024年底，“莲语农业”推出“藕鳖共养”生态养殖新模式。苏晓解释道：“甲鱼就像‘生态工人’，它们吃福寿螺保护莲藕，排泄物还能肥田，保护生态。”在实施过程中，“莲语农业”建立起一套严格的环保标准体系，包装环节采用氮气保鲜并拒绝使用防腐剂，种植环节创新使用沼液肥料。这套生态种植标准最终被纳入区农业技术推广手册。","2025年初，“莲语农业”的生态养殖模式在邻村得到推广，亩均收益提升40%，还带动了周边三个村庄共同发展。更可喜的是，这种生态农业模式吸引了文旅部门的关注，被区文旅局纳入“农耕体验游”特色项目。“借助项目资助，村里新建了栈道、凉亭，并增设了公共停车位、公厕等公共服务设施，不仅为游客提供了便利，村里整体环境也更好了。”孟书记兴奋地说。","看着满载莲子的货车驶出村口，苏晓感慨道：“农业产业化发展不是简单的规模扩张，而是要让产业链上的每个环节都能创造价值。我们最大的收获，是找到了经济效益、生态效益和社会效益‘三效’共生的实践之路。”"]},{"material":3,"paragraphs":["2025年1月，S市发布了一批“公众参与科学项目”。项目发布人S市科委负责人说：“我们大力推动‘专业科研+公众参与’这种公众科学模式的实施，是希望营造崇尚科学、尊重科学的浓厚氛围，提升市民科学素养，为知识生产注入新动能。”","目前，S市科委的“公众参与科学项目”网络平台上，正在持续推进一系列公众可参与的科学项目，例如“我的自然百宝箱”“鸟撞调查”“昆虫家谱”“貉口普查”等项目。这些项目由不同研究机构发起，每年持续更新并反馈研究成果。","以“貉口普查”项目为例，它由F大学和市林业总站于2019年联合发起，以公众科学模式开展对国家二级保护动物貉的研究。该项目补充了S市城市野生动物相关数据，构建起公众参与科学研究的新范式，2023年还被选入全市“生物多样性优秀实践案例”，2025年获得政府专项资助。","“貉口普查”项目负责人F大学章教授介绍说，公众科学模式是职业科学家与公众协同研究的科研模式，涵盖数据收集、技术探索、问题研究等方面。该模式打破了职业与年龄壁垒，让公众广泛参与到科学研究之中，既可以增加公众对科学的了解，也能从不同领域为科研人员提供启发。","10岁的豆豆对野生动物特别感兴趣，妈妈带着他参加了不少相关的科普讲座、科学讲坛活动。从前，他总感觉科学有点遥不可及，参加“貉口普查”活动后，豆豆觉得自己“离科学近了”。木匠许师傅凭借自学的昆虫摄影技术参与过多类公众科学活动，他说感觉自己就像一块海绵，每次参与都能吸收很多知识养分，还被评为了优秀参与者。软件工程师小郭已第三次担任普查领队，很享受“公众科学家”的隐藏身份，他说：“与一群志同道合的人做一件很纯粹的事，改变了我对科学家‘高冷’的刻板印象，其实他们很务实、很谦逊。”","2019年刚开始启动“貉口普查”项目时，章教授团队购置了80多台红外照相机，与市民共同布设于城市绿地、公园等区域，搭建起野生动物监测网络。这些设备至今仍在运行，曾拍摄到国家一级保护动物小灵猫因施工惊扰迁移的画面，科研人员据此预判其迁移路径会被小河阻隔，便联合绿化部门架设临时浮桥，帮助小灵猫安全渡河并找到新的栖息地。","“在项目实施过程中，我们发现短期集中调查更符合公众参与习惯。因此自2020年起，我们结合貉的活动规律与公众空闲时间，重新优化方案，设计了周末两天的集中调查路线。”章教授介绍。2023年夏，300多位经培训的市民，在周末夜间利用手电和城市灯光，调查貉的分布和数量，记录小区环境、猫粮投喂、垃圾管理等影响貉活动的状况。仅用两个夜晚，就完成了90个小区的普查，这相当于传统科研团队两个半月的工作量。目前，此项目已有千余名“公众科学家”参与。","“公众参与科学项目”以具体科学问题为导向，按照“项目发布-公众注册-项目培训-观察记录-数据上传-处理校验-研究结论”的流程推进。科研团队负责专业科研问题设计、任务拆解、课题项目发布。公众在“公众参与科学项目”线上平台注册报名，通过在线教程、直播培训、线下讲座等形式学习掌握设备使用、样本记录等，然后参与研究，如开展观察、记录并上传信息。最后，科研团队多源验证相关数据，形成并发布研究报告。例如，2024年12月发布的《S市昆虫名录》，收录物种数从3090种提升至3556种，其中20%的新增记录是公众科学家们发现的。","“我们支持各领域的科学家积极申报‘公众参与科学项目’，立项后将予以专项经费支持，以促进更多科学家、科学爱好者和其他志愿者直接开展更深入的科研合作。”S市科委负责人表示。近些年S市的“公众参与科学项目”主要集中在生态学领域，接下来将扩展到天文学、心理学等多个领域。目前S市科委正联合相关部门、高校、科研机构等进行筹备，计划在2026年1月发布8个项目。"]},{"material":4,"paragraphs":["为盘活农村闲置资产、增加农民财产性收入、促进城乡资源互补，G县积极探索“共享村落”试点项目。该项目旨在通过租赁闲置宅基地和农房使用权，吸引城市资本下乡，促进城乡融合发展。","G县“共享村落”试点项目于2023年5月正式启动，消息发出后引起广泛关注，村民们对这项政策充满了期待。大渭村村民王大婶兴奋地说：“我家老房空了好几年，要是租出去不仅能赚点钱，还能让城里人来村里住，热闹热闹。”G县政府积极推动政策落地，召开了多次专题推进会，并通过媒体进行大力宣传。","2023年7月，大渭村迎来了首位承租人——退休教师袁先生。一直向往乡村生活的袁先生夫妇获悉该项目后，多次咨询并实地考察，最终以4万元租金取得一处农房的10年使用权。袁先生坦言，除了价格比城里划算，他更看重的是田园生活。对于10年租期，72岁的他解释道：“如果82岁后身体还硬朗，再续签也不迟。”","此后几个月，尽管咨询和看房的人不少，但成交量并不理想。到2024年底，大渭村首批50户房源仅成交9户，其中6户为退休人员，3户为文创从业者，平均租金为3.8万元/10年，低于政府预期的5万元。G县其他村的情况也和大渭村差不多。","为深入了解“共享村落”试点项目推进缓慢的原因，加快项目推进速度，2025年3月，G县政府成立了专项调研组，对试点村落展开调研。","在大渭村，村民韩大爷说：“这房子毕竟是祖辈传下来的，租出去收不回来咋办？”来自外地的华先生表示：“我想把租的房子改造成民宿，但政策规定最长租20年。我投入了大量改造资金，20年后怎么办？”","在袁先生家，他带调研组参观了自己的菜园和改造后的房屋。袁先生说：“住在这里很舒服，空气也好。不过，有些地方确实需要改善，比如天然气普及和环境卫生，这些都会影响大家的居住意愿。”调研组注意到，大渭村村内道路比较狭窄，部分路段坑洼不平。此外，村里的污水处理设施简陋，生活垃圾也未能及时得到处理。","在大千村调研时，村党支部书记老程向调研组反映：“政策是好政策，但执行起来太难。我们村天然气入户申请交上去半年了还没有下文。我们也咨询了几个上级部门，都表示农村天然气项目一个部门说了不算，需要统筹协调才行。”","小阳村的村党支部徐书记向调研组讲起近期发生的一起纠纷。租户小吕在院子里办聚会，因声音过大而引发村民投诉。小吕向调研组解释：“我开了文创工作室，为聚人气，周末在院子里搞个小聚会。好多村民说我们‘太吵’‘不像话’。村里既没有合适的活动场所，也没有相关规定，确实不知道该如何把握分寸。”","调研组来到前卫村，村干部小刘向调研组反映：“最近有几个年轻人过来看房想开工作室，但一看村里啥都没有，就走了。要是能有个像样的咖啡馆或者书店，说不定能吸引更多人。”村党支部书记老宋叹了口气：“除了出租房子没啥别的了，年轻人来了连个能待得住的地方都没有。”","在调研过程中，调研组还重点关注了“新村民计划”项目的实施情况。该项目作为“共享村落”项目的子部分，旨在通过引入外来人才和项目盘活乡村资源，同时带动传统手工艺等本地特色产业的发展。项目运营负责人董经理介绍：“‘新村民’携带经营项目入驻，可通过‘基础租金+收益分成’模式获得空间使用权。根据合同，创业者需将20%营业收益投入村发展基金，并雇佣2名本地村民。”","然而，该项目实施效果并不理想。大渭村的竹编艺人杨师傅说：“‘新村民’带来了不少新项目，但我们这些本地传统工艺还是无人问津。竹编手艺搭不上这个便车。”小阳村陶艺师吴师傅也表示：“‘新村民’虽然开了陶艺工作室，但人家做的跟小阳村陶艺完全是两码事，对我们没啥帮助。”","调研组了解到，小阳村曾因“新村民计划”项目发生过冲突。村里的陶艺工作室运营三个月仍未按照承诺聘用2名帮工，一些村民产生了不满，并干扰工作室正常运营。调研组进一步调查发现，项目合同中缺乏对违约情形的具体约束条款，所以出现的纠纷难以得到有效解决。董经理反思道：“人人参与，人人共享，便是‘共享村落’的含义。但是理想与现实之间还存在不小差距，我们还有很长的路要走。”"]},{"material":5,"paragraphs":["2024年，由金教授领导的“环境考古”团队在某权威杂志上发表了关于古人类下颌骨化石的研究成果，为人类起源的研究提供了新视角。","“环境考古就是将目光投向更广阔的天地和更遥远的过往，其核心内容之一在于探讨过去的人地关系，即人类如何适应、利用和改造自然环境，以及这些环境变化如何反作用于人类社会，这要求站在不同学科的角度，借助考古发掘出来的各种遗存材料，解读人类与环境的互动历史。我们就是这样一支由考古学、地理学、地质学、生物学等多学科成员组成的‘跨界’团队。”团队成员季研究员说。","“2004年考研时，我从考古学专业转向地理学，加入导师金教授的‘环境考古’研究团队。当时，金教授交给我一个极具挑战性的课题：探讨‘现代人起源和扩散’。”团队的另一名成员赵老师回忆道。这意味着她不但要走出校园寻找遗址，还要不断摸索合适的研究方法。","“挑战确实不少。不过挑战就像锻炼时的痛苦一样，是成长和进步的必经之路。”她感慨道，“从纯粹的文科背景转向理科，需要补充大量地球科学和生物学知识，需要在全新环境中摸索前行。”在此过程中，她通过广泛阅读文献、参加讲座和研讨会等，逐渐构建起自己的知识体系。","2010年，博士研究生毕业后的她选择留在金教授的团队，成为一名老师。“在课程设置上，我们注重文科与理科的融合，让学生既学习考古学、历史学等人文社科课程，也学习地球科学、生物学等自然科学课程。”赵老师说，“团队鼓励学生广泛涉猎不同学科的知识，培养他们的跨学科思维和创新能力。”","团队成员小马本科攻读的是自然地理学，研究生阶段选择将环境考古作为研究方向。最终，她在古蛋白质组学领域形成独特优势，其研究成果已成功应用于多个研究项目，并获得了业内认可。","赵老师认为，良好的学术氛围对跨学科研究至关重要。团队特别注重营造开放、包容、创新的学术氛围，定期举行学术研讨会和讲座，邀请国内外知名学者来校交流，鼓励学生参加国际学术会议和实践项目，拓宽学术视野，增强实践能力。","“每周组会上，不管是博士生、硕士生，还是刚加入团队的本科生，都可以畅所欲言，提出质疑或建议。”博士生小郭印象深刻，“不管是谁汇报，赵老师都会鼓励大家随时提问，积极讨论。”","金教授深有感触地说：“团队的师生讨论，能突破同质思维局限，碰撞出多元化、差异化观点，推动大家探索新视角，提升决策和问题解决能力，进而促进突破性创新。正如美妙动听的器乐合奏是由多种乐器发出不同的音色并巧妙融合而产生的，多样性蕴含着创造力。”"]}]</script>
<script>
(() => {
  const byID = (id) => document.getElementById(id);
  const referenceMaterials = JSON.parse(byID("reference-materials").textContent);
  const params = new URLSearchParams(location.search);
  const storageKey = "shenlun-workspace-layout-refined-v1";
  const examplePaper = "national-2026";
  const standaloneGroup = "standalone-rail-demo";
  const exampleAnswer = "一是协调园区建设专用线，降低铁路运输费用。二是扩建线路、增加班次，升级货运站装卸设备，提高运输和周转能力。三是整合社会物流资源，与企业签订物流总包协议。";
  const exampleReference = "协调园区及有关部门建设专用线路，统筹港口、铁路和园区物流降费。扩建线路、增加班次并升级装卸设备，提高运力和周转效率。整合物流资源，实行物流总包，提供运输方案、交通衔接和全程盯控等服务。";

  function paperText(text) {

  function paperHeading(page) {

  function paginateMaterial(material, paragraphs) {
    const pages = [];
    const measure = document.createElement("div");
    measure.className = "paper-copy paper-measure";
    measure.setAttribute("aria-hidden", "true");
    document.body.appendChild(measure);
    let page = { id: uniq(), material, paragraphs: [] };
    measure.innerHTML = paperHeading(page);
    const overflows = () => measure.scrollHeight > measure.clientHeight;

    function nextPage(firstContinues) {
      pages.push(page);
      page = { id: uniq(), material, continues: true, firstContinues, paragraphs: [] };
      measure.replaceChildren();
      measure.classList.add("continuing");
    }

    for (const paragraph of paragraphs) {
      let remaining = Array.from(paragraph);
      while (remaining.length) {
        const node = document.createElement("p");
        if (page.firstContinues && !page.paragraphs.length) node.className = "paragraph-continuation";
        measure.appendChild(node);
        node.innerHTML = paperText(remaining.join(""));
        let length = remaining.length;
        if (overflows()) {
          let low = 0;
          let high = length - 1;
          while (low < high) {
            const middle = Math.ceil((low + high) / 2);
            node.innerHTML = paperText(remaining.slice(0, middle).join(""));
            if (overflows()) high = middle - 1;
            else low = middle;
          }
          length = low;
        }
        if (!length) {
          nextPage(false);
          continue;
        }
        const portion = remaining.slice(0, length).join("");
        node.innerHTML = paperText(portion);
        page.paragraphs.push(portion);
        remaining = remaining.slice(length);
        if (remaining.length) nextPage(true);
      }
    }
    pages.push(page);
    measure.remove();
    return pages;
  }

  function questionBlock(part) {
    return `<section class="question-block" data-paper-question="${escape(part.id)}">
      ${part.label ? `<h3>${escape(part.label)}</h3>` : ""}
      ${part.stem ? `<p class="question-copy-stem">${paperText(part.stem)}</p>` : ""}
      ${part.requirement ? `<p>${paperText(part.requirement)}</p>` : ""}
    </section>`;
  }

  function paginateQuestions(items) {
    if (!items.length) return [];
    const measure = document.createElement("div");
    measure.className = "paper-copy paper-measure question-copy";
    measure.setAttribute("aria-hidden", "true");
    document.body.appendChild(measure);
    measure.innerHTML = "<h2>作答要求</h2>";
    const pages = [];
    let blocks = [];
    const next = () => {
      if (blocks.length) pages.push({ id: `questions-${pages.length + 1}`, kind: "questions", blocks });
      blocks = [];
      measure.replaceChildren();
    };
    const fits = (block) => {
      measure.insertAdjacentHTML("beforeend", questionBlock(block));
      const okay = measure.scrollHeight <= measure.clientHeight;
      measure.lastElementChild.remove();
      return okay;
    };
    const append = (block) => { blocks.push(block); measure.insertAdjacentHTML("beforeend", questionBlock(block)); };
    for (const item of items) {
      const score = item.full && !/[（(]\s*\d+(\.\d+)?\s*分\s*[）)]\s*$/.test(item.stem) ? `（${item.full}分）` : "";
      const req = (item.requirement || "").trim();
      const stemChars = Array.from(item.stem + score);
      const reqChars = Array.from(req ? (/^要求[：:]/.test(req) ? req : `要求：${req.includes("\n") ? "\n" : ""}${req}`) : "");
      const cutoff = stemChars.length;
      const end = cutoff + reqChars.length;
      const piece = (from, to) => ({
        id: item.id, label: from === 0 ? item.number : "",
        stem: from < cutoff ? stemChars.slice(from, Math.min(to, cutoff)).join("") : "",
        requirement: to > cutoff ? reqChars.slice(Math.max(from - cutoff, 0), to - cutoff).join("") : ""
      });
      if (blocks.length && !fits(piece(0, end))) next();
      let from = 0;
      while (from < end) {
        let low = from + 1;
        let high = end;
        while (low < high) {
          const middle = Math.ceil((low + high) / 2);
          if (fits(piece(from, middle))) low = middle;
          else high = middle - 1;
        }
        append(piece(from, low));
        if (low < end) next();
        from = low;
      }
    }
    next();
    measure.remove();
    return pages;
  }

  async function watchVisiblePages(visiblePages) {
    await document.fonts.ready;
    if (route !== "detail" || rendered !== visiblePages) return;
    const canvases = visiblePages.filter((page) => page.canvas);
    const pagesByElement = new Map(canvases.map((page) => [page.shell, page]));
    pageObserver = new IntersectionObserver((entries) => {
      if (route !== "detail" || rendered !== visiblePages) return;
      let updateActive = false;
      for (const entry of entries) {
        const page = pagesByElement.get(entry.target);
        if (!entry.isIntersecting) {
          page.canvas.width = 1;
          page.canvas.height = 1;
          continue;
        }
        if (page.id === "m1-1") seedDemonstration(page);
        redraw(page);
        if (page === rendered[activePage]) updateActive = true;
      }
      if (updateActive) updateTools();
    }, { root: docScroll, rootMargin: "280px" });
    for (const page of canvases) pageObserver.observe(page.shell);
  }

  function scaleForWidth() {
    const padding = docScroll.clientWidth < 540 ? 20 : 26;
    return Math.min(1, Math.max(.40, (docScroll.clientWidth - padding) / paperWidth)) * zoom;
  }

  function applySize() {
    if (!rendered.length || docScroll.clientWidth === 0) return;
    const scale = scaleForWidth();
    for (const page of rendered) {
      page.shell.style.width = `${paperWidth * scale}px`;
      page.shell.style.height = `${paperHeight * scale}px`;
      page.paper.style.transform = `scale(${scale})`;
    }
    byID("pages").style.paddingBottom = `${Math.max(0, docScroll.clientHeight - paperHeight * scale - 24)}px`;
    byID("zoom-label").textContent = `${Math.round(scale * 100)}%`;
  }

  function rememberReading() {
    const page = rendered[activePage];
    if (!current || !page || !docScroll.clientWidth) return;
    const offset = Math.max(0, docScroll.scrollTop - page.shell.offsetTop) / scaleForWidth();
    readingPositions.set(current.id, { page: page.id, offset });
  }

  function scrollToPage(id, offset = 0) {
    const page = rendered.find((value) => value.id === id);
    if (!page) return;
    activePage = rendered.indexOf(page);
    docScroll.scrollTo({ top: page.shell.offsetTop + offset * scaleForWidth(), left: docScroll.scrollLeft, behavior: "instant" });
    updatePageStatus();
  }

  function restoreReading(item) {
    const resume = readingPositions.get(item.id);
    const first = rendered.find((page) => item.materialRefs?.includes(page.material)) ?? rendered[0];
    const target = resume && rendered.some((page) => page.id === resume.page) ? resume : first ? { page: first.id, offset: 0 } : null;
    if (target && docScroll.clientWidth) scrollToPage(target.page, target.offset);
  }

  function navigateQuestion(item) {
