<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="考公复盘">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4A90E2">
  <link rel="manifest" href="manifest.json?v=67">
  <link rel="apple-touch-icon" href="icon-180.png?v=67">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png?v=67">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png?v=67">
  <title>考公笔试复盘系统</title>
  <!-- 笔记查看层 Markdown 渲染（marked.js + github-markdown-css，CDN） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css/github-markdown.css">
  <!--BUILD_CSS-->
</head>
<body>
  <div id="app">
    <!-- 复盘首页 -->
    <section id="page-home" class="page"></section>
    <!-- 错题本 -->
    <section id="page-errors" class="page" style="display:none"></section>
    <!-- 笔记 -->
    <section id="page-notes" class="page" style="display:none"></section>
    <!-- 套卷记录 -->
    <section id="page-exams" class="page" style="display:none"></section>
    <!-- 科目专属复盘工作台 -->
    <section id="page-workspace" class="page" style="display:none"></section>
    <!-- 错题详情 -->
    <section id="page-error-detail" class="page" style="display:none"></section>
    <!-- 笔记详情 -->
    <section id="page-note-detail" class="page" style="display:none"></section>
    <!-- 套卷详情 -->
    <section id="page-exam-detail" class="page" style="display:none"></section>
    <!-- 添加/编辑错题 -->
    <section id="page-error-form" class="page" style="display:none"></section>
    <!-- 添加/编辑笔记 -->
    <section id="page-note-form" class="page" style="display:none"></section>
    <!-- 添加/编辑套卷 -->
    <section id="page-exam-form" class="page" style="display:none"></section>
    <!-- 设置页 -->
    <section id="page-settings" class="page" style="display:none"></section>
    <!-- 词语库 -->
    <section id="page-worddb" class="page" style="display:none"></section>
    <section id="page-kpmanage" class="page" style="display:none"></section>
    <!-- 学习统计（日历） -->
    <section id="page-study-stats" class="page" style="display:none"></section>
    <!-- 速算练习 -->
    <section id="page-speed-calc" class="page" style="display:none"></section>
  </div>

  <!-- 底部导航栏 -->
  <nav id="bottom-nav">
    <a href="#home" data-tab="home" class="nav-item active">

      <span class="nav-label">首页</span>
    </a>
    <a href="#errors" data-tab="errors" class="nav-item">

      <span class="nav-label">错题</span>
    </a>
    <a href="#notes" data-tab="notes" class="nav-item">
      <span class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/><line x1="10" y1="7" x2="14" y2="7"/><line x1="10" y1="11" x2="14" y2="11"/></svg></span>
      <span class="nav-label">笔记</span>
    </a>
    <a href="#exams" data-tab="exams" class="nav-item">
      <span class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
      <span class="nav-label">套卷</span>
      <span class="nav-badge" style="display:none">0</span>
    </a>
    <a href="#settings" data-tab="settings" class="nav-item">
      <span class="nav-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></span>
      <span class="nav-label">设置</span>
    </a>
  </nav>

  <!-- 悬浮操作按钮 -->
  <button id="fab" class="fab" title="新建">+</button>

  <!-- Toast 容器 -->
  <div id="toast-container"></div>

  <!-- Modal 容器 -->
  <div id="modal-container"></div>

  <!-- 隐藏的文件导入 input -->
  <input type="file" id="import-file-input" accept=".json" style="display:none">

  <!-- 常驻版本角标（方便核对是否最新版） -->
  <div class="version-badge" id="version-badge"></div>

  <!-- 笔记查看层 Markdown 渲染引擎（marked.js，CDN；需先于 app.js 加载） -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!--BUILD_JS-->
</body>
</html>
